<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>よぴぴっぴのゲーム棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: night arcade shelf — logo bar, featured newest game, category chips, cartridge-like cards in a dense grid */
:root{
  --bg:#12152a;
  --bg-2:#1a1e38;
  --card:#20254a;
  --line:#2f3566;
  --fg:#f4f1ff;
  --dim:#9aa0cc;
  --accent:#ffd23f;
  --accent-ink:#2a1d00;
  --act:#ff7a6b;
  --puz:#5fd4e8;
  --tbl:#b6e36a;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);
  background-image:radial-gradient(var(--bg-2) 1.2px,transparent 1.2px);
  background-size:18px 18px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--display);font-size:clamp(24px,7vw,34px);line-height:1;letter-spacing:.02em;margin:0}
.logo small{display:block;font-size:.42em;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}
.logo b{color:var(--accent);font-weight:400}
.count{font-family:var(--display);font-size:13px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.chip:focus-visible,.card:focus-visible,.hero:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* featured */
.hero{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:16px;align-items:center;
  background:linear-gradient(135deg,var(--card),var(--bg-2));border:1px solid var(--line);border-radius:20px;padding:12px;
  color:inherit;text-decoration:none;transition:transform .12s ease}
.hero img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;display:block;background:var(--bg)}
.hero .txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .new{align-self:flex-start;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:3px 8px}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,6.4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.7}
.play{align-self:flex-start;font-family:var(--display);font-size:16px;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 22px;box-shadow:0 4px 0 #b8901a}
.hero:active{transform:scale(.985)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 14px var(--body);color:var(--fg);background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sort{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.sort button{font:700 13px var(--body);color:var(--dim);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;transition:background .15s,color .15s}
.sort button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sort button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 7px 11px;
  color:inherit;text-decoration:none;transition:transform .12s ease,border-color .12s ease;min-width:0}
.card img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:block;background:var(--bg)}
.card.wide{grid-column:span 2}
.card.wide img{aspect-ratio:16/9}
.card .shot{position:relative}
.card .plays{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:4px;font:700 12px var(--body);font-variant-numeric:tabular-nums;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 8px}
.card .plays svg{width:14px;height:14px;fill:currentColor}
.card .name{font-weight:700;font-size:15px;line-height:1.35;display:flex;align-items:baseline;gap:7px;padding-inline:4px}
.card .name i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px)}
.card .tag{font-size:12px;line-height:1.55;color:var(--dim);padding-inline:4px}
.card:active{transform:scale(.97)}
@media (hover:hover){.card:hover,.hero:hover{transform:translateY(-3px);border-color:var(--accent)}}
.cat-act{--c:var(--act)} .cat-puz{--c:var(--puz)} .cat-tbl{--c:var(--tbl)}

@media (min-width:640px){.hero{grid-template-columns:240px minmax(0,1fr);padding:16px;gap:24px}.hero p{font-size:15px}}
@media (prefers-reduced-motion:reduce){.card,.hero,.chip{transition:none}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tabs button{font:400 14px var(--display);letter-spacing:.02em;white-space:nowrap;color:var(--dim);background:none;border:0;border-radius:10px;padding:10px 4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s}
.tabs button svg{width:16px;height:16px;fill:currentColor;flex:none}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font:400 20px var(--display);margin:0;letter-spacing:.02em}
.sec-h p{margin:0;color:var(--dim);font-size:13px}
.lead{margin:0;color:var(--dim);font-size:14px;line-height:1.75;max-width:62ch}

/* reading cards */
.reads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.read{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px;
  color:inherit;text-decoration:none;min-width:0;transition:transform .12s ease,border-color .12s ease}
.read .k{align-self:flex-start;font:700 11px var(--body);letter-spacing:.12em;border-radius:6px;padding:2px 7px;background:var(--bg);border:1px solid var(--line);color:var(--dim)}
.read .k.cap{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.read b{font-size:16px;line-height:1.4}
.read span.d{font-size:13px;line-height:1.65;color:var(--dim)}
.read:active{transform:scale(.98)}
@media (hover:hover){.read:hover{transform:translateY(-2px);border-color:var(--accent)}}
.read:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* guide list */
.glist{display:flex;flex-direction:column;gap:10px}
.gd{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gd[open]{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.gd summary{list-style:none;display:grid;grid-template-columns:52px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:9px 12px 9px 9px;cursor:pointer}
.gd summary::-webkit-details-marker{display:none}
.gd summary:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:14px}
.th{width:52px;height:52px;border-radius:9px;object-fit:cover;object-position:top;background:var(--bg);display:block}
.gd .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.gd .t b{font-size:15px;line-height:1.35;display:flex;align-items:baseline;gap:7px}
.gd .t b i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.gd .t span{font-size:12px;color:var(--dim);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd .chev{width:20px;height:20px;fill:var(--dim);transition:transform .2s ease}
.gd[open] .chev{transform:rotate(180deg)}
.gb{padding:2px 16px 16px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.75}
.gb h3{margin:0 0 4px;font:700 12px var(--body);letter-spacing:.14em;color:var(--c)}
.gb p{margin:0}
.gb ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.gb ul li::marker{color:var(--c)}
.gb .acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:700 13px var(--body);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;text-decoration:none;cursor:pointer;
  border:1px solid var(--line);background:var(--bg-2);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* bgm */
.bgm-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tracks{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.trk{position:relative;display:grid;grid-template-columns:24px 48px minmax(0,1fr) auto 42px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:8px 10px;overflow:hidden}
.trk .no{font:400 13px var(--display);color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.trk .th{width:48px;height:48px}
.trk .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.trk .t b{font-size:15px;line-height:1.35}
.trk .t span{font-size:12px;color:var(--dim);line-height:1.5}
.trk .t small{font-size:11.5px;color:var(--dim);opacity:.85;line-height:1.5}
.trk .len{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pp{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg-2);color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.pp svg{width:18px;height:18px;fill:currentColor}
.pp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.trk.on{border-color:var(--accent)}
.trk.on .pp{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.trk.on .no{color:var(--accent)}
.trk .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:6px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq[hidden]{display:none}
.th.w{object-position:center}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.paused .eq i{animation-play-state:paused}

.player{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg-2) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.player .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.player .th{width:44px;height:44px}
.player .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.player .t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.player input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:16px}
.player .ctl{display:flex;gap:4px;align-items:center}
.player .ctl button{width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.player .ctl button.main{background:var(--accent);color:var(--accent-ink);width:44px;height:44px}
.player .ctl svg{width:18px;height:18px;fill:currentColor}
.player .ctl button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.has-player .wrap{padding-bottom:110px}
@media (max-width:420px){.trk{grid-template-columns:44px minmax(0,1fr) 42px}.trk .no,.trk .len{display:none}.trk .th{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:8px}.read,.gd .chev{transition:none}}

</style>

<div class="wrap">
  <header>
    <h1 class="logo"><small>よぴぴっぴの</small>ゲーム<b>棚</b></h1>
    <span class="count" id="count"></span>
  </header>

  <nav class="tabs" role="tablist" aria-label="ページ">
    <button type="button" role="tab" id="tab-games" aria-controls="p-games" data-t="games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10a5 5 0 0 1 0 10c-1.5 0-2.4-.8-3.2-1.6-.5-.5-1-.9-1.8-.9s-1.3.4-1.8.9C9.4 16.2 8.5 17 7 17A5 5 0 0 1 7 7zm1 3v1.5H6.5v1.5H8v1.5h1.5V13H11v-1.5H9.5V10H8zm7.5.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>ゲーム</button>
    <button type="button" role="tab" id="tab-guide" aria-controls="p-guide" data-t="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6a3 3 0 0 1 1 .2A3 3 0 0 1 13 4h6v14h-6a2 2 0 0 0-1 .3 2 2 0 0 0-1-.3H5V4zm2 2v10h4c.4 0 .7 0 1 .1V7a1 1 0 0 0-1-1H7zm6 1v9.1c.3-.1.6-.1 1-.1h3V6h-3a1 1 0 0 0-1 1zM4 19h7a1 1 0 0 1 2 0h7v1h-7.5a1 1 0 0 1-1 0H4v-1z"/></svg>解説・攻略</button>
    <button type="button" role="tab" id="tab-bgm" aria-controls="p-bgm" data-t="bgm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3v12.5a3.5 3.5 0 1 1-2-3.2V7.2l-8 1.6v8.7a3.5 3.5 0 1 1-2-3.2V5.4L19 3z"/></svg>BGM</button>
  </nav>

  <section class="panel" id="p-games" role="tabpanel" aria-labelledby="tab-games">
  <a class="hero" id="hero" target="_blank" rel="noopener"></a>

  <div class="bar">
    <nav class="chips" id="chips" aria-label="ジャンル"></nav>
    <div class="sort" id="sort" role="group" aria-label="並び順">
      <button type="button" id="sort-new" data-s="new">新着順</button>
      <button type="button" id="sort-pop" data-s="pop">人気順</button>
      <button type="button" id="sort-title" data-s="title">タイトル順</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>
  </section>

  <section class="panel" id="p-guide" role="tabpanel" aria-labelledby="tab-guide" hidden>
    <div class="sec-h"><h2>読みもの</h2><p>攻略ページとしくみの解説</p></div>
    <div class="reads" id="reads"></div>
    <div class="sec-h"><h2>ゲーム別 攻略メモ</h2><p id="gcount"></p></div>
    <nav class="chips" id="gchips" aria-label="攻略のジャンル"></nav>
    <div class="glist" id="glist"></div>
  </section>

  <section class="panel" id="p-bgm" role="tabpanel" aria-labelledby="tab-bgm" hidden>
    <div class="bgm-top">
      <p class="lead">ゲームの中で流れている曲を、効果音を抜いて録音したもの。<span id="bcount"></span></p>
      <button type="button" class="btn pri" id="playAll"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>全曲を続けて再生</button>
    </div>
    <ol class="tracks" id="tracks"></ol>
  </section>
</div>

<div class="player" id="player" hidden>
  <div class="in">
    <img class="th" id="plImg" alt="">
    <div class="t">
      <b id="plName"></b>
      <div class="row"><span id="plCur">0:00</span><input type="range" id="plSeek" min="0" max="100" step="0.1" value="0" aria-label="再生位置"><span id="plDur">0:00</span></div>
    </div>
    <div class="ctl">
      <button type="button" id="plPrev" aria-label="前の曲"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" class="main" id="plPlay" aria-label="再生"><svg viewBox="0 0 24 24" id="plIco"><path d="M7 5l12 7-12 7z"/></svg></button>
      <button type="button" id="plNext" aria-label="次の曲"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
</div>
<audio id="au" preload="none"></audio>


<script>
// ---- game list: newest first. To add a game, add one line at the top. ----
const GAMES = [
  {id:"dochira",   title:"どっちが安い?",       cat:"puz", url:"https://claude.ai/artifact/PuzvXkDbzsbHGrE7RTWXjc", tag:"2つの値札を単価で比べて、安いほうを選ぶ10問勝負。"},
  {id:"hfcircuit",  title:"ひとふでサーキット",  cat:"act", url:"https://claude.ai/artifact/6uLbb1u4geqYCdFDxcsSQB", tag:"指で一筆書きしたコースで、CPU3台と競うレース。"},
  {id:"arrowcross", title:"アローフォール クロス", cat:"act", url:"https://claude.ai/artifact/XVqDEVdUT2EMW3q5hr7M3e", tag:"6曲・2レーン/3レーンを選べる、矢印音ゲーの続編。"},
  {id:"sunsetgp",   title:"サンセットGP",        cat:"act", url:"https://claude.ai/artifact/9qqtF5muXmycG7QxmcHcVg", tag:"夕焼けのコースをCPU5台と3周走る、レトロな疑似3Dレース。", wide:true},
  {id:"circlebreak", title:"サークルブレイク3",   cat:"act", url:"https://claude.ai/artifact/VKX5VQxBHuUmP2MVJKo2h7", tag:"円形の盤を回して球を返し、中心のコアを壊すブロック崩し。"},
  {id:"tenpoker",   title:"10JQKAポーカー",      cat:"tbl", url:"https://claude.ai/artifact/2aUTNe7oZ92WELuNDfQBSU", tag:"10・J・Q・K・Aの20枚だけで遊ぶ、CPUとのドローポーカー。"},
  {id:"tsukimochi", title:"月のもち屋",          cat:"act", url:"https://claude.ai/artifact/ACZakgwRZghvdFXmdZBdit", tag:"臼でもちをつき、設備を増やして月まで稼ぐ放置クリッカー。"},
  {id:"mancala",    title:"マンカラ",             cat:"tbl", url:"https://claude.ai/artifact/YU61LshU7X2FovpdpYgGmE", tag:"石を配って自陣のストアに集める、CPUとの頭脳戦。", wide:true},
  {id:"speed123",   title:"的わり 1・2・3",      cat:"act", url:"https://claude.ai/artifact/HRqKkgDb6jibnM4wPx2iNT", tag:"並んだ的を1・2・3の順に撃ち抜く30秒勝負。"},
  {id:"colorspeed", title:"カラースピード",       cat:"tbl", url:"https://claude.ai/artifact/RsX451mxpdNRENRoEAAAdd", tag:"4色のカードで±1をつなぐ、CPUとの早出し勝負。"},

const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const key = g => toHira(YOMI[g.id] || g.title);
const coll = new Intl.Collator("ja");
const SORTS = ["new","pop","title"];
let sortBy = "new";
try { const v = localStorage.getItem("shelf-sort"); if (SORTS.includes(v)) sortBy = v; } catch (e) {}

const $ = id => document.getElementById(id);
const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));

// ---- views: each person keeps their own doc plays/<id> = {g:{gameId:opens}}; 人気 = total opens across everyone ----
let pop = {};            // gameId -> total opens
let firstSnap = true;
let myId = null, myCounts = {}, db = null, writing = Promise.resolve();
function aggregate(snap){
  const p = {};
  for (const d of snap.docs) {
    const g = (d.data() || {}).g || {};
    for (const [k, n] of Object.entries(g)) {
      if (!byId[k] || typeof n !== "number" || n <= 0) continue;
      p[k] = (p[k] || 0) + n;
    }
    if (myId && d.id === myId) myCounts = {...g};
  }
  pop = p;
  // reorder only on the first load; later updates just refresh the numbers so the card you tapped stays in place
  if (firstSnap) { firstSnap = false; if (sortBy === "pop") renderGrid(); }
  else updateViews();
}
async function initPop(){
  if (!window.claude?.use) return;
  const [d, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!d) return;
  db = d;
  try { myId = user ? await user.id() : null; } catch (e) {}
  db.collection("plays").onSnapshot(aggregate, () => {});
}
function recordPlay(id){
  if (!db || !myId) return;
  myCounts[id] = (myCounts[id] || 0) + 1;
  const body = {g: {...myCounts}};
  writing = writing.then(() => db.doc("plays/" + myId).set(body)).catch(() => {});
}

// ---- render ----
function img(g){ return `<img src="shots/${g.id}.webp" alt="${g.title}の画面" loading="lazy" decoding="async">`; }
function renderHero(){
  const g = GAMES[Math.floor(Math.random() * GAMES.length)], h = $("hero");
  h.href = g.url; h.dataset.id = g.id;
  h.className = "hero cat-" + g.cat;
  h.innerHTML = `${img(g).replace(' loading="lazy"','')}
    <div class="txt"><span class="new">PICK UP</span><h2>${g.title}</h2><p>${g.tag}</p><span class="play">あそぶ</span></div>`;
}
let current = "all";
try { current = localStorage.getItem("shelf-cat") || "all"; } catch (e) {}
function renderChips(){
  $("chips").innerHTML = CATS.map(([k,l]) =>
    `<button class="chip cat-${k}" type="button" data-k="${k}" aria-pressed="${k===current}" id="chip-${k}">${k==="all"?"":"<i></i>"}${l}</button>`).join("");
}
const order = Object.fromEntries(GAMES.map((g, i) => [g.id, i]));
function sorted(){
  const a = [...GAMES];
  if (sortBy === "title") return a.sort((x, y) => coll.compare(key(x), key(y)));
  if (sortBy === "pop") return a.sort((x, y) => (pop[y.id] || 0) - (pop[x.id] || 0) || order[x.id] - order[y.id]);
  return a;
}
const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.2 1.5 12c1.2 2.8 5 7 10.5 7s9.3-4.2 10.5-7C21.3 9.2 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2.2a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z"/></svg>';
function updateViews(){
  if (sortBy !== "pop") return;
  document.querySelectorAll(".card[data-id]").forEach(c => {
    const b = c.querySelector(".plays"); if (!b) return;
    const n = pop[c.dataset.id] || 0;
    b.hidden = !n; b.innerHTML = EYE + n;
  });
}
function renderGrid(){
  const list = sorted().filter(g => current==="all" || g.cat===current);
  $("grid").innerHTML = list.map(g => {
    const n = sortBy === "pop" ? `<span class="plays"${pop[g.id] ? "" : " hidden"}>${EYE}${pop[g.id] || 0}</span>` : "";
    return `<a class="card cat-${g.cat}${g.wide?" wide":""}" href="${g.url}" data-id="${g.id}" target="_blank" rel="noopener">
      <div class="shot">${img(g)}${n}</div><div class="name"><i></i>${g.title}</div><div class="tag">${g.tag}</div></a>`;
  }).join("");
  $("count").textContent = GAMES.length + "本";
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  current = b.dataset.k; try{ localStorage.setItem("shelf-cat", current); }catch(e){}
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c===b));
  renderGrid();
});
function setSort(){ document.querySelectorAll("#sort button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s===sortBy)); }
$("sort").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.dataset.s===sortBy) return;
  sortBy = b.dataset.s; try{ localStorage.setItem("shelf-sort", sortBy); }catch(e){}
  setSort(); renderGrid();
});
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-id]"); if (a) recordPlay(a.dataset.id);
});

if(!CATS.some(c=>c[0]===current)) current = "all";
renderHero(); renderChips(); setSort(); renderGrid();

const READS = [{"title": "夜勤の倉庫番 攻略", "kind": "攻略", "game": "souko", "url": "https://claude.ai/artifact/WGZ29ZLpsab9TQV6z69a8r", "desc": "全22ステージの解き方。各ステージのボードが解答手順どおりに動く。"}, {"title": "ライツアウト攻略", "kind": "攻略", "game": "lightsout", "url": "https://claude.ai/artifact/Do2APxoHVwbUY5gq6y748K", "desc": "追っかけ法とサイズ別の表で、どんな盤面でも必ず全部消せる。ソルバーつき。"}, {"title": "オセロのしくみ", "kind": "解説", "game": "shisho", "url": "https://claude.ai/artifact/84UGC36xDA3xfx1yPqnw2p", "desc": "8×8の配列と8方向の探索でオセロが動くしくみを、盤で試しながら読める。"}, {"title": "小銭の5秒勘定のしくみ", "kind": "解説", "game": "kozeni", "url": "https://claude.ai/artifact/AitSWHzZr6NetRAhvgqRP3", "desc": "コインの並べ方・効果音・エフェクトの作り方を、動かしながら解説。"}, {"title": "キューブ完全攻略", "kind": "攻略", "game": null, "url": "https://claude.ai/artifact/GHMFkTC1SQxhtQYqRB6tNU", "desc": "ルービックキューブの記号から7ステップの解法、CFOPまで。シミュレーターつき。"}, {"title": "ソート図鑑", "kind": "解説", "game": null, "url": "https://claude.ai/artifact/XSocY8vD9VB7dCKAa1dmc3", "desc": "並べ替えアルゴリズムの比較と交換を、アニメーションで見比べる図鑑。"}, {"title": "迷路生成ラボ", "kind": "解説", "game": null, "url": "https://claude.ai/artifact/LiAkwnkRU8JkWYoGJzsVkP", "desc": "9つの迷路生成方式を動かして、できあがる迷路のクセを見比べる。"}];
const PLAY_I = '<path d="M7 5l12 7-12 7z"/>', PAUSE_I = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9l5 5 5-5z"/></svg>';
const thumb = (g, cls = "th") => `<img class="${cls}${g.wide ? " w" : ""}" src="shots/${g.id}.webp" alt="" loading="lazy" decoding="async">`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

// tabs
const TABS = ["games","guide","bgm"];
let tab = "games";
const fromHash = () => { const h = (location.hash || "").slice(1); return TABS.includes(h) ? h : null; };
try { tab = fromHash() || localStorage.getItem("shelf-tab") || "games"; } catch (e) { tab = fromHash() || "games"; }
if (!TABS.includes(tab)) tab = "games";
function showTab(t, push){
  tab = t;
  TABS.forEach(k => {
    const b = $("tab-" + k), p = $("p-" + k);
    b.setAttribute("aria-selected", k === t); b.tabIndex = k === t ? 0 : -1;
    p.hidden = k !== t;
  });
  try { localStorage.setItem("shelf-tab", t); } catch (e) {}
  if (push) { try { history.replaceState(null, "", t === "games" ? location.pathname + location.search : "#" + t); } catch (e) {} }
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  showTab(b.dataset.t, true); window.scrollTo({top: 0});
});
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = (TABS.indexOf(tab) + (e.key === "ArrowRight" ? 1 : 2)) % 3;
  showTab(TABS[i], true); $("tab-" + TABS[i]).focus();
});
window.addEventListener("hashchange", () => { const h = fromHash(); if (h) showTab(h, false); });

// reads
$("reads").innerHTML = READS.map(r => {
  const g = r.game && byId[r.game];
  return `<a class="read" href="${r.url}" target="_blank" rel="noopener">
    <span class="k${r.kind === "攻略" ? " cap" : ""}">${r.kind}${g ? "・" + esc(g.title) : ""}</span>
    <b>${esc(r.title)}</b><span class="d">${esc(r.desc)}</span></a>`;
}).join("");

// guide list
let gcat = "all";
function renderGChips(){
  $("gchips").innerHTML = CATS.map(([k,l]) =>
    `<button class="chip cat-${k}" type="button" data-k="${k}" aria-pressed="${k===gcat}" id="gchip-${k}">${k==="all"?"":"<i></i>"}${l}</button>`).join("");
}
function renderGuides(){
  const list = GAMES.filter(g => GUIDES[g.id] && (gcat === "all" || g.cat === gcat));
  $("gcount").textContent = list.length + "本";
  $("glist").innerHTML = list.map(g => {
    const d = GUIDES[g.id], r = READS.find(x => x.game === g.id);
    return `<details class="gd cat-${g.cat}" id="guide-${g.id}">
      <summary>${thumb(g)}<span class="t"><b><i></i>${esc(g.title)}</b><span>${esc(d.rule)}</span></span>${CHEV}</summary>
      <div class="gb">
        <div><h3>ルール</h3><p>${esc(d.rule)}</p></div>
        <div><h3>操作</h3><ul>${d.controls.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
        <div><h3>攻略のコツ</h3><ul>${d.tips.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
        <div class="acts">
          <a class="btn pri" href="${g.url}" data-id="${g.id}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>あそぶ</a>
          ${r ? `<a class="btn" href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a>` : ""}
          ${d.bgm ? `<button type="button" class="btn" data-listen="${g.id}">${'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3v12.5a3.5 3.5 0 1 1-2-3.2V7.2l-8 1.6v8.7a3.5 3.5 0 1 1-2-3.2V5.4L19 3z"/></svg>'}BGMを聴く</button>` : ""}
        </div>
      </div></details>`;
  }).join("");
}
$("gchips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  gcat = b.dataset.k;
  document.querySelectorAll("#gchips .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  renderGuides();
});
$("glist").addEventListener("click", e => {
  const b = e.target.closest("[data-listen]"); if (!b) return;
  showTab("bgm", true); playIdx(TRACKS.findIndex(t => t.id === b.dataset.listen));
  const row = $("trk-" + b.dataset.listen); if (row) row.scrollIntoView({block: "center"});
});

// bgm
const TRACKS = GAMES.filter(g => GUIDES[g.id] && GUIDES[g.id].bgm).map(g => ({id: g.id, game: g, ...GUIDES[g.id].bgm}));
const au = $("au");
let cur = -1, auto = false;
$("bcount").textContent = `全${TRACKS.length}曲。`;
$("tracks").innerHTML = TRACKS.map((t, i) => `<li class="trk" id="trk-${t.id}" data-i="${i}">
  <span class="no">${i + 1}</span>${thumb(t.game)}
  <span class="t"><b>${esc(t.name)}<span class="eq" hidden><i></i><i></i><i></i></span></b><span>${esc(t.game.title)}</span><small>${esc(t.note)}</small></span>
  <span class="len">${fmt(t.sec)}</span>
  <button type="button" class="pp" aria-label="${esc(t.name)}を再生"><svg viewBox="0 0 24 24">${PLAY_I}</svg></button>
  <span class="bar"></span></li>`).join("");
function paint(){
  const playing = cur >= 0 && !au.paused;
  document.querySelectorAll(".trk").forEach(el => {
    const on = +el.dataset.i === cur;
    el.classList.toggle("on", on); el.classList.toggle("paused", on && !playing);
    el.querySelector(".eq").hidden = !on;
    el.querySelector(".pp svg").innerHTML = on && playing ? PAUSE_I : PLAY_I;
    el.querySelector(".pp").setAttribute("aria-label", TRACKS[+el.dataset.i].name + (on && playing ? "を一時停止" : "を再生"));
    if (!on) el.querySelector(".bar").style.width = "0";
  });
  $("plIco").innerHTML = playing ? PAUSE_I : PLAY_I;
  $("plPlay").setAttribute("aria-label", playing ? "一時停止" : "再生");
}
function playIdx(i){
  if (i < 0 || i >= TRACKS.length) return;
  const t = TRACKS[i];
  if (i !== cur) {
    cur = i; au.src = "bgm/" + t.id + ".mp3";
    $("plImg").src = "shots/" + t.id + ".webp"; $("plName").textContent = t.name + " — " + t.game.title;
    $("plDur").textContent = fmt(t.sec); $("plCur").textContent = "0:00"; $("plSeek").value = 0;
  }
  $("player").hidden = false; document.body.classList.add("has-player");
  const p = au.play(); if (p && p.catch) p.catch(() => paint());
  paint();
}
function toggle(){ if (cur < 0) return playIdx(0); au.paused ? playIdx(cur) : au.pause(); }
$("tracks").addEventListener("click", e => {
  const row = e.target.closest(".trk"); if (!row) return;
  const i = +row.dataset.i;
  if (i === cur) toggle(); else { auto = true; playIdx(i); }
});
$("playAll").addEventListener("click", () => { auto = true; playIdx(0); });
$("plPlay").addEventListener("click", toggle);
$("plPrev").addEventListener("click", () => { if (au.currentTime > 3) au.currentTime = 0; else playIdx((cur - 1 + TRACKS.length) % TRACKS.length); });
$("plNext").addEventListener("click", () => playIdx((cur + 1) % TRACKS.length));
$("plSeek").addEventListener("input", e => { if (au.duration) au.currentTime = e.target.value / 100 * au.duration; });
au.addEventListener("timeupdate", () => {
  if (cur < 0 || !au.duration) return;
  const r = au.currentTime / au.duration * 100;
  $("plSeek").value = r; $("plCur").textContent = fmt(au.currentTime); $("plDur").textContent = fmt(au.duration);
  const bar = document.querySelector(`.trk[data-i="${cur}"] .bar`); if (bar) bar.style.width = r + "%";
});
au.addEventListener("play", paint); au.addEventListener("pause", paint);
au.addEventListener("ended", () => { if (auto && cur < TRACKS.length - 1) playIdx(cur + 1); else { auto = false; paint(); } });

renderGChips(); renderGuides(); showTab(tab, false);

</script>
