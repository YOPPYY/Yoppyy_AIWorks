<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>サンセットGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Russo+One&display=swap">
<style>
/* 夕焼けの海沿いサーキット。暗い空と橙の光、赤い車。画面全体が横長のステージ */
:root{
  --bg:#120a24; --ink:#fff4e6; --dim:#cdb9e8; --hot:#ff4a5e; --sun:#ffb347; --panel:rgba(18,10,36,.86); --line:rgba(255,244,230,.28);
  --disp:"Dela Gothic One","Arial Black",sans-serif; --num:"Russo One","Arial Black",sans-serif; --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;--u:4px;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hold{position:absolute;display:grid;place-items:center;color:var(--ink);background:rgba(255,244,230,.13);border:calc(var(--u)*.5) solid rgba(255,244,230,.42);border-radius:calc(var(--u)*5);touch-action:none;padding:0}
.hold svg{width:44%;height:44%;fill:currentColor;pointer-events:none}
.hold.on{background:rgba(255,150,60,.58);border-color:#ffd9a8}
#bL{left:calc(var(--u)*3);bottom:calc(var(--u)*4);width:calc(var(--u)*25);height:calc(var(--u)*25)}
#bR{left:calc(var(--u)*31);bottom:calc(var(--u)*4);width:calc(var(--u)*25);height:calc(var(--u)*25)}
#bG{right:calc(var(--u)*3);bottom:calc(var(--u)*4);width:calc(var(--u)*27);height:calc(var(--u)*32)}
#bB{right:calc(var(--u)*33);bottom:calc(var(--u)*4);width:calc(var(--u)*20);height:calc(var(--u)*20)}
#bG{background:rgba(255,90,70,.22)}
#pauseBtn{position:absolute;top:calc(var(--u)*2.5);right:calc(var(--u)*2.5);width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*2.5);display:grid;place-items:center;color:var(--ink);background:rgba(18,10,36,.55);border:calc(var(--u)*.4) solid var(--line);padding:0}
#pauseBtn svg{width:46%;height:46%;fill:currentColor}
#stage[data-s="title"] .hold,#stage[data-s="title"] #pauseBtn,#stage[data-s="result"] .hold,#stage[data-s="result"] #pauseBtn{display:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,24,.6)}
.ov[hidden]{display:none}
.panel{background:var(--panel);border:calc(var(--u)*.4) solid var(--line);border-radius:calc(var(--u)*3);padding:calc(var(--u)*5) calc(var(--u)*7);display:flex;flex-direction:column;gap:calc(var(--u)*3);align-items:stretch;min-width:calc(var(--u)*50)}
.panel h2{margin:0;font:400 calc(var(--u)*7)/1.1 var(--disp);text-align:center;letter-spacing:.04em}
.btn{white-space:nowrap;font-weight:800;font-size:calc(var(--u)*4.3);min-height:calc(var(--u)*10.5);padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*2);border:calc(var(--u)*.4) solid var(--line);background:rgba(255,244,230,.08);color:var(--ink)}
.btn.pri{background:linear-gradient(180deg,#ff7a4d,#e0305a);border-color:#ffc09a}
.row{display:flex;gap:calc(var(--u)*2.5)}
.row>*{flex:1;padding-left:calc(var(--u)*2);padding-right:calc(var(--u)*2)}
.tg{font-size:calc(var(--u)*3.6);min-height:calc(var(--u)*8.5)}
.tg.off{opacity:.45;text-decoration:line-through}
#ovTitle{justify-content:flex-start;padding-left:calc(var(--u)*7);background:linear-gradient(90deg,rgba(10,5,24,.9) 0,rgba(10,5,24,.55) 48%,rgba(10,5,24,0) 78%)}
#ovTitle .panel{background:none;border:0;padding:0;gap:calc(var(--u)*2.2);min-width:calc(var(--u)*76);max-width:calc(var(--u)*84)}
#ovRandom{justify-content:flex-start;padding-left:calc(var(--u)*7);background:linear-gradient(90deg,rgba(10,5,24,.92) 0,rgba(10,5,24,.6) 52%,rgba(10,5,24,0) 80%)}
#ovRandom .panel{background:none;border:0;padding:0;gap:calc(var(--u)*1.6);min-width:calc(var(--u)*76);max-width:calc(var(--u)*84)}
#ovRandom h2{text-align:left;font-size:calc(var(--u)*6)}
.rr{display:flex;align-items:center;gap:calc(var(--u)*2)}
.rr>b{flex:0 0 calc(var(--u)*21);white-space:nowrap;font-size:calc(var(--u)*3.1);color:var(--sun);font-weight:800}
.rr .row{flex:1;gap:calc(var(--u)*1.6)}
.rr .btn{font-size:calc(var(--u)*3.3);min-height:calc(var(--u)*8)}
#seedIn{flex:1;min-width:0;height:calc(var(--u)*8);border-radius:calc(var(--u)*2);border:calc(var(--u)*.4) solid var(--line);background:rgba(255,244,230,.12);color:var(--ink);font:400 calc(var(--u)*4)/1 var(--num);text-align:center;outline:none}
#ovRandom[hidden]{display:none}
.logo{white-space:nowrap;font:400 calc(var(--u)*12)/1 var(--disp);margin:0;color:var(--ink);text-shadow:calc(var(--u)*.7) calc(var(--u)*.7) 0 var(--hot);letter-spacing:.01em;transform:skewX(-8deg)}
.logo small{display:block;font:400 calc(var(--u)*4.6)/1.1 var(--num);color:var(--sun);text-shadow:none;letter-spacing:.18em;margin-top:calc(var(--u)*1.2)}
.seg .btn{padding:0;font-size:calc(var(--u)*3.8)}
#stg .btn{line-height:1.05;min-height:calc(var(--u)*11)}
#stg .btn small{display:block;font-size:.72em;color:var(--sun);letter-spacing:.08em}
#stg .btn.on small{color:#7a2a10}
.seg .btn.on{background:var(--sun);color:#2a1030;border-color:#ffe0a8}
#rk{font:400 calc(var(--u)*20)/1 var(--num);text-align:center;color:var(--sun)}
#rk small{font-size:calc(var(--u)*8);color:var(--ink)}
#tm{font:400 calc(var(--u)*7)/1.1 var(--num);text-align:center}
#bs{font:500 calc(var(--u)*3.8)/1.2 var(--body);text-align:center;color:var(--dim);min-height:calc(var(--u)*4.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="wrap"><div id="stage" data-s="title">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" aria-label="ポーズ"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg></button>
  <button class="hold" id="bL" aria-label="左"><svg viewBox="0 0 24 24"><path d="M17 3 5 12l12 9z"/></svg></button>
  <button class="hold" id="bR" aria-label="右"><svg viewBox="0 0 24 24"><path d="M7 3l12 9L7 21z"/></svg></button>
  <button class="hold" id="bB" aria-label="ブレーキ"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/></svg></button>
  <button class="hold" id="bG" aria-label="アクセル"><svg viewBox="0 0 24 24"><path d="M12 3l9 17H3z"/></svg></button>

  <div class="ov" id="ovTitle"><div class="panel">
    <h1 class="logo">サンセットGP<small>SUNSET GRAND PRIX</small></h1>
    <div class="row seg" id="stg"><button class="btn" data-s="0">ビーチ<small>★</small></button><button class="btn" data-s="1">ゆき<small>★★</small></button><button class="btn" data-s="2">ネオン<small>★★★</small></button><button class="btn" data-s="3">さばく<small>★★★★</small></button><button class="btn" data-s="4">ランダム<small>?</small></button></div>
    <div class="row seg" id="cpuRow"><button class="btn" data-c="0">CPUなし</button><button class="btn" data-c="1">CPU 1台</button><button class="btn" data-c="3">CPU 3台</button></div>
    <button class="btn pri" id="goBtn">スタート</button>
    <div class="row"><button class="btn tg" data-k="bgm">BGM</button><button class="btn tg" data-k="se">効果音</button></div>
  </div></div>

  <div class="ov" id="ovRandom" hidden><div class="panel">
    <h2>ランダムコース</h2>
    <div class="rr"><b>背景</b><div class="row seg" data-g="bg"><button class="btn" data-v="0">ビーチ</button><button class="btn" data-v="1">ゆき</button><button class="btn" data-v="2">ネオン</button><button class="btn" data-v="3">さばく</button></div></div>
    <div class="rr"><b>長さ</b><div class="row seg" data-g="len"><button class="btn" data-v="0">短い</button><button class="btn" data-v="1">ふつう</button><button class="btn" data-v="2">長い</button></div></div>
    <div class="rr"><b>カーブの数</b><div class="row seg" data-g="cv"><button class="btn" data-v="0">少ない</button><button class="btn" data-v="1">ふつう</button><button class="btn" data-v="2">多い</button></div></div>
    <div class="rr"><b>カーブの強さ</b><div class="row seg" data-g="sharp"><button class="btn" data-v="0">ゆるい</button><button class="btn" data-v="1">ふつう</button><button class="btn" data-v="2">きつい</button></div></div>
    <div class="rr"><b>丘</b><div class="row seg" data-g="hill"><button class="btn" data-v="0">なし</button><button class="btn" data-v="1">ふつう</button><button class="btn" data-v="2">多い</button></div></div>
    <div class="rr"><b>コース番号</b><div class="row"><input id="seedIn" inputmode="numeric" maxlength="7" aria-label="コース番号"><button class="btn" id="diceBtn" aria-label="別のコース">別の形</button></div></div>
    <button class="btn pri" id="rndOk">このコースで決定</button>
  </div></div>

  <div class="ov" id="ovPause" hidden><div class="panel">
    <h2>ポーズ</h2>
    <button class="btn pri" id="resumeBtn">再開</button>
    <div class="row"><button class="btn" id="retryBtn">やり直し</button><button class="btn" id="toTitleBtn">タイトルへ</button></div>
    <div class="row"><button class="btn tg" data-k="bgm">BGM</button><button class="btn tg" data-k="se">効果音</button></div>
  </div></div>

  <div class="ov" id="ovResult" hidden><div class="panel">
    <div id="rk"></div><div id="tm"></div><div id="bs"></div>
    <div class="row"><button class="btn pri" id="againBtn">もう一度</button><button class="btn" id="toTitleBtn2">タイトルへ</button></div>
  </div></div>
</div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const wrap=$('wrap'),stage=$('stage'),cv=$('cv'),g=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(v,n)=>((v%n)+n)%n;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 設定(端末に保存) ---------- */
const S={bgm:1,se:1,cpu:1,rnd:{bg:0,len:1,cv:1,sharp:1,hill:1,seed:12345},stage:0,best:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('sunsetgp')||'{}'))}catch(e){}
if(!S.best||typeof S.best!=='object')S.best={};
function save(){try{localStorage.setItem('sunsetgp',JSON.stringify(S))}catch(e){}}

/* ---------- 定数 ---------- */
const SEG=200,RW=2000,LANES=3,CAMH=1100,DEPTH=0.9,DRAW=190,MAXSPEED=SEG*62.5,LAPS=3,CARW=760,NCARS=5;
let FOG='#e8795f';

/* ---------- 画面サイズ(実際の表示サイズを測る。縦持ちなら90度回して横画面にする) ---------- */
let W=0,H=0,DPR=0,K=1,HY=0,PZ=2400,portrait=false;
function measure(){
  const r=wrap.getBoundingClientRect();
  const vw=Math.max(240,Math.round(r.width)),vh=Math.max(240,Math.round(r.height));
  const p=vh>vw, nW=p?vh:vw, nH=p?vw:vh;
  const d=Math.min(window.devicePixelRatio||1,1.5);
  if(nW===W&&nH===H&&p===portrait&&d===DPR)return;
  W=nW;H=nH;DPR=d;portrait=p;
  stage.style.width=W+'px';stage.style.height=H+'px';
  stage.style.transform=p?'translate('+vw+'px,0) rotate(90deg)':'none';
  stage.style.setProperty('--u',(H/100)+'px');
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  K=W/2;HY=H*0.40;PZ=DEPTH*CAMH*K/(0.46*H);
}

/* ---------- サウンド ---------- */
let AC=null,master,bgmG,seG,noiseBuf,eng,engF,engG,nzG,skG,leadBus,bassBus;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=.8;master.connect(comp);
  bgmG=AC.createGain();bgmG.gain.value=S.bgm?.42:0;bgmG.connect(master);
  seG=AC.createGain();seG.gain.value=S.se?1:0;seG.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const o1=AC.createOscillator(),o2=AC.createOscillator();o1.type='sawtooth';o2.type='square';
  const g2=AC.createGain();g2.gain.value=.3;
  engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=500;engF.Q.value=2;
  engG=AC.createGain();engG.gain.value=0;
  o1.connect(engF);o2.connect(g2);g2.connect(engF);engF.connect(engG);engG.connect(seG);
  o1.start();o2.start();eng={o1,o2};
  const loopNoise=(type,freq,q)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const gg=AC.createGain();gg.gain.value=0;s.connect(f);f.connect(gg);gg.connect(seG);s.start();return gg};
  nzG=loopNoise('lowpass',900,.7);skG=loopNoise('bandpass',1700,3);
  bassBus=AC.createBiquadFilter();bassBus.type='lowpass';bassBus.frequency.value=650;bassBus.connect(bgmG);
  leadBus=AC.createGain();leadBus.gain.value=.55;leadBus.connect(bgmG);
  const dl=AC.createDelay(1);dl.delayTime.value=.33;const fb=AC.createGain();fb.gain.value=.3;leadBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(bgmG);
}
function applyVol(){if(!AC)return;bgmG.gain.setTargetAtTime(S.bgm?.42:0,AC.currentTime,.03);seG.gain.setTargetAtTime(S.se?1:0,AC.currentTime,.03)}
function tone(f,dur,type,vol,when,slide,pan){
  if(!AC||!S.se)return;const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),gg=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  gg.gain.setValueAtTime(vol||.2,t);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gg);
  if(pan&&AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=pan;gg.connect(pn);pn.connect(seG)}else gg.connect(seG);
  o.start(t);o.stop(t+dur+.03);
}
function noiseHit(dur,freq,vol,when){
  if(!AC||!S.se)return;const t=AC.currentTime+(when||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;
  const gg=AC.createGain();gg.gain.setValueAtTime(vol,t);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(gg);gg.connect(seG);s.start(t,Math.random());s.stop(t+dur+.03);
}
const SE={
  beep(){tone(660,.18,'square',.2)},
  go(){tone(1320,.5,'square',.22)},
  bump(){noiseHit(.18,500,.6);tone(120,.2,'sawtooth',.3,0,-70)},
  crash(){noiseHit(.45,260,.9);tone(75,.45,'sawtooth',.45,0,-35)},
  lap(){tone(880,.12,'triangle',.25);tone(1320,.22,'triangle',.25,.12)},
  fin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.28,i*.13))},
  tick(){tone(520,.06,'square',.1)},
  sign(t,d){const p=d*.7;
    if(t===0)tone(660,.16,'triangle',.3,0,0,p);
    else if(t===1){tone(740,.1,'triangle',.32,0,0,p);tone(740,.1,'triangle',.32,.17,0,p)}
    else if(t===2){[0,.09,.18].forEach((w,i)=>tone(880+i*130,.08,'square',.22,w,0,p))}
    else{tone(587,.12,'triangle',.32,0,0,p);tone(880,.14,'triangle',.32,.16,0,-p)}}
};
/* BGM: 8小節ループ(約14秒)。ベース・アルペジオ・リード・ドラム */
let STEP=60/136/4,BSHIFT=0;
const CH=[[57,60,64],[53,57,60],[55,60,64],[55,59,62],[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
const RT=[45,41,48,43,45,41,38,40];
const LD=[
 [[0,76,3],[4,79,2],[6,76,2],[8,74,3],[12,72,2],[14,74,2]],
 [[0,72,3],[4,77,2],[6,72,2],[8,69,3],[12,72,2],[14,76,2]],
 [[0,76,3],[4,79,2],[6,84,2],[8,83,3],[12,79,2],[14,76,2]],
 [[0,74,3],[4,79,2],[6,74,2],[8,71,3],[12,74,4]],
 [[0,76,3],[4,81,2],[6,79,2],[8,76,3],[12,72,2],[14,76,2]],
 [[0,77,3],[4,81,2],[6,77,2],[8,72,3],[12,69,2],[14,72,2]],
 [[0,74,3],[4,77,2],[6,81,2],[8,77,3],[12,74,2],[14,77,2]],
 [[0,76,2],[2,80,2],[4,83,3],[8,80,3],[12,76,2],[14,80,2]]
];
function bt(t,f,dur,type,vol,dest){const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);gg.gain.setValueAtTime(.0001,t);gg.gain.linearRampToValueAtTime(vol,t+.008);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gg);gg.connect(dest);o.start(t);o.stop(t+dur+.03)}
function bn(t,dur,ft,freq,vol){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=freq;const gg=AC.createGain();gg.gain.setValueAtTime(vol,t);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(gg);gg.connect(bgmG);s.start(t,Math.random());s.stop(t+dur+.03)}
function playStep(s,t){
  const bar=s>>4,st=s&15;
  if(st%2===0)bt(t,mtof(BSHIFT+RT[bar]+(st===6||st===14?12:0)),STEP*1.8,'sawtooth',.3,bassBus);
  bt(t,mtof(BSHIFT+CH[bar][[0,1,2,1][st&3]]+12),STEP*.9,'triangle',.08,leadBus);
  for(const e of LD[bar])if(e[0]===st)bt(t,mtof(BSHIFT+e[1]),e[2]*STEP*.95,'sawtooth',.13,leadBus);
  if(st%4===0){const o=AC.createOscillator(),gg=AC.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);gg.gain.setValueAtTime(.85,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(gg);gg.connect(bgmG);o.start(t);o.stop(t+.22)}
  if(st===4||st===12){bn(t,.16,'bandpass',1800,.4);bt(t,190,.08,'triangle',.25,bgmG)}
  if(st%2===0)bn(t,.04,'highpass',7000,st%4===2?.16:.07);
}
let bgmStep=0,nextT=0,bgmTimer=null;
function sched(){
  if(!AC||AC.state!=='running')return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.25){playStep(bgmStep,nextT);nextT+=STEP;bgmStep=(bgmStep+1)%128}
}
function bgmStart(){if(!AC||bgmTimer)return;nextT=AC.currentTime+.1;bgmStep=0;bgmTimer=setInterval(sched,40)}
function wake(){initAudio();if(AC&&AC.state==='suspended'&&!paused){try{AC.resume()}catch(e){}}bgmStart()}
function audioUpdate(spd,thr,off,skid,run){
  if(!AC||AC.state!=='running')return;

const RLEN=[[1500,400],[1900,700],[2600,700]],RCV=[[6,3],[9,4],[13,5]],RK=[[3,1],[4.5,1.5],[6.5,1.1]],RHILL=[0,1,1.8];
function genRandom(o){
  const r=rng(o.seed|0);let last=null;
  for(let tries=0;tries<150;tries++){
    const M=RCV[o.cv][0]+Math.floor(r()*RCV[o.cv][1]),sq=.6+r()*.3,pts=[];
    for(let j=0;j<M;j++){const a=2*Math.PI*(j+(r()-.5)*.7)/M,rad=1+(r()-.5)*.95;pts.push([Math.cos(a)*rad,Math.sin(a)*rad*sq])}

      const p0=pts[(j+M-1)%M],p1=pts[j],p2=pts[(j+1)%M],p3=pts[(j+2)%M];
      for(let t=0;t<24;t++){const u=t/24,u2=u*u,u3=u2*u;
        D.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3)))}
    }
    const nD=D.length,cum=[0];
    for(let i=0;i<nD;i++){const a=D[i],b=D[(i+1)%nD];cum.push(cum[i]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
    const L=cum[nD],N=RLEN[o.len][0]+Math.floor(r()*RLEN[o.len][1]),Q=[];let k=0;
    for(let i=0;i<N;i++){const s=i*L/N;while(cum[k+1]<s)k++;const a=D[k],b=D[(k+1)%nD],f=(s-cum[k])/(cum[k+1]-cum[k]||1);Q.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
    const th=[];for(let i=0;i<N;i++){const a=Q[i],b=Q[(i+1)%N];th.push(Math.atan2(b[1]-a[1],b[0]-a[0]))}
    let cur=th.map((t,i)=>{let d=t-th[(i+N-1)%N];while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d});
    for(let pass=0;pass<3;pass++){const c2=new Array(N).fill(0);for(let i=0;i<N;i++){let s=0;for(let w=-7;w<=7;w++)s+=cur[(i+w+N)%N];c2[i]=s/15}cur=c2}
    // スタート地点: カーブが少ない所に回す

    cur=cur.map((_,i)=>cur[(i+bi)%N]);

    if(Math.abs(sum-2*Math.PI)>.3||mx<1e-4)continue;

    let h=0,x=0,y=0;const raw=[[0,0]];
    for(let i=0;i<N;i++){h+=curve[i]*kk;x+=Math.cos(h);y+=Math.sin(h);raw.push([x,y])}
    const clo=Math.hypot(x,y);
    const P=raw.map((p,i)=>[p[0]-x*i/N,p[1]-y*i/N]);
    let md=1e9;
    for(let i=0;i<N;i+=4)for(let j=i+50;j<N;j+=4){const dd=Math.min(j-i,N-(j-i));if(dd<50)continue;const d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]);if(d<md)md=d}

/* CPUの追いつき補助: 難易度が上がるほど、離されたCPUが強く追い上げ、先行したCPUは手加減しない */
const DEAD=5000; /* 抜かれた直後はこの距離まで追い上げ補助を止め、並走して塞ぎ続けないようにする */
const ASSIST={up:.12,cap:.18,dn:0,cor:1.1,top:1.08,acc:.34}; /* メチャ強CPU */
function updateCars(dt){
  const pw=pd+PZ,pobj={z:mod(pw,trackLen),d:pw,offset:playerX,speed};
  const all=cars.concat([pobj]);
  for(const c of cars){
    const cvv=Math.abs(findSeg(c.z+SEG*22).curve);
    const A=ASSIST;
    let tv=Math.min(c.vmax,MAXSPEED*Math.max(.3,Math.min(1,.9*A.cor/(CF*Math.max(cvv,.001)))));
    const gap=c.d-pw;
    if(gap<-DEAD)tv*=1+Math.min(A.cap,(-gap-DEAD)/12500*A.up);
    else if(gap>6000)tv*=1-Math.min(A.dn,(gap-6000)/20000*A.dn);
    tv=Math.min(tv,MAXSPEED*A.top);
    let dir=0,blk=null,fol=null;
    for(const o of all){
      if(o===c)continue;
      const dz=wdiff(o.z,c.z);
      if(dz>0&&dz<SEG*22){const dl=c.offset-o.offset;if(Math.abs(dl)<.55&&(!blk||dz<blk.dz))blk={o,dz,dl}}
      /* 後ろ/真横から迫る車がいたら、追い抜けるよう反対側の車線をあける */
      if(dz<SEG*3&&dz>-SEG*10&&Math.abs(c.offset-o.offset)<.85&&(!fol||-dz<fol.k))fol={o,k:-dz};
    }
    if(blk){
      dir=Math.abs(blk.dl)<.02?(c.offset>0?-1:1):(blk.dl>0?1:-1);
      if(Math.abs(c.offset+dir*.6)>.95)dir=-dir;
      if(blk.dz<SEG*5&&blk.o.speed<c.speed)tv=Math.min(tv,blk.o.speed*.98);
    }else if(fol){
      const side=fol.o.offset>c.offset?-1:1;
      const room=Math.abs(c.offset+side*.5)>.95?0:side;
      dir=room;
    }
    const ps=c.speed;
    c.speed+=clamp(tv-c.speed,-MAXSPEED*.6*dt,MAXSPEED*A.acc*dt);
    c.br=c.speed<ps-1?1:0;
    c.offset=clamp(c.offset+dir*dt*.95+(blk||fol?0:(c.pref-c.offset)*dt*.25),-.9,.9);
    c.d+=c.speed*dt;c.z=mod(c.d,trackLen);
    if(!c.fin&&c.d>=LAPS*trackLen){c.fin=raceT||.001;finCount++}
  }
}

function step(dt){
  shake=Math.max(0,shake-dt*2.2);bumpCd-=dt;crashCd-=dt;lapBanner=Math.max(0,lapBanner-dt);goFlash=Math.max(0,goFlash-dt);
  if(state==='title'){
    pd+=dt*6000;speed=6000;playerX=Math.sin(performance.now()/1800)*.5;
    updateCars(dt);turn+=findSeg(pd+PZ).curve*.8*dt*.03;
    audioUpdate(0,0,0,0,false);return;
  }
  const L=inp.l||keys.l,Rr=inp.r||keys.r,G=inp.g||keys.g,B=inp.b||keys.b;
  steerA+=(((Rr?1:0)-(L?1:0))-steerA)*Math.min(1,dt*10);
  if(state==='count'){
    countT-=dt;const n=Math.ceil(countT);
    if(n!==lastCount&&n>=1&&n<=3){lastCount=n;SE.beep()}
    if(countT<=0){state='race';carsRun=true;SE.go();goFlash=1}
    sigIdx=-1;audioUpdate(0,G?1:0,0,0,true);return;
  }
  const pw=pd+PZ,ps=findSeg(pw),spd=speed/MAXSPEED;
  if(state==='race'){
    raceT+=dt;
    const dx=dt*2.6*spd;
    if(L)playerX-=dx;else if(Rr)playerX+=dx;
    playerX-=dx*spd*ps.curve*CF;
    if(G)speed+=MAXSPEED/4.2*dt;else if(B)speed-=MAXSPEED*.9*dt;else speed-=MAXSPEED/7*dt;
    if(Math.abs(playerX)>1&&speed>MAXSPEED/4)speed-=MAXSPEED/2.2*dt;
    playerX=clamp(playerX,-2.6,2.6);speed=clamp(speed,0,MAXSPEED);
    const z0=pd+PZ;pd+=speed*dt;const z1=pd+PZ;
    // 道ばたのもの(進んだ区間のすべてのセグメントを調べる)
    if(Math.abs(playerX)>1&&crashCd<=0){
      const zs=[];for(let zi=Math.floor(z0/SEG);zi<=Math.floor(z1/SEG)&&zs.length<8;zi++)zs.push(segs[mod(zi,segs.length)]);
      hit:for(const s of zs){for(const sp of s.sprites){
        if(Math.abs(playerX-sp.o)<({stand:.7,tower:.6,rock:.3}[sp.t]||.17)){
          speed=Math.min(speed,MAXSPEED*.1);playerX=sp.o>0?sp.o-.55:sp.o+.55;shake=1;crashCd=.7;SE.crash();break hit;
        }}}
    }
    // 他の車
    const pz=mod(pd+PZ,trackLen);
    for(const c of cars){
      const dz=wdiff(c.z,pz);
      if(Math.abs(dz)<420&&Math.abs(c.offset-playerX)<.38){
        if(bumpCd<=0){SE.bump();shake=.6;bumpCd=.4}
        if(dz>=0&&speed>c.speed)speed=c.speed*.75;
        playerX+=(playerX>=c.offset?1:-1)*dt*1.6;
      }
    }
    // ラップ・ゴール
    updateSign();
    const lapNow=clamp(Math.floor((pd+PZ)/trackLen)+1,1,LAPS);
    if(lapNow>lapShown){lapShown=lapNow;lapBanner=1.8;SE.lap()}
    if(pd+PZ>=LAPS*trackLen){state='done';finRank=1+finCount;finishT=0;SE.fin()}
  }else{ // done: 自動で減速
    speed=Math.max(0,speed-MAXSPEED*.22*dt);playerX+=(0-playerX)*dt*1.2;pd+=speed*dt;
    finishT+=dt;
    if(finishT>1.8&&!resultShown)showResult();
  }
  if(carsRun)updateCars(dt);
  turn+=ps.curve*spd*dt*.03;
  const cent=Math.abs(ps.curve)*spd*spd;
  const skid=state==='race'?clamp((cent-2.2)/3,0,1)*(speed>0?1:0)+(B&&spd>.5?.5:0):0;
  audioUpdate(spd,G&&state==='race'?1:0,Math.abs(playerX)>1&&speed>MAXSPEED*.1?1:0,Math.min(1,skid),true);
}

/* ---------- 描画 ---------- */
function txt(s,x,y,font,col,align){
  g.font=font;g.textAlign=align||'left';g.lineJoin='round';
  g.lineWidth=H*.012;g.strokeStyle='rgba(15,6,32,.85)';g.strokeText(s,x,y);
  g.fillStyle=col;g.fillText(s,x,y);
}
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)};
function renderScene(){
  const u=H/100;
  position=mod(pd,trackLen);
  const base=findSeg(position),bp=(position%SEG)/SEG;
  const ps=findSeg(position+PZ),pp=((position+PZ)%SEG)/SEG;
  const py=lerp(ps.p1.wy,ps.p2.wy,pp);
  frame++;
  let maxy=H,x=0,dx=-(base.curve*bp);
  for(let n=0;n<DRAW;n++){
    const s=segs[(base.index+n)%segs.length];
    const looped=s.index<base.index,cz=position-(looped?trackLen:0);
    s.vf=frame;s.cars.length=0;s.clip=maxy;
    s.fog=1/Math.exp(Math.pow(n/DRAW,2)*2.4);
    project(s.p1,playerX*RW-x,py+CAMH,cz);
    project(s.p2,playerX*RW-x-dx,py+CAMH,cz);
    x+=dx;dx+=s.curve;
    if(s.p1.cz<=DEPTH||s.p2.sy>=s.p1.sy||s.p2.sy>=maxy)continue;
    drawSeg(s,s.fog);
    maxy=s.p1.sy;
  }
  for(const c of cars){const s=findSeg(c.z);if(s.vf===frame)s.cars.push(c)}
  const pw=DEPTH/PZ*K,pY=HY+DEPTH*CAMH/PZ*K;
  for(let n=DRAW-1;n>=0;n--){
    const s=segs[(base.index+n)%segs.length];
    if(s.p1.cz<=DEPTH)continue;
    const near=s.p1.cz<700;
    for(const sp of near?[]:s.sprites){
      const sc=s.p1.sc*K,sx=s.p1.sx+s.p1.sw*sp.o,sy=s.p1.sy;
      if(sx<-W*.6||sx>W*1.6||sy<HY)continue;
      const cl=s.clip<sy;if(cl){g.save();g.beginPath();g.rect(0,0,W,s.clip);g.clip()}
      g.globalAlpha=Math.min(1,s.fog*1.5);SPR[sp.t](sx,sy,sc*(sp.z||1),sp.c,sp);g.globalAlpha=1;
      if(cl)g.restore();
    }
    for(const c of s.cars){
      const pct=(c.z%SEG)/SEG,sc=lerp(s.p1.sc,s.p2.sc,pct)*K;
      const sx=lerp(s.p1.sx,s.p2.sx,pct)+sc*c.offset*RW,sy=lerp(s.p1.sy,s.p2.sy,pct);
      const cl=s.clip<sy;if(cl){g.save();g.beginPath();g.rect(0,0,W,s.clip);g.clip()}
      g.globalAlpha=Math.min(1,s.fog*1.5);drawCar(sx,sy,CARW*sc,c.color,c.br);g.globalAlpha=1;
      if(cl)g.restore();
    }
    if(s===ps){
      const off=Math.abs(playerX)>1&&speed>MAXSPEED*.1?(Math.random()-.5)*u*.9:0;
      g.save();g.translate(W/2,pY+off);g.rotate(steerA*.035);
      const B=inp.b||keys.b;
      drawCar(0,0,CARW*pw,'#ff3b4e',B&&speed>0);
      g.restore();
    }
  }
}
function hud(){
  if(state==='title')return;
  const u=H/100,num='"Russo One","Arial Black",sans-serif';
  g.textBaseline='alphabetic';
  if(cars.length){
    const nc=cars.length+1,r=state==='done'?finRank:currentRank();
    txt(String(r),u*3,u*15,'400 '+u*14+'px '+num,'#ffb347');
    g.font='400 '+u*14+'px '+num;const rw=g.measureText(String(r)).width;
    txt('/'+nc,u*3+rw+u*1,u*15,'400 '+u*6+'px '+num,'#fff4e6');
    if(state!=='done'){
      let mx=-1e12;for(const c of cars)mx=Math.max(mx,c.d);
      const gap=(pd+PZ-mx)*.0067,gx=u*3+rw+u*1+(g.font='400 '+u*6+'px '+num,g.measureText('/'+nc).width)+u*2.5;
      txt((gap>=0?'+':'-')+Math.min(999,Math.abs(Math.round(gap)))+'m',gx,u*15,'400 '+u*6.5+'px '+num,gap>=0?'#7bff6a':'#ff8a8a');
    }
  }
  drawMap(W-u*46,u*2.5,u*30,u*22,u,true);drawSign(u);
  txt('LAP '+lapShown+'/'+LAPS,u*3.5,u*22,'400 '+u*5+'px '+num,'#fff4e6');
  txt(fmt(raceT),W/2,u*10,'400 '+u*7+'px '+num,'#fff4e6','center');
  const kmh=Math.round(speed/MAXSPEED*300);
  txt(String(kmh),W/2,H-u*3,'400 '+u*10+'px '+num,'#fff4e6','center');
  if(state==='count'){
    const n=Math.ceil(countT);
    if(n>=1&&n<=3)txt(String(n),W/2,H*.42,'400 '+u*30+'px '+num,'#ffb347','center');
  }
  if(goFlash>0){g.globalAlpha=Math.min(1,goFlash*1.6);txt('GO!',W/2,H*.42,'400 '+u*30+'px '+num,'#7bff6a','center');g.globalAlpha=1}
  if(lapBanner>0&&state==='race'){g.globalAlpha=Math.min(1,lapBanner*1.5);txt(lapShown===LAPS?'FINAL LAP':'LAP '+lapShown,W/2,H*.5,'400 '+u*14+'px '+num,'#ffb347','center');g.globalAlpha=1}
  if(state==='done'&&!resultShown)txt('FINISH!',W/2,H*.4,'400 '+u*22+'px '+num,'#ffb347','center');
}
function render(){
  if(!W)return;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#120a24';g.fillRect(0,0,W,H);
  g.save();
  if(shake>0){const u=H/100;g.translate((Math.random()-.5)*shake*u*1.6,(Math.random()-.5)*shake*u*1.6)}
  drawBG();renderScene();
  if(speed>MAXSPEED*.75&&state!=='title'){
    g.strokeStyle='rgba(255,244,230,.16)';g.lineWidth=Math.max(1,H*.004);g.beginPath();
    for(let i=0;i<12;i++){const a=(i*.5236+frame*.37)%6.2832,ca=Math.cos(a),sa=Math.sin(a);
      g.moveTo(W/2+ca*W*.38,H*.55+sa*H*.45);g.lineTo(W/2+ca*W*.6,H*.55+sa*H*.8)}
    g.stroke();
  }
  g.restore();hud();
  if(state==='title'){const u=H/100;drawMap(W-u*68,u*16,u*60,u*48,u,false)}
}

/* ---------- 画面・ボタン ---------- */
function startRace(){
  resetRace();stage.dataset.s='race';
  $('ovTitle').hidden=true;$('ovPause').hidden=true;$('ovResult').hidden=true;
  paused=false;if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  dirty=true;
}
function toTitle(){
  resetRace();state='title';carsRun=true;stage.dataset.s='title';
  $('ovTitle').hidden=false;$('ovRandom').hidden=true;$('ovPause').hidden=true;$('ovResult').hidden=true;
  paused=false;if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  audioQuiet();dirty=true;
}
function showResult(){
  resultShown=true;stage.dataset.s='result';
  const key='c4-'+S.stage+'-'+S.cpu,b=S.best[key];
  $('rk').innerHTML=cars.length?(finRank===1?'勝ち!':'負け…')+'<small> '+finRank+'位 / '+(cars.length+1)+'台</small>':'ゴール!';
  $('tm').textContent=fmt(raceT);
  if(S.stage===4)$('bs').textContent='';
  else if(!b||raceT<b){S.best[key]=raceT;save();$('bs').textContent=b?'ベスト更新!':'初ゴール!'}
  else $('bs').textContent='ベスト '+fmt(b);
  $('ovResult').hidden=false;
}
function setPause(p){
  if(p===paused)return;
  if(p&&(state==='title'||resultShown))return;
  paused=p;$('ovPause').hidden=!p;dirty=true;
  if(AC){try{if(p){audioQuiet();AC.suspend()}else{AC.resume();SE.tick()}}catch(e){}}
}
function syncUI(){
  document.querySelectorAll('.tg').forEach(b=>b.classList.toggle('off',!S[b.dataset.k]));
  document.querySelectorAll('#cpuRow .btn').forEach(b=>b.classList.toggle('on',+b.dataset.c===(S.cpu|0)));
    document.querySelectorAll('#ovRandom .seg').forEach(g=>{const k=g.dataset.g;g.querySelectorAll('.btn').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.rnd[k]))});
  $('seedIn').value=S.rnd.seed;
  document.querySelectorAll('#stg .btn').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.stage));
}
document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{S[b.dataset.k]=S[b.dataset.k]?0:1;save();syncUI();applyVol();wake();SE.tick()}));
document.querySelectorAll('#stg .btn').forEach(b=>b.addEventListener('click',()=>{S.stage=+b.dataset.s;save();buildTrack(S.stage);syncUI();toTitle();if(S.stage===4){$('ovTitle').hidden=true;$('ovRandom').hidden=false}wake();SE.tick()}));
document.querySelectorAll('#cpuRow .btn').forEach(b=>b.addEventListener('click',()=>{S.cpu=+b.dataset.c;save();syncUI();toTitle();wake();SE.tick()}));
function refreshRandom(){save();buildTrack(4);syncUI();resetRace();state='title';carsRun=true;dirty=true}
document.querySelectorAll('#ovRandom .seg').forEach(g=>g.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{S.rnd[g.dataset.g]=+b.dataset.v;refreshRandom();wake();SE.tick()})));
$('diceBtn').addEventListener('click',()=>{S.rnd.seed=(Math.random()*9000000|0)+1000000;refreshRandom();wake();SE.tick()});
$('seedIn').addEventListener('change',()=>{const v=parseInt($('seedIn').value,10);S.rnd.seed=isFinite(v)&&v>0?v:12345;refreshRandom()});
$('rndOk').addEventListener('click',()=>{$('ovRandom').hidden=true;$('ovTitle').hidden=false;wake();SE.tick()});
$('goBtn').addEventListener('click',()=>{wake();startRace()});
$('againBtn').addEventListener('click',()=>{wake();startRace()});
$('retryBtn').addEventListener('click',()=>{startRace()});
$('resumeBtn').addEventListener('click',()=>setPause(false));
$('toTitleBtn').addEventListener('click',toTitle);
$('toTitleBtn2').addEventListener('click',toTitle);
$('pauseBtn').addEventListener('click',()=>setPause(true));

function hold(id,k){
  const el=$(id);
  const down=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}inp[k]=1;el.classList.add('on');wake()};
  const up=()=>{inp[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,up));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
hold('bL','l');hold('bR','r');hold('bG','g');hold('bB','b');
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'g',KeyW:'g',ArrowDown:'b',KeyS:'b',Space:'b'};
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){if(state!=='title')setPause(!paused);return}
  const k=KM[e.code];if(k){keys[k]=1;e.preventDefault();wake()}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='count'||state==='race'||state==='done'))setPause(true)});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('resize',()=>{measure();dirty=true});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{measure();dirty=true});
if(window.ResizeObserver)new ResizeObserver(()=>{measure();dirty=true}).observe(wrap);
setInterval(()=>{measure()},800);

/* ---------- 起動 ---------- */
measure();buildTrack(S.stage>=0&&S.stage<=4?S.stage:0);syncUI();toTitle();
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
  if(paused&&!dirty)return;
  if(!paused)step(dt);
  dirty=false;render();
}
requestAnimationFrame(loop);
window.__game={get state(){return state},get speed(){return speed},get pd(){return pd},get rank(){return currentRank()},get paused(){return paused},get lap(){return lapShown}};
})();
</script>
