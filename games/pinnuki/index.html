<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ピンぬきダンジョン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* 地下ダンジョンの石室。暗い紫がかった石、金・溶岩・水の三色だけを光らせる */
:root{
  --bg:#15131f; --panel:#221e31; --line:#3a3349; --ink:#f3eadb; --mute:#a99db5;
  --gold:#f6c431; --gold-deep:#a86f0b; --lava:#ff6a2b; --water:#4fb0ff; --steel:#c9d1dc;
  --f-disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#app{position:relative;height:100%;display:flex;flex-direction:column;}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* HUD */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;height:56px;box-sizing:border-box;}
.ib{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--panel);
  display:grid;place-items:center;padding:0;flex:0 0 auto;}
.ib:active{transform:translateY(1px);background:#2c2640;}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
#stno{font-family:var(--f-disp);font-size:22px;min-width:36px;text-align:center;color:var(--ink);}
#meter{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 18%,var(--gold) 20% 70%,var(--gold-deep) 72%);flex:0 0 auto;}
#bar{flex:1 1 auto;height:10px;border-radius:6px;background:#0d0b14;border:2px solid var(--line);overflow:hidden;min-width:30px;}
#fill{height:100%;width:0;background:var(--gold);border-radius:4px;transition:width .2s;}
#bar.ok{border-color:var(--gold);}
#foes{display:flex;gap:4px;flex:0 0 auto;}
.foe{width:16px;height:16px;border-radius:50%;background:#6bbf59;box-shadow:inset 0 -3px 0 #3f8a37;position:relative;}
.foe.dead{background:#3a3349;box-shadow:none;}
.foe.dead::after{content:"";position:absolute;inset:3px;background:
  linear-gradient(45deg,transparent 42%,var(--mute) 42% 58%,transparent 58%),
  linear-gradient(-45deg,transparent 42%,var(--mute) 42% 58%,transparent 58%);}

#stage{position:relative;flex:1 1 auto;min-height:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* オーバーレイ */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(12,10,18,.55);animation:fade .3s ease-out;}
.ov h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:52px;letter-spacing:.04em;text-wrap:balance;
  text-shadow:0 4px 0 #000a;}
#ov-win h2{color:var(--gold);}
#ov-lose h2{color:var(--lava);font-size:40px;}
.row{display:flex;gap:14px;}
.big{width:76px;height:76px;border-radius:22px;border:3px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;}
.big svg{width:36px;height:36px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.big.main{background:var(--gold);border-color:#ffe08a;}
.big.main svg{stroke:#2a1d05;}
.big:active{transform:translateY(2px);}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.ov h2{animation:pop .45s cubic-bezier(.3,1.6,.5,1);}

/* タイトル */
#title{position:absolute;inset:0;z-index:5;background:
  radial-gradient(120% 60% at 50% 0%,#2a2340 0%,var(--bg) 60%);
  display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding-block:28px 24px;padding-inline:16px;gap:18px;overflow-y:auto;box-sizing:border-box;}
#logo{width:100%;max-width:380px;height:auto;aspect-ratio:380/230;}
#tname{margin:0;font-family:var(--f-disp);font-weight:400;font-size:38px;line-height:1.15;text-align:center;letter-spacing:.02em;
  color:var(--ink);text-shadow:0 3px 0 #000,0 0 22px #ff6a2b55;}
#tname span{color:var(--gold);}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:360px;}
.st{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--panel);font-family:var(--f-disp);font-size:24px;
  position:relative;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums;}
.st.done{border-color:var(--gold-deep);background:#2b2414;color:var(--gold);}
.st.done::after{content:"";position:absolute;right:5px;top:5px;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3b0 0 18%,var(--gold) 20% 70%,var(--gold-deep) 72%);}
.st.lock{opacity:.35;}
.st:not(.lock):active{transform:translateY(2px);}
#tsound{position:absolute;top:12px;right:12px;}
@media (prefers-reduced-motion:reduce){.ov,.ov h2{animation:none;}}
</style>

<div id="app">
  <header id="hud">
    <button class="ib" id="bmenu" aria-label="ステージ選択"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <div id="stno">1</div>
    <div id="meter"><div class="coin"></div><div id="bar"><div id="fill"></div></div><div id="foes"></div></div>

    <button class="ib" id="bretry" aria-label="やりなおす"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ov-win" hidden>
      <h2 id="wintext">クリア!</h2>
      <div class="row">
        <button class="big" id="wmenu" aria-label="ステージ選択"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
        <button class="big main" id="wnext" aria-label="次のステージ"><svg viewBox="0 0 24 24"><path d="M8 5l9 7-9 7z" fill="#2a1d05"/></svg></button>
      </div>

      <h2>しっぱい…</h2>

        <button class="big main" id="lretry" aria-label="やりなおす"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
      </div>
    </div>
  </div>
  <section id="title">
    <button class="ib" id="tsound" aria-label="音のオンオフ"><svg viewBox="0 0 24 24" id="isnd2"></svg></button>
    <canvas id="logo" width="760" height="460"></canvas>
    <h1 id="tname">ピンぬき<br><span>ダンジョン</span></h1>
    <div id="grid"></div>
  </section>
</div>

<script>
// ===== ピンぬき 物理エンジン =====
var PinEngine = (function(){
  var W = 360, H = 640, GRAV = 1000;
  // 0 金貨, 1 水, 2 溶岩, 3 石
  var T = [
    {r:5,   m:1.7, fr:0.10, pf:0.03, damp:0.0},
    {r:4.6, m:1.0, fr:0.01, pf:0.0,  damp:0.0},
    {r:4.6, m:1.2, fr:0.04, pf:0.01, damp:1.2},
    {r:5,   m:1.8, fr:0.30, pf:0.12, damp:0.0}
  ];
  var CELL = 11, MAXV = 520;

  function rngOf(seed){ var s = seed >>> 0 || 1; return function(){ s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

  function create(L, seed){
    var w = {t:0, parts:[], segs:[], pins:[], enemies:[], ev:[], status:'play', reason:'',
             calm:0, lastPull:-99, rng:rngOf(seed||7), level:L};
    L.walls.forEach(function(pl){
      for (var i=0;i<pl.length-1;i++) w.segs.push({x1:pl[i][0],y1:pl[i][1],x2:pl[i+1][0],y2:pl[i+1][1],r:6});
    });
    L.pins.forEach(function(p, i){
      var dx=p.b[0]-p.a[0], dy=p.b[1]-p.a[1], len=Math.hypot(dx,dy);
      w.pins.push({id:i, ax:p.a[0], ay:p.a[1], bx:p.b[0], by:p.b[1], ux:dx/len, uy:dy/len, len:len, off:0, state:0, r:4});
    });
    L.spawn.forEach(function(s){
      var t=s.t, r=T[t].r, d=r*2.02, cols=Math.max(1,Math.floor(s.w/d)), n=0;
      for (var row=0; n<s.n; row++){
        var y = s.y + s.h - r - row*d*0.88;
        if (y < s.y - 200) break;
        var off = (row%2)? d*0.5 : 0;
        for (var c=0;c<cols && n<s.n;c++){
          var x = s.x + r + off + c*d;
          if (x > s.x + s.w - r) continue;
          x += (w.rng()-0.5)*0.6;
          w.parts.push({x:x,y:y,px:x,py:y,vx:0,vy:0,t:t,r:r,age:9,dead:false});
          n++;
        }
      }
    });
    (L.enemies||[]).forEach(function(e){ w.enemies.push({x:e[0],y:e[1]-24,px:e[0],py:e[1]-24,vx:0,vy:0,r:15,alive:true,gr:false,deadT:0,dir:0}); });
    var h = L.hero;
    w.hero = {x:h[0], y:h[1], r:12, ax:h[0], ay:h[1]-36, bx:h[0], by:h[1]-14, alive:true};
    w.zone = L.zone;
    w.goldTotal = w.parts.filter(function(p){return p.t===0;}).length;
    w.target = Math.ceil(w.goldTotal * (L.need||0.6));
    w.enemyTotal = w.enemies.length;
    return w;
  }

  function pinSeg(p){
    var ox = p.ux*p.off, oy = p.uy*p.off;
    return {x1:p.ax+ox, y1:p.ay+oy, x2:p.bx+ox, y2:p.by+oy, r:p.r};
  }

  function pull(w, id){
    var p = w.pins[id];
    if (!p || p.state!==0 || w.status!=='play') return false;
    p.state = 1; w.lastPull = w.t; w.calm = 0;
    return true;
  }

  // 円とカプセルの衝突。押し出し方向を返す
  function capsule(x, y, s, rad){
    var dx=s.x2-s.x1, dy=s.y2-s.y1, l2=dx*dx+dy*dy;
    var t = l2>0 ? ((x-s.x1)*dx+(y-s.y1)*dy)/l2 : 0;
    t = t<0?0:t>1?1:t;
    var qx=s.x1+dx*t, qy=s.y1+dy*t, ex=x-qx, ey=y-qy, d2=ex*ex+ey*ey, md=s.r+rad;
    if (d2 >= md*md) return null;
    var d = Math.sqrt(d2);
    if (d < 1e-6) { ex = -dy; ey = dx; d = Math.hypot(ex,ey)||1; }
    return {nx:ex/d, ny:ey/d, pen:md-d};
  }

  function collideStatic(w, o, rad, fr, colls){
    var hit = null;
    for (var k=0;k<colls.length;k++){
      var c = capsule(o.x, o.y, colls[k], rad);
      if (!c) continue;
      o.x += c.nx*c.pen; o.y += c.ny*c.pen;
      var mx=o.x-o.px, my=o.y-o.py, dn=mx*c.nx+my*c.ny;
      var tx=mx-dn*c.nx, ty=my-dn*c.ny;
      o.x -= tx*fr; o.y -= ty*fr;
      if (!hit || c.ny < hit.ny) hit = c;
    }
    return hit;
  }

  function sub(w, h){
    var parts = w.parts, i, p;
    // 静的コライダー
    var colls = w.segs.slice();
    w.pins.forEach(function(pn){ if (pn.state<2) colls.push(pinSeg(pn)); });
    var hero = w.hero, heroSeg = {x1:hero.ax,y1:hero.ay,x2:hero.bx,y2:hero.by,r:hero.r};

    for (i=0;i<parts.length;i++){
      p = parts[i];
      var ty = T[p.t];
      p.vy += GRAV*h;
      if (ty.damp) { var f = 1/(1+ty.damp*h); p.vx*=f; p.vy*=f; }
      var sp = p.vx*p.vx+p.vy*p.vy;
      if (sp > MAXV*MAXV){ var k=MAXV/Math.sqrt(sp); p.vx*=k; p.vy*=k; }
      p.px=p.x; p.py=p.y; p.x+=p.vx*h; p.y+=p.vy*h;
      p.age += h;
    }
    w.enemies.forEach(function(e){
      if (!e.alive) return;
      e.vy += GRAV*h;
      e.px=e.x; e.py=e.y; e.x+=e.vx*h; e.y+=e.vy*h; e.gr=false;
    });

    // グリッド
    var grid = new Map();
    for (i=0;i<parts.length;i++){
      p = parts[i];
      var key = ((p.x/CELL)|0) + 1000*((p.y/CELL+50)|0);
      var a = grid.get(key); if (!a) grid.set(key, a=[]); a.push(i);
    }

    for (var it=0; it<2; it++){
      // 粒子どうし
      for (i=0;i<parts.length;i++){
        p = parts[i]; if (p.dead) continue;
        var cx=(p.x/CELL)|0, cy=(p.y/CELL+50)|0;
        for (var gx=cx-1; gx<=cx+1; gx++) for (var gy=cy-1; gy<=cy+1; gy++){
          var cell = grid.get(gx+1000*gy); if (!cell) continue;
          for (var n=0;n<cell.length;n++){
            if (p.dead) break;
            var j = cell[n]; if (j<=i) continue;
            var q = parts[j]; if (q.dead) continue;
            var dx=q.x-p.x, dy=q.y-p.y, rr=p.r+q.r, d2=dx*dx+dy*dy;
            if (d2 >= rr*rr || d2 < 1e-8) continue;
            // 反応
            if (p.t!==q.t && react(w, p, q)) { if (p.dead) break; continue; }
            var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, pen=rr-d;
            var wi=1/T[p.t].m, wj=1/T[q.t].m, s=pen/(wi+wj);
            p.x-=nx*s*wi; p.y-=ny*s*wi; q.x+=nx*s*wj; q.y+=ny*s*wj;
            var pf = Math.max(T[p.t].pf, T[q.t].pf);
            if (pf){
              var rx=(q.x-q.px)-(p.x-p.px), ry=(q.y-q.py)-(p.y-p.py), rn=rx*nx+ry*ny;
              var tx=(rx-rn*nx)*pf*0.5, ty2=(ry-rn*ny)*pf*0.5;
              p.x+=tx*wi/(wi+wj)*2; p.y+=ty2*wi/(wi+wj)*2; q.x-=tx*wj/(wi+wj)*2; q.y-=ty2*wj/(wi+wj)*2;
            }
          }
        }
      }
      // 粒子と敵
      w.enemies.forEach(function(e){
        if (!e.alive) return;
        for (var m=0;m<parts.length;m++){
          var q = parts[m]; if (q.dead) continue;
          var dx=q.x-e.x, dy=q.y-e.y, rr=e.r+q.r;
          if (dx>rr||dx<-rr||dy>rr||dy<-rr) continue;
          var d2=dx*dx+dy*dy; if (d2>=rr*rr) continue;
          if (q.t===2){ e.alive=false; e.deadT=w.t; w.ev.push({k:'burn',x:e.x,y:e.y}); return; }
          var d=Math.sqrt(d2)||1, nx=dx/d, ny=dy/d, pen=rr-d;
          var wi=1/12, wj=1/T[q.t].m, s=pen/(wi+wj);
          e.x-=nx*s*wi; e.y-=ny*s*wi; q.x+=nx*s*wj; q.y+=ny*s*wj;
          if (ny > 0.5) e.gr = true;
        }
      });
      // 敵どうし
      for (var a1=0;a1<w.enemies.length;a1++) for (var a2=a1+1;a2<w.enemies.length;a2++){
        var e1=w.enemies[a1], e2=w.enemies[a2]; if (!e1.alive||!e2.alive) continue;
        var dx=e2.x-e1.x, dy=e2.y-e1.y, d=Math.hypot(dx,dy), rr=e1.r+e2.r;
        if (d<rr && d>0){ var s=(rr-d)/2; e1.x-=dx/d*s; e1.y-=dy/d*s; e2.x+=dx/d*s; e2.y+=dy/d*s; }
      }
      // 壁・ピン・勇者
      for (i=0;i<parts.length;i++){
        p = parts[i]; if (p.dead) continue;
        collideStatic(w, p, p.r, T[p.t].fr, colls);
        var c = capsule(p.x, p.y, heroSeg, p.r);
        if (c){
          if (p.t===2 && hero.alive){ hero.alive=false; lose(w,'lava'); }
          p.x+=c.nx*c.pen; p.y+=c.ny*c.pen;
        }
      }
      w.enemies.forEach(function(e){
        if (!e.alive) return;
        var hit = collideStatic(w, e, e.r, 0.02, colls);
        if (hit && hit.ny < -0.5) e.gr = true;
        var c = capsule(e.x, e.y, heroSeg, e.r);
        if (c && hero.alive){ hero.alive=false; lose(w,'enemy'); }
      });
    }

    for (i=0;i<parts.length;i++){
      p = parts[i];
      p.vx=(p.x-p.px)/h; p.vy=(p.y-p.py)/h;
      if (p.y > H+40 || p.x < -40 || p.x > W+40) p.dead = true;
    }
    w.enemies.forEach(function(e){
      if (!e.alive) return;
      e.vx=(e.x-e.px)/h; e.vy=(e.y-e.py)/h; if (e.vy < -300) e.vy = -300;
      if (e.gr){
        var dx = w.hero.x - e.x, dir = Math.abs(dx) > 4 ? (dx>0?1:-1) : 0;
        e.dir = dir;
        e.vx += (dir*48 - e.vx)*0.2;
      }
      if (e.y > H+60) e.alive = false;
    });
    var alive = 0;
    for (i=0;i<parts.length;i++) if (!parts[i].dead) parts[alive++] = parts[i];
    parts.length = alive;
  }

  function react(w, p, q){
    var a = p.t < q.t ? p : q, b = a===p ? q : p; // a.t < b.t
    // 溶岩 × 水 → 石
    if (a.t===1 && b.t===2){
      b.t=3; b.r=T[3].r; b.age=0;
      if (w.rng()<0.5) a.dead = true;
      w.ev.push({k:'steam', x:b.x, y:b.y});
      return true;
    }
    // 溶岩 × 金貨 → 金貨が燃える
    if (a.t===0 && b.t===2){
      a.dead = true;
      w.ev.push({k:'melt', x:a.x, y:a.y});
      return true;
    }
    // 固まりたての石 × 溶岩 → 連鎖して石に
    if (a.t===2 && b.t===3 && b.age < 0.15){
      a.t=3; a.r=T[3].r; a.age=0;
      return false;
    }
    return false;
  }

  function lose(w, why){ if (w.status==='play'){ w.status='lose'; w.reason=why; w.ev.push({k:'lose',why:why}); } }

  function goldIn(w){
    var z=w.zone, n=0;
    for (var i=0;i<w.parts.length;i++){ var p=w.parts[i]; if (p.t===0 && p.x>z[0] && p.x<z[2] && p.y>z[1] && p.y<z[3]) n++; }
    return n;
  }
  function goldLeft(w){ var n=0; for (var i=0;i<w.parts.length;i++) if (w.parts[i].t===0) n++; return n; }
  function enemiesAlive(w){ var n=0; w.enemies.forEach(function(e){ if(e.alive) n++; }); return n; }

  function step(w, dt){
    dt = dt || 1/60;

function drawBricks(c, x0, y0, x1, y1){
  c.fillStyle = '#17141f'; c.fillRect(x0, y0, x1-x0, y1-y0);
  var bh = 22, bw = 44, seed = 1;
  function r(){ seed = (seed*16807) % 2147483647; return seed/2147483647; }
  for (var y = Math.floor(y0/bh)*bh, row=0; y < y1; y += bh, row++){
    var off = (Math.round(y/bh)%2) ? bw/2 : 0;
    for (var x = Math.floor(x0/bw)*bw - off; x < x1; x += bw){
      var v = 26 + r()*10;
      c.fillStyle = 'rgb('+(v|0)+','+((v-3)|0)+','+((v+12)|0)+')';
      c.fillRect(x+1.5, y+1.5, bw-3, bh-3);
      c.fillStyle = 'rgba(255,255,255,0.025)'; c.fillRect(x+1.5, y+1.5, bw-3, 3);
    }
  }
  var g = c.createRadialGradient(W/2, H*0.45, 80, W/2, H*0.45, 520);

}

  var passes = [[15,'#0c0a12',0],[12,'#6f647a',0],[7,'#8e8296',-1.2],[2,'#b9adc0',-3.2]];
  passes.forEach(function(ps){

}

function drawParticles(c, parts){
  var buckets = [[],[],[],[]];
  for (var i=0;i<parts.length;i++) buckets[parts[i].t].push(parts[i]);
  function pass(list, color, k, dx, dy){
    if (!list.length) return;
    c.fillStyle = color; c.beginPath();
    for (var i=0;i<list.length;i++){ var p=list[i]; c.moveTo(p.x+dx+p.r*k, p.y+dy); c.arc(p.x+dx, p.y+dy, p.r*k, 0, 6.2832); }
    c.fill();
  }
  // 石
  pass(buckets[3], '#3e3843', 1.35, 0, 0); pass(buckets[3], '#6c6370', 1.1, 0, 0); pass(buckets[3], '#8a8090', 0.55, -1, -1.2);

    pass(buckets[2], '#ff6a1a', 3.2, 0, 0);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';

  pass(buckets[2], '#b8300f', 1.6, 0, 0); pass(buckets[2], '#ff6a1a', 1.3, 0, 0); pass(buckets[2], '#ffc24a', 0.55, 0, -0.5);

}

  // かぶと
  c.fillStyle = metal; c.beginPath(); c.arc(x, by-38, 11.5, Math.PI, 0); c.lineTo(x+11.5, by-36); c.lineTo(x-11.5, by-36); c.fill();

    c.fillStyle = '#1a1420'; c.beginPath(); c.arc(x-4,by-35,1.2,0,6.3); c.arc(x+4,by-35,1.2,0,6.3); c.fill();
    c.beginPath(); c.ellipse(x, by-29.5, 2, 2.6, 0, 0, 6.3); c.fill();
    c.fillStyle = '#7fd0ff'; c.beginPath(); c.moveTo(x+10, by-40); c.quadraticCurveTo(x+13, by-35, x+10, by-34); c.quadraticCurveTo(x+7, by-35, x+10, by-40); c.fill();
  } else if (mood === 'hit'){
    [[-4],[4]].forEach(function(o){ var ex=x+o[0], ey=by-34; c.beginPath(); c.moveTo(ex-2,ey-2); c.lineTo(ex+2,ey+2); c.moveTo(ex+2,ey-2); c.lineTo(ex-2,ey+2); c.stroke(); });

  } else if (burnt){
    c.fillStyle = '#fff'; c.beginPath(); c.arc(x-4,by-35,1.8,0,6.3); c.arc(x+4,by-35,1.8,0,6.3); c.fill();
  } else {
    var blink = (t % 3.2) < 0.12;
    if (blink){ c.beginPath(); c.moveTo(x-6,by-34); c.lineTo(x-2,by-34); c.moveTo(x+2,by-34); c.lineTo(x+6,by-34); c.stroke(); }

function drawEnemy(c, e, t){

  c.save();

  c.fillStyle = '#d61f2a'; c.beginPath(); c.arc(x-5+d*2.2, y-3.6, 1.8, 0, 6.3); c.arc(x+5+d*2.2, y-3.6, 1.8, 0, 6.3); c.fill();
  c.strokeStyle = '#1f3d1a'; c.lineWidth = 2.2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x-9,y-10); c.lineTo(x-2,y-7); c.moveTo(x+9,y-10); c.lineTo(x+2,y-7); c.stroke();
  // 口と牙
  c.strokeStyle = '#1f3d1a'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(x-6,y+4); c.lineTo(x+6,y+4); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(x-5,y+4); c.lineTo(x-3.5,y+7.5); c.lineTo(x-2,y+4); c.moveTo(x+2,y+4); c.lineTo(x+3.5,y+7.5); c.lineTo(x+5,y+4); c.fill();

function roundRect(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function addFx(k, x, y){
  if (k === 'steam'){ for (var i=0;i<2;i++) fx.push({k:'steam', x:x+(Math.random()-0.5)*6, y:y, vx:(Math.random()-0.5)*20, vy:-30-Math.random()*40, life:0, max:0.7+Math.random()*0.4}); }
  else if (k === 'melt'){ for (var j=0;j<4;j++) fx.push({k:'spark', x:x, y:y, vx:(Math.random()-0.5)*120, vy:-60-Math.random()*90, life:0, max:0.4+Math.random()*0.3}); }
  else if (k === 'burn'){ for (var m=0;m<16;m++) fx.push({k:'smoke', x:x+(Math.random()-0.5)*20, y:y+(Math.random()-0.5)*16, vx:(Math.random()-0.5)*40, vy:-20-Math.random()*50, life:0, max:0.9+Math.random()*0.7}); }
  else if (k === 'star'){ fx.push({k:'star', x:x, y:y, vx:(Math.random()-0.5)*50, vy:-60-Math.random()*40, life:0, max:0.6}); }
}
function stepFx(dt){
  for (var i=fx.length-1;i>=0;i--){
    var f = fx[i]; f.life += dt; f.x += f.vx*dt; f.y += f.vy*dt;
    if (f.k === 'spark') f.vy += 400*dt;
    if (f.life >= f.max) fx.splice(i,1);
  }
  if (fx.length > 400) fx.splice(0, fx.length-400);
}
function drawFx(c){
  fx.forEach(function(f){
    var a = 1 - f.life/f.max;
    if (f.k === 'steam'){ c.fillStyle = 'rgba(235,240,250,'+(a*0.55)+')'; c.beginPath(); c.arc(f.x, f.y, 3+f.life*14, 0, 6.3); c.fill(); }
    else if (f.k === 'smoke'){ c.fillStyle = 'rgba(60,55,65,'+(a*0.8)+')'; c.beginPath(); c.arc(f.x, f.y, 5+f.life*16, 0, 6.3); c.fill(); }
    else if (f.k === 'spark'){ c.fillStyle = 'rgba(255,214,90,'+a+')'; c.fillRect(f.x-1.5, f.y-1.5, 3, 3); }
    else if (f.k === 'star'){
      c.fillStyle = 'rgba(255,240,170,'+a+')'; c.save(); c.translate(f.x, f.y); c.rotate(f.life*6);
      c.beginPath(); for (var i=0;i<8;i++){ var r = i%2?2:6; c.lineTo(Math.cos(i*Math.PI/4)*r, Math.sin(i*Math.PI/4)*r); } c.fill(); c.restore();
    }
  });
}

function heroMood(w){
  if (w.status === 'win') return 'win';
  if (!w.hero.alive) return w.reason === 'lava' ? 'burnt' : 'hit';
  if (w.status === 'lose') return 'hit';
  var h = w.hero, hy = h.y - 25;
  for (var i=0;i<w.parts.length;i++){ var p = w.parts[i]; if (p.t===2){ var dx=p.x-h.x, dy=p.y-hy; if (dx*dx+dy*dy < 75*75) return 'fear'; } }
  for (var j=0;j<w.enemies.length;j++){ var e=w.enemies[j]; if (e.alive && Math.abs(e.x-h.x) < 110 && Math.abs(e.y-hy) < 50) return 'fear'; }
  return 'idle';
}

// ---------- レイアウト ----------
function resize(){
  var r = cv.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio||1, 3);
  view.w = r.width; view.h = r.height; view.dpr = dpr;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  var s = Math.min(r.width/W, r.height/H);
  view.s = s; view.ox = (r.width - W*s)/2; view.oy = (r.height - H*s)/2;
  buildStatic();
}
function worldTf(c){ c.setTransform(view.s*view.dpr, 0, 0, view.s*view.dpr, view.ox*view.dpr, view.oy*view.dpr); }
function buildStatic(){
  if (!world) return;
  stat.width = cv.width; stat.height = cv.height;
  var c = stat.getContext('2d'); worldTf(c);
  drawBricks(c, -view.ox/view.s, -view.oy/view.s, W + view.ox/view.s, H + view.oy/view.s);
  drawWalls(c, world.segs, world.zone);
}

// ---------- ゲーム進行 ----------
function hudInit(){
  $('stno').textContent = li+1;
  var f = $('foes'); f.innerHTML = '';
  world.enemies.forEach(function(){ var d = document.createElement('div'); d.className = 'foe'; f.appendChild(d); });
}
function hudUpdate(){
  var g = Math.min(1, world.gold / world.target);
  $('fill').style.width = (g*100).toFixed(1)+'%';
  $('bar').classList.toggle('ok', g >= 1);
  var ds = $('foes').children;
  world.enemies.forEach(function(e, i){ if (ds[i]) ds[i].classList.toggle('dead', !e.alive); });
}
function start(i){
  li = Math.max(0, Math.min(LV.length-1, i));
  world = E.create(LV[li], (Math.random()*1e9)|0);
  for (var k=0;k<30;k++) E.step(world, 1/60); // 初期配置をなじませる
  world.ev.length = 0; world.t = 0; world.lastPull = -99;
  fx = []; endAt = 0; endShown = false; lastGold = 0;
  hintOn = (li === 0 && save.cleared.indexOf(0) < 0);
  $('ov-win').hidden = true; $('ov-lose').hidden = true; $('title').hidden = true;
  hudInit(); resize();
}

function onTap(ev){
  Snd.init();
  if (!world || world.status !== 'play') return;
  var r = cv.getBoundingClientRect();
  var x = (ev.clientX - r.left - view.ox)/view.s, y = (ev.clientY - r.top - view.oy)/view.s;
  var best = null, bd = 1e9;
  world.pins.forEach(function(p){
    if (p.state !== 0) return;
    var s = E.pinSeg(p), rx = s.x2+p.ux*10, ry = s.y2+p.uy*10;
    var dh = Math.hypot(x-rx, y-ry) - 12;
    var dx=s.x2-s.x1, dy=s.y2-s.y1, t=((x-s.x1)*dx+(y-s.y1)*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t));
    var dr = Math.hypot(x-(s.x1+dx*t), y-(s.y1+dy*t)) - 4;
    var d = Math.min(dh, dr + 4);
    if (d < bd){ bd = d; best = p; }
  });
  if (best && bd < 22){
    E.pull(world, best.id); Snd.pin(); hintOn = false;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
  }
}

function handleEvents(){
  var ev = world.ev;
  for (var i=0;i<ev.length;i++){
    var e = ev[i];
    if (e.k === 'steam'){ addFx('steam', e.x, e.y); Snd.steam(); }
    else if (e.k === 'melt'){ addFx('melt', e.x, e.y); Snd.melt(); }
    else if (e.k === 'burn'){ addFx('burn', e.x, e.y); Snd.burn(); }
    else if (e.k === 'win'){ endAt = now + 0.8; Snd.win(); if (save.cleared.indexOf(li) < 0){ save.cleared.push(li); persist(); } }
    else if (e.k === 'lose'){ endAt = now + 1.2; Snd.lose(); }
  }
  ev.length = 0;
  if (world.gold > lastGold){
    Snd.coin();
    var h = world.hero; addFx('star', h.x + (Math.random()-0.5)*30, h.y - 50);
  }
  lastGold = world.gold;
}

function fluidLevel(){
  var wv = 0, lv = 0, nw = 0, nl = 0;
  for (var i=0;i<world.parts.length;i++){
    var p = world.parts[i], s = Math.abs(p.vx)+Math.abs(p.vy);
    if (p.t === 1){ nw++; if (s > 70) wv++; } else if (p.t === 2){ nl++; if (s > 50) lv++; }
  }
  Snd.flow(nw ? wv/Math.max(30,nw) : 0, nl ? lv/Math.max(30,nl) : 0);
}

var acc = 0, prev = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt = prev ? Math.min(0.05, (ts-prev)/1000) : 0.016; prev = ts; now += dt;
  if (!world || !$('title').hidden) { if (!$('title').hidden) drawLogo(); return; }
  acc += dt; var n = 0;
  while (acc >= 1/60 && n < 3){
    if (world.status === 'play' || now < endAt + 2) E.step(world, 1/60);
    acc -= 1/60; n++;
  }
  if (n === 3) acc = 0;
  handleEvents(); stepFx(dt); fluidLevel(); hudUpdate();
  if (endAt && !endShown && now >= endAt){
    endShown = true;
    if (world.status === 'win'){
      var last = li === LV.length-1;
      $('wintext').textContent = last ? 'ぜんぶクリア!' : 'クリア!';
      $('wnext').hidden = last;
      $('ov-win').hidden = false;
    } else $('ov-lose').hidden = false;
  }
  // 描画
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(stat, 0, 0);
  worldTf(ctx);
  drawParticles(ctx, world.parts);
  world.enemies.forEach(function(e){ if (e.alive) drawEnemy(ctx, e, now); });
  drawHero(ctx, world.hero.x, world.hero.y, heroMood(world), now);
  drawPins(ctx, world.pins, hintOn);
  drawFx(ctx);
}

// ---------- タイトル ----------
var logoCtx = $('logo').getContext('2d'), logoW = null;
function makeLogoWorld(){
  var L = {
    walls: [[[40,20],[40,130],[95,165]], [[180,20],[180,130],[130,165]], [[220,20],[220,130],[260,165]], [[340,20],[340,130],[300,165]]],
    pins: [{a:[183,118], b:[18,118]}, {a:[217,118], b:[362,118]}],
    spawn: [{t:0,x:48,y:40,w:124,h:76,n:60}, {t:2,x:228,y:40,w:104,h:76,n:50}],
    hero: [190,225], zone:[0,0,1,1]
  };
  logoW = E.create(L, 5); for (var i=0;i<60;i++) E.step(logoW, 1/60);
}
function drawLogo(){
  if (!logoW) makeLogoWorld();
  var c = logoCtx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,760,460);
  c.setTransform(1.95,0,0,1.95,8,4);
  drawWalls(c, logoW.segs, null);
  drawParticles(c, logoW.parts);
  drawHero(c, 180, 222, 'fear', now);
  drawPins(c, logoW.pins, false);
}
function showTitle(){
  var g = $('grid'); g.innerHTML = '';
  var maxOpen = 0; save.cleared.forEach(function(i){ maxOpen = Math.max(maxOpen, i+1); });
  LV.forEach(function(_, i){
    var b = document.createElement('button'); b.className = 'st'; b.textContent = i+1;
    var done = save.cleared.indexOf(i) >= 0, lock = i > maxOpen;
    if (done) b.classList.add('done'); if (lock){ b.classList.add('lock'); b.disabled = true; }
    b.setAttribute('aria-label', 'ステージ'+(i+1));
    b.onclick = function(){ Snd.init(); Snd.click(); start(i); };
    g.appendChild(b);
  });
  $('ov-win').hidden = true; $('ov-lose').hidden = true;
  $('title').hidden = false; Snd.flow(0,0);
}

// ---------- イベント ----------
cv.addEventListener('pointerdown', onTap);
$('bretry').onclick = function(){ Snd.init(); Snd.click(); start(li); };
$('lretry').onclick = function(){ Snd.click(); start(li); };
$('wnext').onclick = function(){ Snd.click(); start(li+1); };
$('bmenu').onclick = $('wmenu').onclick = $('lmenu').onclick = function(){ Snd.init(); Snd.click(); showTitle(); };
$('bsound').onclick = $('tsound').onclick = toggleSound;
document.addEventListener('pointerdown', function(){ Snd.init(); }, {once:false, passive:true});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', function(){ prev = 0; });

paintSound();
showTitle();
requestAnimationFrame(frame);
})();
