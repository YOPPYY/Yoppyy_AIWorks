<script>
// <logic>
const RANKS=['10','J','Q','K','A'];
const SUITS=['♠︎','♥︎','♦︎','♣︎'];
const CATS=['ワンペア','ツーペア','スリーカード','ストレート','フルハウス','フォーカード','ロイヤルフラッシュ'];
function evalHand(h){
  const cnt=[0,0,0,0,0]; h.forEach(c=>cnt[c.r]++);
  const g=[]; for(let r=4;r>=0;r--) if(cnt[r]) g.push([cnt[r],r]);
  g.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const pat=g.map(x=>x[0]).join('');
  let cat;
  if(pat==='41') cat=5; else if(pat==='32') cat=4; else if(pat==='311') cat=2;
  else if(pat==='221') cat=1; else if(pat==='2111') cat=0;
  else cat=h.every(c=>c.s===h[0].s)?6:3;
  return {cat,tb:g.map(x=>x[1])};
}
function cmpHand(a,b){
  if(a.cat!==b.cat) return a.cat-b.cat;
  for(let i=0;i<a.tb.length;i++) if(a.tb[i]!==b.tb[i]) return a.tb[i]-b.tb[i];
  return 0;
}
function val(e){
  const t=e.tb;
  switch(e.cat){
    case 0: return .12+.08*t[0];
    case 1: return .5+.04*t[0]+.005*t[1];
    case 2: return .78+.02*t[0];
    case 3: return .92;
    case 4: return .94+.008*t[0];
    case 5: return .98+.003*t[0];
    default: return 1;
  }
}
function allCards(){const a=[];for(let r=0;r<5;r++)for(let s=0;s<4;s++)a.push({r,s});return a;}
function combos(arr,k,cb){
  const idx=[];
  (function rec(st){
    if(idx.length===k){cb(idx.map(i=>arr[i]));return;}
    for(let i=st;i<arr.length;i++){idx.push(i);rec(i+1);idx.pop();}
  })(0);
}
// CPUの交換: 残す札のビットマスクを返す(期待値が最大になる組み合わせ)
function cpuHold(hand){
  const key=c=>c.r*4+c.s;
  const hs=new Set(hand.map(key));
  const unseen=allCards().filter(c=>!hs.has(key(c)));
  let best=-1,bestMask=31;
  for(let m=31;m>=0;m--){
    const kept=hand.filter((_,i)=>(m>>i)&1);
    const k=5-kept.length;
    let sum=0,n=0;
    if(k===0){sum=val(evalHand(hand));n=1;}
    else combos(unseen,k,d=>{sum+=val(evalHand(kept.concat(d)));n++;});
    const v=sum/n;
    if(v>best+1e-9){best=v;bestMask=m;}
  }
  return bestMask;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function popcnt(m){let c=0;while(m){c+=m&1;m>>=1;}return c;}
// 公開情報だけで、CPUの交換計画(cm)に対して勝つ確率が最も高い残し方を探す(同率なら残す枚数が多い方)
function bestMaskOpen(P,C,cm,deck){
  const ck=C.filter((_,i)=>(cm>>i)&1),kc=5-ck.length;
  let best=-1,bm=31;
  for(let m=0;m<32;m++){
    const kept=P.filter((_,i)=>(m>>i)&1),k=5-kept.length;
    let w=0,n=0;
    combos(deck,k,d1=>{
      const ph=evalHand(kept.concat(d1));
      const rest=deck.filter(c=>d1.indexOf(c)<0);
      combos(rest,kc,d2=>{n++;const r=cmpHand(ph,evalHand(ck.concat(d2)));w+=r>0?1:(r===0?.5:0);});
    });
    const v=w/n;
    if(v>best+1e-9||(Math.abs(v-best)<=1e-9&&popcnt(m)>popcnt(bm))){best=v;bm=m;}
  }
  return bm;
}
// </logic>

const $=id=>document.getElementById(id);
const CANCEL={};
let epoch=0,paused=false,inGame=false;
const S={me:500,cpu:500,pot:0,bet:0,rounds:0,myPaid:0};
let P=[],C=[],deck=[],held=[false,false,false,false,false],phase='idle',drawBtn=null,cpuPlan=0;
const prefs={sound:true,open:true};
try{const p=JSON.parse(localStorage.getItem('tenace-prefs')||'{}');
  if(typeof p.sound==='boolean')prefs.sound=p.sound;else if(p.bgm===false&&p.se===false)prefs.sound=false;
  if(typeof p.open==='boolean')prefs.open=p.open;}catch(e){}
function savePrefs(){try{localStorage.setItem('tenace-prefs',JSON.stringify(prefs));}catch(e){}}

/* ---------- 時間と入力(ポーズ中は止まる) ---------- */
function sleep(ms){return new Promise(res=>{let left=ms;const t=setInterval(()=>{if(paused)return;left-=40;if(left<=0){clearInterval(t);res();}},40);});}
async function sl(ms){const e=epoch;await sleep(ms);if(e!==epoch)throw CANCEL;}
function ask(list){
  return new Promise(res=>{
    const box=$('actions');box.innerHTML='';
    list.forEach(b=>{
      const el=document.createElement('button');
      el.className='btn '+(b.cls||'');el.textContent=b.label;
      if(b.disabled)el.disabled=true;
      el.onclick=()=>{if(paused)return;sfx.click();if(b.fn){b.fn();return;}box.innerHTML='';res(b.key);};
      box.appendChild(el);
    });
  });
}
async function A(list){const e=epoch;const k=await ask(list);if(e!==epoch)throw CANCEL;return k;}

/* ---------- 音 ---------- */
let ctx=null,master,seGain,bgmGain,noiseBuf=null,bgmTimer=null,bgmStep=0,bgmNext=0;
function initAudio(){
  if(ctx)return;
  try{
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    seGain=ctx.createGain();seGain.gain.value=.8;seGain.connect(master);
    bgmGain=ctx.createGain();bgmGain.gain.value=prefs.sound?.5:0;bgmGain.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){ctx=null;}
}
function m2f(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,d,type,v,t0,f2,dest){
  if(!ctx)return;
  const t=ctx.currentTime+(t0||0);
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||seGain);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,f,q,t0,type,dest){
  if(!ctx)return;
  const t=ctx.currentTime+(t0||0);
  const s=ctx.createBufferSource();s.buffer=noiseBuf;
  const fl=ctx.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q||1;
  const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(dest||seGain);s.start(t,Math.random()*.5);s.stop(t+d+.02);
}
const se=fn=>(...a)=>{if(prefs.sound&&ctx)fn(...a);};
const sfx={
  click:se(()=>tone(520,.07,'triangle',.18)),
  deal:se(()=>{noise(.06,.5,3200,.8);tone(180,.05,'sine',.12);}),
  flip:se(()=>{noise(.09,.45,1800,.9);tone(300,.06,'triangle',.08);}),
  hold:se(()=>tone(740,.08,'square',.07)),
  unhold:se(()=>tone(480,.08,'square',.06)),
  chip:se(()=>{tone(2300,.09,'triangle',.12);tone(3000,.08,'triangle',.1,.05);noise(.05,.3,6000,1,0,'highpass');}),
  win:se(()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.17,i*.09));}),
  big:se(()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.4,'triangle',.18,i*.08));tone(262,.9,'sine',.2,0);}),
  lose:se(()=>{tone(330,.35,'sawtooth',.1,0,160);tone(247,.5,'sawtooth',.09,.18,110);}),
  draw:se(()=>{tone(440,.2,'triangle',.14);tone(440,.2,'triangle',.14,.15);}),
  fold:se(()=>tone(260,.3,'sine',.14,0,170))
};
// BGM: 8小節ループのラウンジジャズ風
const CHORDS=[
  {r:38,th:3,comp:[53,57,60,64],mel:[62,65,67,69,72,74]},
  {r:43,th:4,comp:[53,59,62,67],mel:[62,65,67,71,74,77]},
  {r:48,th:4,comp:[52,55,59,64],mel:[64,67,71,72,76,79]},
  {r:45,th:3,comp:[55,60,64,67],mel:[64,67,69,72,76,79]},
  {r:38,th:3,comp:[53,57,60,64],mel:[62,65,69,72,74,77]},
  {r:43,th:4,comp:[53,59,62,67],mel:[62,67,71,74,77,79]},
  {r:48,th:4,comp:[52,55,59,64],mel:[64,67,71,74,76,79]},
  {r:43,th:4,comp:[53,59,62,65],mel:[62,65,67,71,74,77]}
];
const SPB=60/92;
let lastMel=0;
function bgmStepAt(n,t){
  const bar=Math.floor(n/8)%8,s=n%8,ch=CHORDS[bar],nx=CHORDS[(bar+1)%8];
  const off=t-ctx.currentTime;
  if(s===0||s===2||s===4||s===6){
    noise(.05,.12,7500,.7,off,'highpass',bgmGain);
    const appr=nx.r+(ch.r<nx.r?-1:1);
    const note=[ch.r,ch.r+ch.th,ch.r+7,appr][s/2];
    tone(m2f(note),SPB*.62,'triangle',.3,off,null,bgmGain);
    tone(m2f(note),SPB*.5,'sine',.25,off,null,bgmGain);
  }else if(s===3||s===7){
    noise(.04,.08,7500,.7,off,'highpass',bgmGain);
  }
  if(s===0||s===3){
    ch.comp.forEach(m=>tone(m2f(m),SPB*.55,'triangle',s===0?.045:.06,off,null,bgmGain));
  }
  if((s===0||s===2||s===3||s===4||s===6||s===7)&&Math.random()<(s===0?.55:.36)){
    let m=ch.mel[Math.floor(Math.random()*ch.mel.length)];
    if(m===lastMel)m=ch.mel[(ch.mel.indexOf(m)+2)%ch.mel.length];
    lastMel=m;
    tone(m2f(m),SPB*.9,'sine',.11,off,null,bgmGain);
    tone(m2f(m)*2,SPB*.5,'sine',.035,off,null,bgmGain);
  }
}
function startBgm(){
  if(!ctx||bgmTimer)return;
  bgmNext=ctx.currentTime+.15;bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(!ctx||ctx.state!=='running')return;
    while(bgmNext<ctx.currentTime+.2){
      bgmStepAt(bgmStep,bgmNext);
      bgmNext+=(bgmStep%2===0)?SPB*2/3:SPB/3;
      bgmStep++;
    }
  },50);
}
function applyPrefs(){
  document.querySelectorAll('.sndbtn').forEach(b=>b.textContent='サウンド '+(prefs.sound?'ON':'OFF'));
  document.querySelectorAll('.opnbtn').forEach(b=>b.textContent='手札・確率の表示 '+(prefs.open?'ON':'OFF'));
  $('hSnd').classList.toggle('off',!prefs.sound);
  if(bgmGain)bgmGain.gain.value=prefs.sound?.5:0;
}
function toggleSound(){prefs.sound=!prefs.sound;savePrefs();applyPrefs();if(prefs.sound){initAudio();sfx.click();}}

/* ---------- 表示 ---------- */
function mkCard(c,down,anim){
  const el=document.createElement('div');
  el.className='card'+(down?' down':'')+(anim?' in':'');
  const red=c.s===1||c.s===2;
  el.innerHTML='<div class="inner"><div class="face'+(red?' red':'')+'"><div class="tl"><b>'+RANKS[c.r]+'</b><i>'+SUITS[c.s]+'</i></div><div class="mid">'+SUITS[c.s]+'</div></div><div class="back"></div></div>';
  return el;
}
function setName(id,text,big){const e=$(id);e.textContent=text||'';e.className=big?'big':'';}
function msg(t,cls){const m=$('msg');m.textContent=t||'';m.className=cls||'';}
function updChips(){$('meChips').textContent=S.me;$('cpuChips').textContent=S.cpu;$('potV').textContent=S.pot;$('pot').classList.toggle('on',S.pot>0);}
function refreshPlName(){
  if(P.length===5&&phase!=='idle'){const e=evalHand(P);setName('plName',CATS[e.cat],e.cat>=3);}
}
function refreshCpuName(){
  if(prefs.open&&C.length===5&&phase!=='idle'){const e=evalHand(C);setName('cpuName',CATS[e.cat],e.cat>=3);}
}
// 役ごとの確率: 残す札を固定し、公開されている山札(pool)から引き直す全組み合わせを数える
function oddsOf(hand,keep,pool){
  const kept=hand.filter((_,i)=>keep[i]);
  const k=5-kept.length;
  const cnt=[0,0,0,0,0,0,0];let n=0;
  combos(pool,k,d=>{cnt[evalHand(kept.concat(d)).cat]++;n++;});
  return cnt.map(c=>c/n);
}
const SHORT=['ワンペア','ツーペア','スリーカード','ストレート','フルハウス','フォーカード','ロイヤル'];
function fillCol(id,hand,keep,pool){
  const p=oddsOf(hand,keep,pool);
  const k=keep.filter(h=>!h).length;
  $('oh'+id).textContent=k?'交換 '+k+'枚':'そのまま';
  let html='';
  for(let c=6;c>=0;c--){
    if(p[c]<=0)continue;
    const pc=p[c]*100;
    html+='<div class="or" style="--p:'+pc.toFixed(1)+'%"><span>'+SHORT[c]+'</span><span class="op">'+(pc>99.95?'100':pc.toFixed(1))+'%</span></div>';
  }
  $('or'+id).innerHTML=html;
}
function openPanel(y,c,fix){
  $('ocY').hidden=!y;$('ocC').hidden=!c;
  $('odds').classList.toggle('fix',!!fix);
  $('odds').hidden=false;$('mid').classList.add('od');
}
function hideOdds(){$('odds').hidden=true;$('mid').classList.remove('od');}
function updateOdds(){
  if(!prefs.open||phase!=='draw')return;
  fillCol('Y',P,held.slice(),deck);
}
// おすすめ: 公開表示ONなら勝つ確率が最大の残し方、OFFならCPUと同じ期待値の考え方
function recommend(){return prefs.open?bestMaskOpen(P,C,cpuPlan,deck):cpuHold(P);}
function applyHold(mask){
  for(let i=0;i<5;i++){held[i]=!!((mask>>i)&1);$('plHand').children[i].classList.toggle('hold',held[i]);}
  sfx.hold();updateDrawBtn();updateOdds();
}
function updateDrawBtn(){
  if(!drawBtn)return;
  const n=held.filter(h=>!h).length;
  drawBtn.textContent=n===0?'このまま勝負':'交換 '+n+'枚';
}
function resetTable(){
  $('plHand').innerHTML='';$('cpuHand').innerHTML='';
  $('plHand').classList.remove('win');$('cpuHand').classList.remove('win');
  setName('plName','');setName('cpuName','');msg('');hideOdds();
  S.pot=0;S.bet=0;S.myPaid=0;held=[false,false,false,false,false];P=[];C=[];updChips();
}
function sortHand(h){return h.sort((a,b)=>a.r-b.r||a.s-b.s);}
function flipReveal(){return (async()=>{
  const els=$('cpuHand').children;
  for(let i=0;i<5;i++){els[i].classList.remove('down');sfx.flip();await sl(140);}
})();}

/* ---------- ゲーム進行 ---------- */
async function swapCards(side,idxs){
  const box=side==='pl'?$('plHand'):$('cpuHand');
  const hand=side==='pl'?P:C;
  idxs.forEach(i=>box.children[i].classList.add('out'));
  await sl(280);
  for(const i of idxs){
    const c=deck.shift();hand[i]=c;
    const el=mkCard(c,side==='cpu'&&!prefs.open,true);
    box.replaceChild(el,box.children[i]);
    if(side==='pl'){el.addEventListener('click',()=>toggleHold(i));}
    sfx.deal();await sl(130);
  }
}
function toggleHold(i){
  if(phase!=='draw'||paused)return;
  held[i]=!held[i];
  $('plHand').children[i].classList.toggle('hold',held[i]);
  (held[i]?sfx.hold:sfx.unhold)();
  updateDrawBtn();updateOdds();
}
async function round(){
  S.rounds++;
  resetTable();phase='idle';
  const maxBet=Math.min(S.me,S.cpu);
  const vals=[10,50,100].filter(v=>v<=maxBet);
  if(maxBet>100)vals.push(maxBet);else if(!vals.includes(maxBet))vals.push(maxBet);
  msg('賭け金を選ぼう');
  const bet=await A(vals.map(v=>({key:v,label:(v===maxBet&&v>100)?'ALL IN':String(v),cls:v===maxBet&&v>100?'danger':''})));
  S.bet=bet;S.me-=bet;S.cpu-=bet;S.pot=bet*2;S.myPaid=bet;updChips();sfx.chip();msg('');
  // 配る
  deck=shuffle(allCards());
  P=sortHand(deck.splice(0,5));C=sortHand(deck.splice(0,5));
  phase='deal';
  for(let i=0;i<5;i++){
    const pe=mkCard(P[i],false,true);const ci=i;
    pe.addEventListener('click',()=>toggleHold(ci));
    $('plHand').appendChild(pe);sfx.deal();await sl(110);
    $('cpuHand').appendChild(mkCard(C[i],!prefs.open,true));sfx.deal();await sl(110);
  }
  phase='draw';refreshPlName();refreshCpuName();
  cpuPlan=cpuHold(C);
  if(prefs.open){
    const ck=[0,1,2,3,4].map(i=>!!((cpuPlan>>i)&1));
    [...$('cpuHand').children].forEach((el,i)=>el.classList.add(ck[i]?'keep':'dim'));
    fillCol('C',C,ck,deck);fillCol('Y',P,held.slice(),deck);openPanel(true,true,true);
  }else msg('残すカードをタップ');
  const pr=A([{key:'rec',label:'おすすめ',cls:'sub rec',fn:()=>{if(phase==='draw')applyHold(recommend());}},{key:'draw',label:''}]);
  drawBtn=$('actions').lastChild;updateDrawBtn();
  await pr;drawBtn=null;
  phase='busy';msg('');hideOdds();
  const idxs=[0,1,2,3,4].filter(i=>!held[i]);
  $('plHand').querySelectorAll('.hold').forEach(e=>e.classList.remove('hold'));
  if(idxs.length)await swapCards('pl',idxs);
  refreshPlName();
  // CPUの交換
  const mask=cpuPlan;
  const cIdx=[0,1,2,3,4].filter(i=>!((mask>>i)&1));
  const cKeep=[0,1,2,3,4].map(i=>!!((mask>>i)&1));
  if(prefs.open){
    [...$('cpuHand').children].forEach((el,i)=>el.classList.add(cKeep[i]?'keep':'dim'));
    msg(cIdx.length?'CPU '+cIdx.length+'枚交換':'CPU 交換なし');
    await sl(1200);
  }else{
    msg(cIdx.length?'CPU '+cIdx.length+'枚交換':'CPU 交換なし');
    await sl(500);
  }
  if(cIdx.length)await swapCards('cpu',cIdx);
  if(prefs.open){[...$('cpuHand').children].forEach(el=>el.classList.remove('keep','dim'));hideOdds();refreshCpuName();}
  await sl(300);msg('');
  // ベット
  const pe=evalHand(P),ce=evalHand(C),cv=val(ce);
  const r=Math.min(S.bet,S.me,S.cpu);
  let folded=null; // 'cpu' | 'me'
  if(r>0){
    msg('勝負する?');
    const act=await A([{key:'check',label:'チェック',cls:'sub'},{key:'raise',label:'レイズ +'+r}]);
    if(act==='raise'){
      S.me-=r;S.myPaid+=r;S.pot+=r;updChips();sfx.chip();msg('レイズ!');
      await sl(800);
      const call=cv>=.5||(cv>=.3&&Math.random()<.45)||Math.random()<.12;
      if(call){S.cpu-=r;S.pot+=r;updChips();sfx.chip();msg('CPU コール');await sl(800);}
      else{folded='cpu';}
    }else{
      const raise=cv>=.5?Math.random()<.8:Math.random()<.12;
      if(raise){
        S.cpu-=r;S.pot+=r;updChips();sfx.chip();msg('CPU レイズ +'+r);
        const k=await A([{key:'call',label:'コール −'+r},{key:'drop',label:'ドロップ',cls:'danger'}]);
        if(k==='call'){S.me-=r;S.myPaid+=r;S.pot+=r;updChips();sfx.chip();msg('コール');await sl(700);}
        else folded='me';
      }else{msg('CPU チェック');await sl(800);}
    }
  }
  // 結果
  phase='end';
  const paid=S.myPaid;
  if(folded==='cpu'){
    sfx.fold();S.me+=S.pot;const net=S.pot-paid;S.pot=0;updChips();
    msg('CPUがドロップ +'+net,'win');sfx.win();
  }else if(folded==='me'){
    sfx.fold();S.cpu+=S.pot;S.pot=0;updChips();
    msg('ドロップ −'+paid,'lose');
  }else{
    msg('');if(!prefs.open)await flipReveal();
    setName('cpuName',CATS[ce.cat],ce.cat>=3);
    await sl(500);
    const c=cmpHand(pe,ce);
    if(c>0){
      $('plHand').classList.add('win');
      S.me+=S.pot;const net=S.pot-paid;S.pot=0;updChips();
      msg('勝ち! +'+net,'win');(pe.cat>=4?sfx.big:sfx.win)();
    }else if(c<0){
      $('cpuHand').classList.add('win');
      S.cpu+=S.pot;S.pot=0;updChips();
      msg('負け −'+paid,'lose');sfx.lose();
    }else{
      const half=S.pot/2;S.me+=half;S.cpu+=half;S.pot=0;updChips();
      msg('引き分け');sfx.draw();
    }
  }
  await sl(300);
  if(S.cpu<=0){await finish(true);return false;}
  if(S.me<=0){await finish(false);return false;}
  await A([{key:'next',label:'次のゲーム'}]);
  return true;
}
function bestRounds(){try{return +localStorage.getItem('tenace-best')||0;}catch(e){return 0;}}
async function finish(win){
  inGame=false;phase='idle';
  await sl(600);
  let stat='';
  if(win){
    const b=bestRounds();
    if(!b||S.rounds<b){try{localStorage.setItem('tenace-best',String(S.rounds));}catch(e){}stat=S.rounds+'ゲームでクリア (最短記録)';}
    else stat=S.rounds+'ゲームでクリア (最短 '+b+'ゲーム)';
    sfx.big();
  }else{stat=S.rounds+'ゲーム目でチップがなくなった';sfx.lose();}
  $('endTitle').textContent=win?'CPUのチップを0にした!':'チップがなくなった…';
  $('endStat').textContent=stat;
  $('end').hidden=false;
}
async function playGame(){
  const e=epoch;
  try{
    S.me=500;S.cpu=500;S.rounds=0;
    $('actions').innerHTML='';
    while(await round()){}
  }catch(err){if(err!==CANCEL)throw err;}
}
function startNew(){
  epoch++;paused=false;document.body.classList.remove('paused');
  $('pause').hidden=true;$('end').hidden=true;$('title').hidden=true;
  if(ctx&&ctx.state==='suspended')ctx.resume();
  inGame=true;phase='idle';resetTable();S.me=500;S.cpu=500;updChips();
  playGame();
}

/* ---------- ポーズ ---------- */
function setPause(p){
  if(p===paused)return;
  if(p&&!inGame)return;
  paused=p;document.body.classList.toggle('paused',p);
  $('pause').hidden=!p;
  if(ctx){p?ctx.suspend():ctx.resume();}
}
$('pauseBtn').onclick=()=>{sfx.click();setPause(true);};
$('resumeBtn').onclick=()=>setPause(false);
$('restartBtn').onclick=()=>{startNew();};
document.querySelectorAll('.sndbtn').forEach(b=>b.onclick=toggleSound);
$('hSnd').onclick=toggleSound;
$('openBtn').onclick=()=>{prefs.open=!prefs.open;savePrefs();applyPrefs();};
$('titleBtn').onclick=()=>{
  epoch++;paused=false;document.body.classList.remove('paused');
  if(ctx&&ctx.state==='suspended')ctx.resume();
  $('pause').hidden=true;$('end').hidden=true;inGame=false;phase='idle';
  $('actions').innerHTML='';resetTable();$('title').hidden=false;
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(inGame)setPause(!paused);}});
$('startBtn').onclick=()=>{initAudio();applyPrefs();startBgm();if(ctx&&ctx.state==='suspended')ctx.resume();startNew();};
$('againBtn').onclick=()=>{initAudio();startNew();};
applyPrefs();
</script>
