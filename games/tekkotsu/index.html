<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>鉄骨渡り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
/* 夜の高層ビル街を真上から。鉄骨の錆朱と安全黄色だけを強く使う */
:root{
  --bg:#070b14;
  --ink:#eef2f8;
  --muted:#8b97ad;
  --steel:#c9562c;
  --hazard:#f4c430;
  --danger:#ff4a3d;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  text-align:center;background:linear-gradient(180deg,rgba(7,11,20,.25),rgba(7,11,20,.72) 55%,rgba(7,11,20,.88))}
.ttl{font-family:var(--display);font-size:clamp(52px,17vw,88px);line-height:1;letter-spacing:.04em;margin:0;
  color:var(--ink);text-shadow:0 4px 0 #7a2c16,0 10px 30px rgba(0,0,0,.6)}
.ttl span{color:var(--hazard)}
.lead{margin:0;font-size:15px;line-height:1.8;color:var(--ink);opacity:.9}
.best{margin:0;font-family:var(--display);font-size:14px;color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums;min-height:1em}
.btn{font-family:var(--display);font-size:22px;letter-spacing:.08em;color:#1a1204;border:0;border-radius:6px;
  padding:16px 44px;cursor:pointer;
  background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,#e3b21f 14px 28px);
  box-shadow:0 5px 0 #8a6a0c,0 12px 24px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6a0c}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.res-h{font-family:var(--display);font-size:clamp(48px,15vw,76px);margin:0;line-height:1.05}
.res-h.fail{color:var(--danger);text-shadow:0 6px 24px rgba(255,74,61,.35)}
.res-h.win{color:var(--hazard);text-shadow:0 6px 24px rgba(244,196,48,.35)}
.res-s{font-family:var(--display);font-size:24px;margin:0;font-variant-numeric:tabular-nums}
#mute{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(238,242,248,.18);background:rgba(7,11,20,.5);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:5;padding:0}
#mute svg{width:20px;height:20px}
#mute:focus-visible{outline:2px solid var(--hazard)}
</style>

<canvas id="cv"></canvas>

<button id="mute" aria-label="音のオン・オフ">
  <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<div class="overlay" id="titleOv">
  <h1 class="ttl">鉄骨<span>渡り</span></h1>
  <p class="lead">左右の足を交互に出す。<br>メーターを真上で止めろ。</p>
  <button class="btn" id="startBtn">スタート</button>
  <p class="best" id="bestTitle"></p>
</div>

<div class="overlay" id="resultOv" hidden>
  <h2 class="res-h" id="resH"></h2>
  <p class="res-s" id="resS"></p>
  <p class="best" id="resBest"></p>
  <button class="btn" id="againBtn">もう一回</button>
</div>

<script>
(()=>{
// ===== 定数 =====
const STEPS=50, S=64, K=0.8, LIM0=60, LIMMIN=10, PERF=4;
const BEAM_Y0=1.6*S, GOAL_Y=-(STEPS-0.5)*S;
const GROUND_D=3;

const cv=document.getElementById('cv'), cx=cv.getContext('2d');
let W=0,H=0,DPR=1,vpX=0,vpY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  vpX=W/2;vpY=H*0.6;
}
addEventListener('resize',resize);resize();

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// ===== 保存 =====
let best={time:null,steps:0};
try{const s=JSON.parse(localStorage.getItem('tekkotsu_best')||'null');if(s)best=Object.assign(best,s);}catch(e){}
function saveBest(){try{localStorage.setItem('tekkotsu_best',JSON.stringify(best));}catch(e){}}
let muted=false;
try{muted=localStorage.getItem('tekkotsu_mute')==='1';}catch(e){}

// ===== サウンド =====
let AC=null,master=null,noiseBuf=null,windGain=null,windF=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  AC=new C();
  master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  windF=AC.createBiquadFilter();windF.type='bandpass';windF.frequency.value=480;windF.Q.value=0.6;
  windGain=AC.createGain();windGain.gain.value=0.0001;
  src.connect(windF).connect(windGain).connect(master);src.start();
}
function tone(type,f0,dur,vol,when=0,f1=null,filt=null){
  if(!AC)return;const t=AC.currentTime+when;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let n=o;if(filt){const bq=AC.createBiquadFilter();bq.type=filt[0];bq.frequency.value=filt[1];bq.Q.value=filt[2]||1;o.connect(bq);n=bq;}
  n.connect(g).connect(master);o.start(t);o.stop(t+dur+0.05);return o;
}
function noise(dur,vol,type,freq,when=0,q=1,attack=0.005){
  if(!AC)return;const t=AC.currentTime+when;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);return f;
}
const SND={
  tick(){tone('sine',2600,0.025,0.035);},
  click(){tone('square',1400,0.035,0.05,0,null,['lowpass',3000]);},
  clang(){ // 鉄骨を踏む金属音
    const b=430+Math.random()*60;
    [[1,0.16,0.55],[2.52,0.09,0.4],[4.07,0.06,0.3],[6.31,0.035,0.22]].forEach(p=>tone('sine',b*p[0],p[2],p[1]));
    noise(0.05,0.12,'highpass',2500);
    tone('triangle',95,0.18,0.18,0,60);
  },
  perfect(){tone('sine',1318,0.18,0.12);tone('sine',1976,0.32,0.1,0.07);},
  creak(m){tone('sawtooth',120,0.32+0.2*m,0.05+0.08*m,0,62,['lowpass',700,3]);noise(0.25,0.03+0.05*m,'bandpass',900,0,4);},
  heart(){tone('sine',72,0.14,0.32,0,40);tone('sine',64,0.14,0.22,0.17,38);},
  fall(){
    if(!AC)return;const t=AC.currentTime;
    const o=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),bp=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(170,t+2.0);
    lfo.frequency.value=7;lg.gain.value=28;lfo.connect(lg).connect(o.frequency);
    bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=1.6;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.11,t+0.06);
    g.gain.setValueAtTime(0.11,t+0.9);g.gain.exponentialRampToValueAtTime(0.0001,t+2.0);
    o.connect(bp).connect(g).connect(master);o.start(t);lfo.start(t);o.stop(t+2.1);lfo.stop(t+2.1);
    const f=noise(2.1,0.16,'bandpass',300,0,0.8,1.6);if(f)f.frequency.exponentialRampToValueAtTime(1600,t+2.0);
  },
  thud(){noise(0.6,0.45,'lowpass',180);tone('sine',58,0.45,0.35,0,28);},
  goal(){[523,659,784,1047].forEach((f,i)=>tone('triangle',f,0.32,0.13,i*0.11));
    [523,659,784].forEach(f=>tone('triangle',f*2,0.9,0.06,0.48));},
  start(){tone('sine',660,0.12,0.1);tone('sine',990,0.22,0.1,0.1);},
};
function setMute(m){muted=m;try{localStorage.setItem('tekkotsu_mute',m?'1':'0');}catch(e){}
  document.getElementById('icoOn').hidden=m;document.getElementById('icoOff').hidden=!m;
  if(master)master.gain.setTargetAtTime(m?0:0.9,AC.currentTime,0.02);}
setMute(muted);
document.getElementById('mute').addEventListener('click',e=>{e.stopPropagation();initAudio();setMute(!muted);});

// ===== 地上(はるか下の街) =====
const TW=720,TH=960,BL=120;
const ground=(()=>{
  const c=document.createElement('canvas');c.width=TW;c.height=TH;const g=c.getContext('2d');const r=rng(11);
  g.fillStyle='#080d16';g.fillRect(0,0,TW,TH);
  const pal=['#172030','#1b2435','#1f2839','#151c29','#222634','#1a2230'];
  for(let i=0;i<TW/BL;i++)for(let j=0;j<TH/BL;j++){
    const x=i*BL+11,y=j*BL+11,s=BL-22;
    g.fillStyle='#101724';g.fillRect(x,y,s,s);
    if(r()<0.12){g.fillStyle='#0b1912';g.fillRect(x+3,y+3,s-6,s-6);
      for(let k=0;k<16;k++){g.fillStyle=r()<0.5?'#10261a':'#0e2016';g.beginPath();g.arc(x+8+r()*(s-16),y+8+r()*(s-16),3+r()*4,0,7);g.fill();}
      continue;}
    let rects=[];const sp=r();
    if(sp<0.3)rects=[[x+3,y+3,s-6,s-6]];
    else if(sp<0.65){const m=0.3+r()*0.4;const a=(s-8)*m;rects=r()<0.5?[[x+3,y+3,a,s-6],[x+5+a,y+3,s-8-a,s-6]]:[[x+3,y+3,s-6,a],[x+3,y+5+a,s-6,s-8-a]];}
    else{const h=(s-8)/2;rects=[[x+3,y+3,h,h],[x+5+h,y+3,h,h],[x+3,y+5+h,h,h],[x+5+h,y+5+h,h,h]];}
    rects.forEach(rc=>{
      g.fillStyle=pal[(r()*pal.length)|0];g.fillRect(rc[0],rc[1],rc[2],rc[3]);
      g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.strokeRect(rc[0]+.5,rc[1]+.5,rc[2]-1,rc[3]-1);
      if(r()<0.55){g.fillStyle='#2a364b';g.fillRect(rc[0]+4+r()*(rc[2]-14),rc[1]+4+r()*(rc[3]-14),6+r()*5,5+r()*4);}
      const n=(r()*4)|0;for(let k=0;k<n;k++){g.fillStyle='rgba(232,190,110,.55)';g.fillRect(rc[0]+2+r()*(rc[2]-5),rc[1]+2+r()*(rc[3]-5),2,2);}
    });
  }
  g.strokeStyle='rgba(140,150,170,.10)';g.lineWidth=1;g.setLineDash([6,9]);
  for(let i=0;i<=TW/BL;i++){g.beginPath();g.moveTo(i*BL,0);g.lineTo(i*BL,TH);g.stroke();}
  for(let j=0;j<=TH/BL;j++){g.beginPath();g.moveTo(0,j*BL);g.lineTo(TW,j*BL);g.stroke();}
  g.setLineDash([]);
  for(let i=0;i<=TW/BL;i++)for(let j=0;j<=TH/BL;j++){
    for(const [dx,dy] of [[-12,-12],[12,-12],[-12,12],[12,12]]){
      const gr=g.createRadialGradient(i*BL+dx,j*BL+dy,0,i*BL+dx,j*BL+dy,12);
      gr.addColorStop(0,'rgba(255,190,100,.32)');gr.addColorStop(1,'rgba(255,190,100,0)');
      g.fillStyle=gr;g.fillRect(i*BL+dx-12,j*BL+dy-12,24,24);
    }
  }
  return c;
})();
const cars=[];{const r=rng(5);for(let i=0;i<46;i++){const v=r()<0.5;cars.push({v,line:(r()*(v?TW/BL:TH/BL))|0,pos:r()*(v?TH:TW),dir:r()<0.5?-1:1,sp:14+r()*26});}}

// ===== 中層ビル(遠近つき) =====
const buildings=[];
{const r=rng(23);
  for(let i=0;i<34;i++){
    const side=r()<0.5?-1:1;const cxw=side*(70+r()*520);const w=80+r()*150,h=80+r()*200;
    const cy=BEAM_Y0+1400-r()*(BEAM_Y0+1400-GOAL_Y+1800);
    const dt=0.45+r()*1.5;const hue=210+r()*25,l=11+r()*7;
    const wins=[];for(let k=0;k<64;k++)wins.push(r()<0.35);
    buildings.push({x0:cxw-w/2,x1:cxw+w/2,y0:cy-h/2,y1:cy+h/2,dt,db:GROUND_D,hue,l,wins,rows:4+((r()*4)|0),
      unit:r()<0.7?[r(),r(),0.12+r()*0.15]:null,beacon:dt<0.9&&r()<0.6,ph:r()*6,kind:'mid'});
  }
  buildings.push({x0:-300,x1:300,y0:BEAM_Y0,y1:BEAM_Y0+900,dt:0,db:GROUND_D,hue:220,l:20,wins:new Array(64).fill(0).map((_,k)=>k%3===0),rows:9,kind:'start'});
  buildings.push({x0:-300,x1:300,y0:GOAL_Y-900,y1:GOAL_Y,dt:0,db:GROUND_D,hue:220,l:20,wins:new Array(64).fill(0).map((_,k)=>k%4===1),rows:9,kind:'goal'});
}
const beamBox={x0:-22,x1:22,y0:GOAL_Y-12,y1:BEAM_Y0+12,dt:0,db:0.05,hue:15,l:22,kind:'beam'};

// ===== ゲーム状態 =====
let state='title',T=0,camY=0,camX=0;
let feet,moving,b,bd,lim,limD,steps,a,sign,aimDelay,anim,stepFrom,stepTo,wob,fallT,fallDir,thudDone,clearT,resultShown,startTime,clearTime;
let readyT=0,goT=9,hbTimer=0,pulse=0,shake=0;const popups=[];
function reset(){
  feet={L:S,R:0};moving='L';b=0;bd=0;steps=0;lim=LIM0;limD=LIM0;a=180;sign=-1;aimDelay=0;anim=0;
  wob=0;fallT=0;fallDir=1;thudDone=false;clearT=0;resultShown=false;popups.length=0;
  camY=bodyY()-30;
}
const limitAt=n=>Math.max(LIMMIN,LIM0-n);
const speedAt=n=>150+130*Math.min(1,n/40);
function bodyY(){
  let L=feet.L,R=feet.R;
  if(state==='step'){const e=ease(anim);if(moving==='L')L=stepFrom+(stepTo-stepFrom)*e;else R=stepFrom+(stepTo-stepFrom)*e;}
  return (L+R)/2;
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
reset();

function doStop(){
  const off=90-a; // +なら右にずれた
  const red=Math.abs(off)>=40;
  b+=red?Math.sign(off)*100:off*K;SND.click();
  if(Math.abs(off)<PERF){b*=0.75;SND.perfect();popups.push({t:0,text:'ピタッ'});}
  else if(Math.abs(off)>15)SND.creak(Math.min(1,Math.abs(off)/60));
  state='step';anim=0;stepFrom=feet[moving];stepTo=feet[moving==='L'?'R':'L']-S;
}
function land(){
  feet[moving]=stepTo;steps++;SND.clang();
  if(steps>=STEPS){state='clear';clearTime=(performance.now()-startTime)/1000;SND.goal();
    if(best.time==null||clearTime<best.time)best.time=clearTime;best.steps=STEPS;saveBest();return;}
  lim=limitAt(steps);
  if(Math.abs(b)>lim){state='wobble';wob=0;SND.creak(1);return;}
  moving=moving==='L'?'R':'L';
  a=moving==='L'?180:0;sign=moving==='L'?-1:1;aimDelay=0;state='aim';
}
function startFall(){state='fall';fallT=0;fallDir=Math.sign(b)||1;SND.fall();
  if(steps>best.steps){best.steps=steps;saveBest();}}

function press(){
  if(state==='aim'&&aimDelay<=0)doStop();
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();press();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(state==='aim'){e.preventDefault();press();}}});

const titleOv=document.getElementById('titleOv'),resultOv=document.getElementById('resultOv');
function fmtBest(){
  const p=[];if(best.time!=null)p.push('ベスト '+best.time.toFixed(1)+'秒');else if(best.steps>0)p.push('最高 '+best.steps+' / '+STEPS+'歩');
  return p.join('');
}
document.getElementById('bestTitle').textContent=fmtBest();
function startGame(){initAudio();reset();state='ready';readyT=0;goT=9;tone('square',660,0.18,0.07,0,null,['lowpass',2500]);titleOv.hidden=true;resultOv.hidden=true;}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
function showResult(win){
  resultShown=true;const h=document.getElementById('resH');
  if(win){h.textContent='渡りきった';h.className='res-h win';document.getElementById('resS').textContent=clearTime.toFixed(1)+' 秒';}
  else{h.textContent='落下';h.className='res-h fail';document.getElementById('resS').textContent=steps+' / '+STEPS+' 歩';}
  document.getElementById('resBest').textContent=fmtBest();
  resultOv.hidden=false;
}

// ===== 風の粒子 =====
const parts=[];for(let i=0;i<46;i++)parts.push({x:0,y:0,d:0,len:0,dead:true});
function P(x,y,d){const f=1/(1+d);return [vpX+(x-camX)*f,vpY+(y-camY)*f,f];}
function respawn(p,edge){
  p.d=0.15+Math.random()*2.2;const f=1/(1+p.d);
  const sx=edge?(windDir>0?-20:W+20):Math.random()*W,sy=Math.random()*H;
  p.x=camX+(sx-vpX)/f;p.y=camY+(sy-vpY)/f;p.len=20+Math.random()*50;p.dead=false;
}
let windDir=1;

// ===== 更新 =====
function danger(){return Math.min(1.3,Math.abs(bd)/Math.max(1,limD));}
function update(dt){
  T+=dt;goT+=dt;
  if(state==='ready'){readyT+=dt;if(readyT>=1.1){state='aim';goT=0;startTime=performance.now();SND.start();}}
  if(state==='aim'){
    if(aimDelay>0)aimDelay-=dt;
    else{const pr=a;a+=sign*speedAt(steps)*dt;
      if((pr-90)*(a-90)<0)SND.tick();
      if(sign<0&&a<=0){a=0;doStop();}else if(sign>0&&a>=180){a=180;doStop();}}
  }else if(state==='step'){anim+=dt/0.3;if(anim>=1){anim=1;land();}}
  else if(state==='wobble'){wob+=dt;b+=Math.sign(b)*dt*30;shake=4;if(wob>0.9)startFall();}
  else if(state==='fall'){fallT+=dt;if(!thudDone&&fallT>2.1){SND.thud();thudDone=true;shake=6;}if(fallT>2.8&&!resultShown)showResult(false);}
  else if(state==='clear'){clearT+=dt;if(clearT>1.3&&!resultShown)showResult(true);}

  bd+=(b-bd)*Math.min(1,dt*7);limD+=(lim-limD)*Math.min(1,dt*5);
  const dg=danger();

  }
  list.push({d:0.005,fn:()=>drawBox(beamBox)});
  list.sort((p,q)=>q.d-p.d);
  for(const it of list)it.fn();
  // 風
  cx.lineCap='round';
  for(const p of parts){if(p.dead)continue;const s=P(p.x,p.y,p.d);cx.strokeStyle='rgba(200,215,240,'+(0.05+0.12*s[2])+')';cx.lineWidth=Math.max(0.6,1.4*s[2]);
    cx.beginPath();cx.moveTo(s[0],s[1]);cx.lineTo(s[0]-windDir*p.len*s[2],s[1]);cx.stroke();}
  let ps=null;
  if(state!=='fall')ps=drawPersonAt(pp,0,0,0);
  cx.restore();

  const dg=danger();
  // 危険のふち
  if((state==='aim'||state==='step'||state==='wobble')&&(dg>0.6||state==='wobble')){
    const k=Math.min(1,(dg-0.6)/0.5)*0.6+pulse*0.35;
    const g=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
    g.addColorStop(0,'rgba(255,40,30,0)');g.addColorStop(1,'rgba(255,40,30,'+k.toFixed(3)+')');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  if(state==='title')return;
  let arcTop=null;
  if(state==='aim'&&ps)arcTop=drawArc(ps[0]+pp.sway*0,ps[1]);
  for(const q of popups){
    const x=ps?ps[0]:W/2,y=(ps?ps[1]-165:H/2)-q.t*30;
    cx.globalAlpha=Math.max(0,1-q.t/0.9);cx.fillStyle='#7ee36a';cx.font='20px '+FONT;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(q.text,x,y);cx.globalAlpha=1;
  }
  if(state!=='clear')drawGauge();
  if(state==='ready'||goT<0.8){
    const go=state!=='ready',k=go?goT/0.8:Math.min(1,readyT/0.15);
    const sc=go?1+k*0.25:0.7+0.3*k;
    cx.save();cx.translate(W/2,H*0.4);cx.scale(sc,sc);cx.globalAlpha=go?(k<0.5?1:2-2*k):1;
    cx.font='64px '+FONT;cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';
    const tx=go?'ゴー！':'レディ';
    cx.strokeStyle='rgba(5,8,14,.9)';cx.lineWidth=10;cx.strokeText(tx,0,0);
    cx.fillStyle=go?'#f4c430':'#eef2f8';cx.fillText(tx,0,0);cx.restore();cx.globalAlpha=1;
  }
  // 歩数
  const st=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0;
  cx.font='44px '+FONT;cx.textAlign='center';cx.textBaseline='top';cx.lineJoin='round';
  cx.strokeStyle='rgba(5,8,14,.85)';cx.lineWidth=6;cx.strokeText(String(STEPS-steps),W/2,66+st);
  cx.fillStyle='#eef2f8';cx.fillText(String(STEPS-steps),W/2,66+st);
}
// safe-area を JS で読む
document.documentElement.style.setProperty('--sat','env(safe-area-inset-top,0px)');
const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden';
document.body.appendChild(probe);
function readSafe(){const r=getComputedStyle(probe);document.documentElement.style.setProperty('--sat',parseFloat(r.height)||0);document.documentElement.style.setProperty('--sab',parseFloat(r.paddingBottom)||0);}
readSafe();addEventListener('resize',readSafe);

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.load)document.fonts.load('20px "Dela Gothic One"','左右ピタッ0123456789/').catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
