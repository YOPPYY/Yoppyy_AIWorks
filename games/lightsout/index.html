<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ライツアウト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 夜の配電盤: 暗い藍の盤面に琥珀色のランプ。縦一画面、上に状態・中央に盤・下に操作 */
:root{
  color-scheme: dark;
  --bg:#12141d;
  --panel:#1b1e2b;
  --off:#262a3b;
  --off-edge:#323750;
  --lamp:#ffc857;
  --lamp-hot:#fff1c4;
  --glow:rgba(255,200,87,.55);
  --fg:#ece8f4;
  --muted:#868ba6;
  --hint:#7fd6ff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%, #1c2033 0%, var(--bg) 60%) var(--bg);
  color:var(--fg);font-family:var(--f-ui);
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 16px;box-sizing:border-box;max-width:560px;margin:0 auto;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.04em}
h1 span{color:var(--lamp);text-shadow:0 0 12px var(--glow)}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--off-edge);background:var(--panel);
  color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;
}
.icon-btn svg{width:22px;height:22px}
.head-btns{display:flex;gap:8px}
a.icon-btn{text-decoration:none;box-sizing:border-box}
.icon-btn:active{transform:scale(.94)}
.icon-btn:focus-visible,.chip:focus-visible,.cell:focus-visible,.primary:focus-visible{outline:2px solid var(--hint);outline-offset:2px}
.icon-btn[disabled]{opacity:.35;pointer-events:none}

.sizes{display:flex;gap:8px;justify-content:center}
.chip{
  font-family:var(--f-display);font-size:1rem;min-width:48px;height:38px;border-radius:12px;cursor:pointer;
  background:transparent;border:1px solid var(--off-edge);color:var(--muted);font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#2b1d00;box-shadow:0 0 16px var(--glow)}

.stats{display:flex;justify-content:center;gap:28px;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:8px}
.stat small{font-size:.72rem;color:var(--muted);letter-spacing:.12em}
.stat b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:left}

.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.board{
  display:grid;gap:var(--gap,8px);padding:var(--pad,12px);border-radius:22px;box-sizing:border-box;
  background:linear-gradient(180deg,#1f2335,#171a27);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 40px rgba(0,0,0,.45);
  touch-action:manipulation;
}
.cell{
  position:relative;border:none;padding:0;cursor:pointer;border-radius:22%;
  background:var(--off);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35), inset 0 0 0 1px var(--off-edge);
  transition:background .18s, box-shadow .18s, transform .12s;
}
.cell::after{ /* ランプの芯 */
  content:"";position:absolute;inset:28%;border-radius:50%;
  background:#2f3448;transition:background .18s, box-shadow .18s;
}
.cell.on{
  background:radial-gradient(circle at 50% 42%, #ffe29a 0%, var(--lamp) 55%, #e59a2b 100%);
  box-shadow:0 0 22px var(--glow), inset 0 -3px 0 rgba(120,60,0,.35);
}
.cell.on::after{background:var(--lamp-hot);box-shadow:0 0 14px #fff6d8}
.cell.pop{animation:pop .22s ease-out}
.cell.hint{animation:hintPulse 1s ease-in-out infinite}
.cell.hint::before{
  content:"";position:absolute;inset:-4px;border-radius:26%;border:3px solid var(--hint);
  box-shadow:0 0 14px var(--hint);pointer-events:none;
}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes hintPulse{50%{transform:scale(.94)}}
.cell.wave{animation:wave .7s ease-out both}
@keyframes wave{
  0%{background:var(--off)}
  35%{background:radial-gradient(circle at 50% 42%, #fff 0%, #ffe29a 50%, var(--lamp) 100%);box-shadow:0 0 30px var(--glow)}
  100%{background:var(--off)}
}

.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.controls .icon-btn{width:100%;height:56px;border-radius:16px}
.controls .icon-btn svg{width:26px;height:26px}

.overlay{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(10,11,18,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .3s ease-out;
}
@keyframes fade{from{opacity:0}}
.result{
  background:var(--panel);border:1px solid var(--off-edge);border-radius:22px;padding:24px 28px;
  display:flex;flex-direction:column;align-items:center;gap:14px;min-width:220px;
  box-shadow:0 24px 50px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes rise{from{transform:translateY(16px) scale(.94);opacity:0}}
.result h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;margin:0;color:var(--lamp);text-shadow:0 0 18px var(--glow);letter-spacing:.06em}
.result p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.result p b{color:var(--fg);font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px;fill:var(--off-edge)}
.stars svg.lit{fill:var(--lamp);filter:drop-shadow(0 0 6px var(--glow))}
.primary{
  font-family:var(--f-ui);font-weight:700;font-size:1.05rem;border:none;border-radius:14px;cursor:pointer;
  background:var(--lamp);color:#2b1d00;padding:12px 32px;box-shadow:0 0 18px var(--glow);
}
.primary:active{transform:scale(.96)}

@media (prefers-reduced-motion: reduce){
  .cell,.cell::after{transition:none}
  .cell.pop,.cell.hint,.cell.wave,.overlay,.result{animation:none}
}
</style>

<div class="app">
  <header>
    <h1>ライツ<span>アウト</span></h1>
    <div class="head-btns">
      <a class="icon-btn" id="guide" href="../../guides/lightsout-guide/" target="_blank" rel="noopener" aria-label="攻略ページを開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14"/><path d="M9 8h7"/><path d="M9 12h5"/></svg>
      </a>
      <button class="icon-btn" id="mute" aria-label="サウンド切り替え"></button>
    </div>
  </header>

  <div class="sizes" id="sizes" role="group" aria-label="盤面サイズ"></div>

  <div class="stats">
    <div class="stat"><small>手数</small><b id="moves">0</b></div>
    <div class="stat"><small>最少</small><b id="par">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="result">
        <h2>消灯！</h2>
        <div class="stars" id="stars"></div>
        <p><b id="rMoves">0</b> 手 ／ 最少 <b id="rPar">0</b> 手</p>
        <button class="primary" id="next">つぎへ</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="undo" aria-label="一手戻す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon-btn" id="hint" aria-label="ヒント">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
    </button>
    <button class="icon-btn" id="reset" aria-label="最初からやり直す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="icon-btn" id="newgame" aria-label="新しい問題">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), stageEl = $('stage');
  const SIZES = [3,4,5,6,7];

  const store = {
    get(k,d){ try{ const v = localStorage.getItem('lo_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem('lo_'+k, JSON.stringify(v)); }catch(e){} }
  };

  let n = store.get('size', 5);
  if(!SIZES.includes(n)) n = 5;
  let muted = store.get('muted', false);
  let state, start, history, par, cells = [], hintIdx = -1, cleared = false, busy = false;

  /* ================= サウンド ================= */
  let ac = null, master = null;
  function audio(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = .6;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, {type='sine', vol=.25, delay=0, slide=0, attack=.005}={}){
    if(muted) return;
    const a = audio(); if(!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq*slide), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+.02);
  }
  function noise(dur, {vol=.15, delay=0, from=800, to=4000, q=1}={}){
    if(muted) return;
    const a = audio(); if(!a) return;
    const t = a.currentTime + delay;
    const len = Math.ceil(a.sampleRate*dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type='bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t+dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+dur*.3); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur);
  }
  // ペンタトニック: マスの位置ごとに音程が変わる
  const PENTA = [0,2,4,7,9];
  const noteOf = (i) => {
    const r = (i/n|0), c = i%n, k = r + c;
    const semi = PENTA[k%5] + 12*Math.floor(k/5);
    return 330 * Math.pow(2, semi/12);
  };
  const sfx = {
    press(i, litAfter){
      const f = noteOf(i);
      tone(f, .22, {type:'triangle', vol:.28});
      tone(f*2, .12, {type:'sine', vol:.08});
      noise(.04, {vol:.08, from:3000, to:5000, q:.7});
      if(litAfter) tone(f*1.5, .18, {type:'sine', vol:.06, delay:.04});
    },
    undo(){ tone(520,.14,{type:'triangle',vol:.2,slide:.6}); },
    hint(){ tone(1046,.35,{vol:.16}); tone(1568,.45,{vol:.12,delay:.1}); },
    reset(){ noise(.25,{vol:.12,from:2500,to:400}); tone(392,.18,{type:'triangle',vol:.15,slide:.7}); },
    shuffle(){ noise(.35,{vol:.14,from:300,to:3500,q:1.5}); [0,1,2,3].forEach(k=>tone(440+k*110,.08,{type:'square',vol:.04,delay:.05+k*.05})); },
    tick(){ tone(880,.05,{type:'square',vol:.05}); },
    clear(perfect){
      const seq = [523.25,659.25,783.99,1046.5];
      seq.forEach((f,k)=>{ tone(f,.35,{type:'triangle',vol:.22,delay:k*.1}); tone(f/2,.3,{type:'sine',vol:.1,delay:k*.1}); });
      tone(1318.5,.9,{vol:.16,delay:.45}); tone(1046.5,.9,{vol:.12,delay:.45}); tone(783.99,.9,{vol:.1,delay:.45});
      noise(.8,{vol:.05,delay:.45,from:6000,to:9000,q:2});
      if(perfect){ [1568,1760,2093].forEach((f,k)=>tone(f,.25,{vol:.08,delay:.95+k*.08})); }
    }
  };
  const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

  /* ================= ロジック ================= */
  const neighbors = i => {
    const r = i/n|0, c = i%n, out = [i];
    if(r>0) out.push(i-n); if(r<n-1) out.push(i+n);
    if(c>0) out.push(i-1); if(c<n-1) out.push(i+1);
    return out;
  };
  const applyPress = (s, i) => { for(const j of neighbors(i)) s[j] ^= 1; };

  // GF(2)ガウス消去で最少手数の解を求める
  function solve(s){
    const N = n*n, M = [];
    for(let i=0;i<N;i++){
      const row = new Uint8Array(N+1);
      for(const j of neighbors(i)) row[j] = 1;
      row[N] = s[i]; M.push(row);
    }
    const piv = []; let r = 0;
    for(let c=0;c<N && r<N;c++){
      let p = -1;
      for(let k=r;k<N;k++) if(M[k][c]){ p=k; break; }
      if(p<0) continue;
      [M[r],M[p]] = [M[p],M[r]];
      for(let k=0;k<N;k++) if(k!==r && M[k][c]){ const a=M[k], b=M[r]; for(let x=c;x<=N;x++) a[x]^=b[x]; }
      piv.push(c); r++;
    }
    for(let k=r;k<N;k++) if(M[k][N]) return null;
    const isPiv = new Uint8Array(N); piv.forEach(c=>isPiv[c]=1);
    const free = []; for(let c=0;c<N;c++) if(!isPiv[c]) free.push(c);
    const base = new Uint8Array(N); piv.forEach((c,k)=>base[c]=M[k][N]);
    const basis = free.map(f=>{
      const v = new Uint8Array(N); v[f]=1; piv.forEach((c,k)=>v[c]=M[k][f]); return v;
    });
    let best = base, bestW = base.reduce((a,b)=>a+b,0);
    const combos = 1 << Math.min(free.length, 14);
    for(let m=1;m<combos;m++){
      const x = base.slice();
      for(let b=0;b<basis.length;b++) if(m>>b & 1){ const v=basis[b]; for(let t=0;t<N;t++) x[t]^=v[t]; }
      const w = x.reduce((a,b)=>a+b,0);
      if(w<bestW){ best=x; bestW=w; }
    }
    return best;
  }
  const weight = x => x.reduce((a,b)=>a+b,0);

  function generate(){
    const N = n*n, minPar = n===3 ? 3 : n+1;
    for(let tries=0; tries<200; tries++){
      const s = new Uint8Array(N);
      for(let i=0;i<N;i++) if(Math.random()<.5) applyPress(s,i);
      if(!s.some(v=>v)) continue;
      const sol = solve(s);
      if(sol && weight(sol) >= minPar) return s;
    }
    const s = new Uint8Array(N); applyPress(s, (N/2)|0); return s;
  }

  /* ================= 表示 ================= */
  function buildSizes(){
    const box = $('sizes'); box.innerHTML = '';
    SIZES.forEach(sz=>{
      const b = document.createElement('button');
      b.className = 'chip'; b.id = 'size'+sz; b.textContent = sz;
      b.setAttribute('aria-label', sz+'×'+sz);
      b.setAttribute('aria-pressed', sz===n);
      b.onclick = () => { if(sz===n) return; sfx.tick(); n = sz; store.set('size', n); buildSizes(); newGame(); };
      box.appendChild(b);
    });
  }

  function buildBoard(){
    boardEl.innerHTML = ''; cells = [];
    boardEl.style.gridTemplateColumns = `repeat(${n},1fr)`;
    const gap = n>=7 ? 5 : n>=6 ? 6 : 8;
    boardEl.style.setProperty('--gap', gap+'px');
    for(let i=0;i<n*n;i++){
      const b = document.createElement('button');
      b.className = 'cell'; b.id = 'c'+i;
      b.setAttribute('aria-label', `${(i/n|0)+1}行${i%n+1}列`);
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(i); });
      b.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); press(i); } });
      boardEl.appendChild(b); cells.push(b);
    }
    fit();
  }

  function fit(){
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    const size = Math.max(160, Math.min(w, h));
    boardEl.style.width = boardEl.style.height = size+'px';
  }

  function render(){
    cells.forEach((c,i)=>{
      c.classList.toggle('on', !!state[i]);
      c.setAttribute('aria-pressed', !!state[i]);
      c.classList.toggle('hint', i===hintIdx);
    });
    $('moves').textContent = history.length;
    $('par').textContent = par;
    $('undo').disabled = !history.length || cleared;
    $('hint').disabled = cleared;
  }

  function pop(i){
    for(const j of neighbors(i)){
      const c = cells[j]; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    }
  }

  /* ================= 操作 ================= */
  function press(i){
    if(cleared || busy) return;
    applyPress(state, i);
    history.push(i);
    if(hintIdx === i) hintIdx = -1; else if(hintIdx>=0) hintIdx = -1;
    sfx.press(i, !!state[i]); buzz(8);
    pop(i); render();
    if(!state.some(v=>v)) win();
  }

  function win(){
    cleared = true; busy = true;
    const moves = history.length, perfect = moves <= par;
    const starCount = perfect ? 3 : moves <= par + Math.max(2, Math.ceil(par*.5)) ? 2 : 1;
    sfx.clear(perfect); buzz([20,40,20]);
    // 対角に光が走る演出
    cells.forEach((c,i)=>{
      const d = (i/n|0) + i%n;
      c.style.animationDelay = (d*55)+'ms';
      c.classList.remove('pop'); c.classList.add('wave');
    });
    const total = (2*n-2)*55 + 700;
    setTimeout(()=>{
      cells.forEach(c=>{ c.classList.remove('wave'); c.style.animationDelay=''; });
      $('rMoves').textContent = moves; $('rPar').textContent = par;
      const st = $('stars'); st.innerHTML = '';
      for(let k=0;k<3;k++){
        st.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24" class="${k<starCount?'lit':''}"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`);
      }
      $('overlay').hidden = false; busy = false;
      $('next').focus({preventScroll:true});
    }, total);
    render();
  }

  function newGame(){
    state = generate(); start = state.slice(); history = []; hintIdx = -1; cleared = false;
    par = weight(solve(state));
    $('overlay').hidden = true;
    buildBoard(); render();
  }

  $('undo').onclick = () => {
    if(!history.length || cleared) return;
    const i = history.pop(); applyPress(state, i); hintIdx = -1;
    sfx.undo(); pop(i); render();
  };
  $('hint').onclick = () => {
    if(cleared) return;
    const sol = solve(state); if(!sol) return;
    // 現在の状態から最短で消すためのマスを一つ示す
    let idx = -1;
    for(let i=0;i<sol.length;i++) if(sol[i]){ idx = i; break; }
    hintIdx = idx; sfx.hint(); render();
  };
  $('reset').onclick = () => {
    if(busy) return;
    state = start.slice(); history = []; hintIdx = -1; cleared = false;
    $('overlay').hidden = true; sfx.reset(); render();
  };
  $('newgame').onclick = () => { if(busy) return; sfx.shuffle(); newGame(); };
  $('next').onclick = () => { sfx.shuffle(); newGame(); };

  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
  const drawMute = () => { $('mute').innerHTML = muted ? ICON_OFF : ICON_ON; $('mute').setAttribute('aria-pressed', muted); };
  $('mute').onclick = () => { muted = !muted; store.set('muted', muted); drawMute(); if(!muted) sfx.tick(); };

  addEventListener('resize', fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(stageEl);

  drawMute(); buildSizes(); newGame();
})();
</script>
