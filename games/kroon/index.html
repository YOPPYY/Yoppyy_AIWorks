<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3段クルーン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 縦画面1枚: 上にHUD、中央に円形の台(canvas)、下に発射ゲージ。パーラーの電飾と真鍮の台をイメージ */
:root{
  --bg0:#120d27; --bg1:#2b1650; --ink:#f6efe0; --dim:#b9a9d6;
  --brass:#e5a93c; --brass-d:#8d5d17; --win:#ffd54a; --miss:#e8435d; --teal:#3bd1c6;
  --line:#4a3380; --panel:#1d1238; --navy:#2a1448;
  --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(130% 80% at 50% 28%,var(--bg1) 0%,var(--bg0) 70%);
  color:var(--ink);font-family:var(--f-body);font-weight:500;
  padding-inline:16px;overflow:hidden;touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding-block:8px;box-sizing:border-box}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.balls{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.balls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aeb8cc 55%,#667090);box-shadow:0 2px 0 #0006}
.score{font-family:var(--f-disp);font-size:30px;text-align:center;font-variant-numeric:tabular-nums;color:var(--win);text-shadow:0 2px 0 #0008}
.pbtn{justify-self:end;width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);background:var(--panel);color:var(--brass);display:grid;place-items:center;padding:0;cursor:pointer}
.pbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#chips{display:flex;justify-content:center;gap:10px}
.chip{font-family:var(--f-disp);font-size:20px;min-width:66px;text-align:center;padding:6px 10px;border-radius:10px;border:2px solid var(--line);color:var(--dim);background:var(--panel);transition:box-shadow .2s,background .2s}
.chip.now{border-color:var(--win);color:var(--ink);box-shadow:0 0 16px #ffd54a66}
.chip.done{background:var(--brass);border-color:var(--brass);color:var(--navy)}
#field{position:relative;min-height:0}
#cv{position:absolute;inset:0;display:block}
#banner{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.5);font-family:var(--f-disp);font-size:clamp(38px,13vw,66px);white-space:nowrap;text-align:center;opacity:0;pointer-events:none;text-shadow:0 3px 0 #000a,0 0 26px currentColor;line-height:1.1}
#banner small{display:block;font-family:var(--f-body);font-weight:700;font-size:.3em;margin-top:6px;letter-spacing:.04em;text-shadow:0 2px 0 #000a}
#banner.win{color:var(--win)} #banner.miss{color:var(--miss)} #banner.jp{color:#fff}
#banner.show{animation:pop var(--ms,1s) ease-out forwards}
.paused #banner{animation-play-state:paused}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}}
#foot{display:grid;gap:8px;justify-items:center;padding-bottom:6px}
#gauge{position:relative;width:min(100%,360px);height:16px;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--win) 55%,var(--miss));box-shadow:inset 0 0 0 2px #0006;transition:opacity .2s}
#foot:not([data-mode="ready"]) #gauge{opacity:.22}
#needle{position:absolute;top:-6px;left:0;width:6px;height:28px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px var(--panel)}
#hint{margin:0;font-size:13px;color:var(--dim);min-height:1.3em}
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:rgba(14,9,32,.86);backdrop-filter:blur(4px)}
.card{display:grid;gap:16px;justify-items:center;text-align:center;max-width:320px}
.card h1{margin:0;font-family:var(--f-disp);font-size:clamp(44px,15vw,64px);line-height:1.05;color:var(--win);text-shadow:0 4px 0 var(--brass-d),0 0 30px #ffd54a55}
.card h2{margin:0;font-family:var(--f-disp);font-size:34px;color:var(--ink)}
.card p{margin:0;color:var(--dim);font-size:15px}
.big{font-family:var(--f-disp);font-size:46px;color:var(--win);font-variant-numeric:tabular-nums}
.btn{font-family:var(--f-disp);font-size:22px;padding:14px 36px;border-radius:14px;border:0;cursor:pointer;background:linear-gradient(var(--win),var(--brass));color:var(--navy);box-shadow:0 4px 0 var(--brass-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brass-d)}
.btn.sub{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none;font-size:16px;padding:10px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tog[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){#banner.show{animation-duration:.01s}}
</style>

<div id="app">
  <div id="hud">
    <div class="balls"><i></i><span id="ballN">8</span></div>
    <div class="score" id="score">0</div>
    <button class="pbtn" id="pbtn" aria-label="ポーズ"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div id="chips"><span class="chip">3/6</span><span class="chip">2/6</span><span class="chip">1/6</span></div>
  <div id="field"><canvas id="cv"></canvas><div id="banner"></div></div>
  <div id="foot" data-mode="title">
    <div id="gauge"><i id="needle"></i></div>
    <p id="hint"></p>
  </div>
</div>

<div class="ov" id="title"><div class="card">
  <h1>3段<br>クルーン</h1>
  <div class="row"><span class="chip now">3/6</span><span class="chip">2/6</span><span class="chip">1/6</span></div>
  <p>3つの台をぬけて大当たりへ</p>
  <button class="btn" id="startBtn">スタート</button>
</div></div>

<div class="ov" id="pause" hidden><div class="card">
  <h2>ポーズ</h2>
  <p id="bestP">ハイスコア 0</p>
  <button class="btn" id="resumeBtn">つづける</button>
  <div class="row">
    <button class="btn sub tog" id="tBgm" aria-pressed="true">BGM</button>
    <button class="btn sub tog" id="tSe" aria-pressed="true">効果音</button>
  </div>
  <button class="btn sub" id="restartBtn">さいしょから</button>
</div></div>

<div class="ov" id="over" hidden><div class="card">
  <h2>ゲームオーバー</h2>
  <div class="big" id="overScore">0</div>
  <p id="newBest">ハイスコア更新!</p>
  <p id="bestO">ハイスコア 0</p>
  <button class="btn" id="retryBtn">もういちど</button>
</div></div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');

//#PHYS-START
const R = 100, RT = 52, HUB = 27, BR = 4.4;
const K = 30, GAMMA = 0.35, CDEC = 14;
const PIN_N = 8, PIN_R = 74, PIN_RAD = 2.7;
const VSKIP = 175, VLOW = 70, VCAP = 112, KH = 70, DH = 6;
const STAGES = [
  { rh: 12.5, w: 0.9,  win: [0, 2, 4] },
  { rh: 11,   w: -1.25, win: [1, 4] },
  { rh: 9.5,  w: 1.7,  win: [3] }
];
const hooks = { pin(v){}, wall(v){}, hole(i){} };
function makeSim(){ return { x:0, y:R-7, vx:0, vy:0, th:0, w:0, rh:12, inh:[false,false,false,false,false,false] }; }
function step(s, dt){
  s.th += s.w * dt;
  let x = s.x, y = s.y, vx = s.vx, vy = s.vy;
  let r = Math.hypot(x, y); if (r < 1e-6) r = 1e-6;
  let nx = x / r, ny = y / r;
  const a = -K * (r - RT);
  vx += nx * a * dt; vy += ny * a * dt;
  let sp = Math.hypot(vx, vy);
  if (sp > 0){
    let ns = sp * Math.exp(-GAMMA * dt) - CDEC * dt; if (ns < 0) ns = 0;
    const k = ns / sp; vx *= k; vy *= k; sp = ns;
  }
  if (sp < 14){ vx += (Math.random() - .5) * 60 * dt; vy += (Math.random() - .5) * 60 * dt; }
  x += vx * dt; y += vy * dt;
  r = Math.hypot(x, y); if (r < 1e-6) r = 1e-6; nx = x / r; ny = y / r;
  if (r > R - BR){
    x = nx * (R - BR); y = ny * (R - BR);
    const vn = vx * nx + vy * ny;
    if (vn > 0){ vx -= 1.55 * vn * nx; vy -= 1.55 * vn * ny; if (vn > 40) hooks.wall(vn); }
  } else if (r < HUB + BR){
    x = nx * (HUB + BR); y = ny * (HUB + BR);
    const vn = vx * nx + vy * ny;
    if (vn < 0){ vx -= 1.5 * vn * nx; vy -= 1.5 * vn * ny; }
  }
  const w = s.w;
  for (let i = 0; i < PIN_N; i++){
    const pa = i * TAU / PIN_N + 0.2 + s.th;
    const px = Math.cos(pa) * PIN_R, py = Math.sin(pa) * PIN_R;
    const dx = x - px, dy = y - py, d = Math.hypot(dx, dy), md = PIN_RAD + BR;
    if (d < md && d > 1e-6){
      const ux = dx / d, uy = dy / d;
      const pvx = -w * py, pvy = w * px;
      const rv = (vx - pvx) * ux + (vy - pvy) * uy;
      x = px + ux * md; y = py + uy * md;
      if (rv < 0){ vx -= 1.7 * rv * ux; vy -= 1.7 * rv * uy; if (-rv > 30) hooks.pin(-rv); }
    }
  }
  let cap = -1;
  for (let i = 0; i < 6; i++){
    const ha = i * TAU / 6 + s.th;
    const hx = RT * Math.cos(ha), hy = RT * Math.sin(ha);
    const dx = hx - x, dy = hy - y, d = Math.hypot(dx, dy);
    if (d < s.rh){
      if (!s.inh[i]){ s.inh[i] = true; hooks.hole(i); }
      const hvx = -w * hy, hvy = w * hx;
      const rel = Math.hypot(vx - hvx, vy - hvy);
      const f = Math.min(1, Math.max(0, (VSKIP - rel) / (VSKIP - VLOW)));
      vx += dx * KH * f * dt; vy += dy * KH * f * dt;
      const dd = Math.min(1, DH * f * dt);
      vx += (hvx - vx) * dd; vy += (hvy - vy) * dd;
      if (cap < 0 && d < s.rh * 0.5 && rel < VCAP) cap = i;
    } else if (d > s.rh * 1.3) s.inh[i] = false;
  }
  s.x = x; s.y = y; s.vx = vx; s.vy = vy;
  return cap;
}
//#PHYS-END

// ---------- 設定・保存 ----------
const PTS = [100, 400, 3000];
const SET = { bgm: true, se: true };
try { Object.assign(SET, JSON.parse(localStorage.getItem('kuruun3.set') || '{}')); } catch (e) {}
function saveSet(){ try { localStorage.setItem('kuruun3.set', JSON.stringify(SET)); } catch (e) {} }

const st = { mode:'title', balls:8, score:0, stage:0, cleared:0, best:0, t:0, anim:1, winSet:[], rollT:0, dropT:0, cap:-1, win:false, nextT:0, after:null, flash:0 };
try { st.best = +localStorage.getItem('kuruun3.best') || 0; } catch (e) {}
const sim = makeSim();
let trail = [], gaugeT = 0, paused = false, ff = false;
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0;

// ---------- オーディオ ----------
let AC = null, master, sfxG, bgmG, rollG, rollF, noiseBuf;
function initAudio(){
  if (AC){ if (AC.state === 'suspended' && !paused) AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AC = new C();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  sfxG = AC.createGain(); sfxG.gain.value = SET.se ? 1 : 0; sfxG.connect(master);
  bgmG = AC.createGain(); bgmG.gain.value = .5; bgmG.connect(master);
  const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
  rollF = AC.createBiquadFilter(); rollF.type = 'bandpass'; rollF.frequency.value = 400; rollF.Q.value = 1.2;
  rollG = AC.createGain(); rollG.gain.value = 0;
  ns.connect(rollF); rollF.connect(rollG); rollG.connect(sfxG); ns.start();
}
function osc(dest, f, d, type, v, t, f2){
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(v, t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(gn); gn.connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function noise(dest, d, v, t, ftype, f1, f2){
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f1, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const gn = AC.createGain(); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(gn); gn.connect(dest); s.start(t, Math.random() * .5); s.stop(t + d + 0.02);
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const SE = {
  launch(){ const t = AC.currentTime; noise(sfxG, .35, .4, t, 'bandpass', 300, 2600); osc(sfxG, 150, .2, 'sine', .55, t, 60); },
  pin(v){ const t = AC.currentTime, a = Math.min(1, v / 220); osc(sfxG, 1800 + Math.random() * 900, .06, 'triangle', .05 + .16 * a, t); },
  wall(v){ const t = AC.currentTime, a = Math.min(1, v / 260); osc(sfxG, 520, .09, 'triangle', .06 + .14 * a, t, 380); },
  tick(){ const t = AC.currentTime; osc(sfxG, 950, .05, 'square', .035, t); },
  drop(){ const t = AC.currentTime; osc(sfxG, 200, .24, 'sine', .65, t, 66); noise(sfxG, .12, .25, t, 'lowpass', 900); osc(sfxG, 1500, .04, 'square', .05, t + .15); osc(sfxG, 1200, .04, 'square', .04, t + .26); },
  win(i){ const t = AC.currentTime, b = i === 0 ? 72 : 79; [0, 4, 7, 12].forEach((d, k) => osc(sfxG, mf(b + d), .22, 'triangle', .3, t + k * .08)); osc(sfxG, mf(b + 24), .4, 'sine', .12, t + .34); },
  miss(){ const t = AC.currentTime; osc(sfxG, 196, .5, 'sawtooth', .16, t, 98); osc(sfxG, 147, .55, 'sawtooth', .14, t + .22, 70); },
  jackpot(){ const t = AC.currentTime; for (let k = 0; k < 16; k++) osc(sfxG, mf(60 + [0,4,7,12][k % 4] + 12 * Math.floor(k / 4)), .3, 'triangle', .26, t + k * .07);
    [0,4,7,12,16].forEach(d => osc(sfxG, mf(72 + d), 1.4, 'sine', .14, t + 1.15)); noise(sfxG, 1.2, .25, t + 1.1, 'highpass', 4000, 9000); },
  bonus(){ const t = AC.currentTime; osc(sfxG, mf(84), .25, 'sine', .2, t + .42); osc(sfxG, mf(91), .35, 'sine', .2, t + .52); },
  over(){ const t = AC.currentTime; [72, 67, 64, 60].forEach((m, k) => osc(sfxG, mf(m), .4, 'triangle', .28, t + k * .22)); },
  ui(){ const t = AC.currentTime; osc(sfxG, 880, .1, 'triangle', .25, t); osc(sfxG, 1320, .14, 'triangle', .2, t + .07); }
};
function se(name, a){ if (!AC || !SET.se || paused) return; try { SE[name](a); } catch (e) {} }
let lastPin = 0, lastWall = 0;
hooks.pin = v => { const n = performance.now(); if (n - lastPin > 35){ lastPin = n; se('pin', v); } };
hooks.wall = v => { const n = performance.now(); if (n - lastWall > 60){ lastWall = n; se('wall', v); } };
hooks.hole = () => se('tick');

// BGM: 108BPM, 4小節ループ(約8.9秒)。段が進むと音が増える
const CH = [{b:45,t:[57,60,64,69]},{b:41,t:[53,57,60,65]},{b:48,t:[60,64,67,72]},{b:43,t:[55,59,62,67]}];
const ARP = [0,2,1,3,2,3,1,2,0,2,1,3,2,3,1,3];
const SIXT = 60 / 108 / 4;
let bgmTimer = null, bgmNext = 0, bgmStep = 0;
function bgmNote(step, t){
  const c = CH[step >> 4], s = step & 15, L = st.stage;
  if (s % 4 === 0) osc(bgmG, 130, .16, 'sine', .55, t, 45);
  if (s === 2 || s === 6 || s === 10 || s === 14) noise(bgmG, .05, .1, t, 'highpass', 7000);
  if (s === 0 || s === 3 || s === 6 || s === 8 || s === 11 || s === 14) osc(bgmG, mf(c.b), .24, 'triangle', .4, t);
  osc(bgmG, mf(c.t[ARP[s]]), .2, 'triangle', .2, t);
  if (L >= 1 && (s === 4 || s === 12)) osc(bgmG, mf(c.t[3] + 12), .5, 'sine', .12, t);
  if (L >= 2) osc(bgmG, mf(c.t[ARP[(s + 1) & 15]] + 12), .12, 'square', .035, t);
}
function bgmTick(){
  if (!AC) return;
  while (bgmNext < AC.currentTime + .15){ bgmNote(bgmStep, bgmNext); bgmNext += SIXT; bgmStep = (bgmStep + 1) % 64; }
}
function startBgm(){ if (!AC || !SET.bgm || bgmTimer) return; bgmNext = AC.currentTime + .06; bgmStep = 0; bgmTimer = setInterval(bgmTick, 30); }
function stopBgm(){ clearInterval(bgmTimer); bgmTimer = null; }
window.__bgm = () => { initAudio(); startBgm(); };

// ---------- ゲーム進行 ----------
const chips = [...document.querySelectorAll('#chips .chip')];
function hud(){ $('ballN').textContent = st.balls; $('score').textContent = st.score.toLocaleString('ja-JP'); }
function chipsUpdate(){
  chips.forEach((c, i) => { c.className = 'chip' + (i < st.cleared ? ' done' : (i === st.stage ? ' now' : '')); });
}
function setMode(m){
  st.mode = m; $('foot').dataset.mode = m;
  $('hint').textContent = m === 'ready' ? 'タップで発射' : m === 'roll' ? '長押しで早送り' : '';
}
function banner(main, kind, ms, sub){
  const b = $('banner'); b.className = ''; void b.offsetWidth; b.innerHTML = '';
  const m = document.createElement('div'); m.textContent = main; b.appendChild(m);
  if (sub){ const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.style.setProperty('--ms', ms + 'ms'); b.className = 'show ' + kind;
}
function enterStage(i){
  if (i === 0) st.cleared = 0;
  st.stage = i;
  const cfg = STAGES[i], off = Math.floor(Math.random() * 6);
  st.winSet = [0,0,0,0,0,0].map(() => false);
  cfg.win.forEach(k => { st.winSet[(k + off) % 6] = true; });
  sim.th = Math.random() * TAU; sim.w = cfg.w; sim.rh = cfg.rh;
  sim.x = 0; sim.y = R - 7; sim.vx = sim.vy = 0; sim.inh.fill(false);
  st.anim = 0; trail = []; gaugeT = 0; ff = false;
  chipsUpdate(); setMode('ready');
}
function startGame(){
  st.balls = 8; st.score = 0; st.dropT = 0; st.flash = 0; conf.length = 0;
  hud(); $('title').hidden = true; $('over').hidden = true; $('pause').hidden = true;
  paused = false; document.body.classList.remove('paused');
  if (AC && AC.state === 'suspended') AC.resume();
  stopBgm(); enterStage(0); startBgm();
}
function gaugeVal(){ const ph = (gaugeT / 1.15) % 1; return ph < .5 ? ph * 2 : 2 - ph * 2; }
function launch(){
  const v0 = 240 + 320 * gaugeVal();
  sim.x = 0; sim.y = R - 7; sim.vx = v0; sim.vy = (Math.random() - .5) * 24; sim.inh.fill(false);
  st.rollT = 0; trail = []; setMode('roll'); se('launch');
}
function capture(c){
  st.cap = c; st.dropT = 0; st.win = st.winSet[c]; setMode('drop'); se('drop');
}
function nearestHole(){
  let bi = 0, bd = 1e9;
  for (let i = 0; i < 6; i++){
    const a = i * TAU / 6 + sim.th, d = Math.hypot(RT * Math.cos(a) - sim.x, RT * Math.sin(a) - sim.y);
    if (d < bd){ bd = d; bi = i; }
  }
  return bi;
}
function resolve(){
  const s = st.stage;
  st.dropT = Math.max(st.dropT, 0.6);
  if (st.win){
    if (s < 2){
      st.score += PTS[s]; st.cleared = s + 1; chipsUpdate(); se('win', s);
      let sub = '+' + PTS[s];
      if (s === 1){ st.balls += 1; sub += '  ボール+1'; setTimeout(() => se('bonus'), 0); }
      hud(); banner('突破!', 'win', 1000, sub);
      setMode('next'); st.nextT = 1.15; st.after = () => enterStage(s + 1);
    } else {
      st.score += PTS[2]; st.balls += 3; st.cleared = 3; chipsUpdate(); hud();
      se('jackpot'); banner('大当たり!!', 'jp', 2600, '+' + PTS[2] + '  ボール+3');
      burst(); st.flash = 2.6;
      setMode('next'); st.nextT = 2.9; st.after = () => enterStage(0);
    }
  } else {
    st.balls -= 1; hud(); se('miss'); banner('ハズレ', 'miss', 1100);
    setMode('next'); st.nextT = 1.3;
    st.after = () => { if (st.balls <= 0) gameOver(); else enterStage(0); };
  }
}
function gameOver(){
  setMode('over'); stopBgm();
  const nb = st.score > st.best;
  if (nb){ st.best = st.score; try { localStorage.setItem('kuruun3.best', String(st.best)); } catch (e) {} }
  $('overScore').textContent = st.score.toLocaleString('ja-JP');
  $('newBest').hidden = !nb;
  $('bestO').textContent = 'ハイスコア ' + st.best.toLocaleString('ja-JP');
  $('over').hidden = false; se('over');
}

// ---------- 紙吹雪 ----------
const conf = [];
function burst(){
  const cols = ['#ffd54a', '#e8435d', '#3bd1c6', '#fff6c8', '#b48cff'];
  for (let i = 0; i < 140; i++) conf.push({ x: W / 2, y: H * .45, vx: (Math.random() - .5) * 620, vy: -200 - Math.random() * 520, r: Math.random() * TAU, vr: (Math.random() - .5) * 14, c: cols[i % 5], s: 5 + Math.random() * 6, l: 2.8 + Math.random() * 1.2 });
}

// ---------- 更新 ----------
function update(dt){
  st.t += dt;
  if (st.anim < 1) st.anim = Math.min(1, st.anim + dt / .45);
  if (st.flash > 0) st.flash -= dt;
  const cfg = STAGES[st.stage];
  const m = st.mode;
  if (m === 'roll'){
    const rd = dt * (ff ? 3 : 1);
    const n = Math.max(1, Math.ceil(rd / .004)), h = rd / n;
    let cap = -1;
    for (let i = 0; i < n; i++){ cap = step(sim, h); if (cap >= 0) break; }
    st.rollT += rd;
    trail.push({ x: sim.x, y: sim.y }); if (trail.length > 16) trail.shift();
    if (cap < 0 && st.rollT > 40) cap = nearestHole();
    if (cap >= 0) capture(cap);
  } else {
    sim.th += cfg.w * dt;
    if (m === 'ready') gaugeT += dt;
    else if (m === 'drop' || m === 'next'){
      st.dropT += dt;
      if (m === 'drop'){
        const a = st.cap * TAU / 6 + sim.th, hx = RT * Math.cos(a), hy = RT * Math.sin(a);
        const k = Math.min(1, dt * 14); sim.x += (hx - sim.x) * k; sim.y += (hy - sim.y) * k;
        if (st.dropT >= .6) resolve();
      } else { st.nextT -= dt; if (st.nextT <= 0 && st.after){ const f = st.after; st.after = null; f(); } }
    }
  }
  if (m === 'ready') $('needle').style.left = (gaugeVal() * 100) + '%';
  if (AC && rollG){
    const sp = st.mode === 'roll' ? Math.hypot(sim.vx, sim.vy) : 0;
    rollG.gain.setTargetAtTime(Math.min(1, sp / 380) * .22, AC.currentTime, .05);
    rollF.frequency.setTargetAtTime(250 + sp * 3.2, AC.currentTime, .05);
  }
  for (let i = conf.length - 1; i >= 0; i--){
    const p = conf[i]; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.l -= dt;
    if (p.l < 0) conf.splice(i, 1);
  }
}

// ---------- 描画 ----------
function ball(x, y, rad){
  g.fillStyle = 'rgba(0,0,0,.30)'; g.beginPath(); g.ellipse(x + 1.6, y + 2.2, rad, rad * .9, 0, 0, TAU); g.fill();
  const bg = g.createRadialGradient(x - rad * .35, y - rad * .4, rad * .15, x, y, rad);
  bg.addColorStop(0, '#fff'); bg.addColorStop(.45, '#dfe5f0'); bg.addColorStop(1, '#6e7894');
  g.fillStyle = bg; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
}
function draw(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const k = 1 - Math.pow(1 - st.anim, 3), sc = S * (.72 + .28 * k);
  const cfg = STAGES[st.stage];
  g.save(); g.translate(CX, CY); g.scale(sc, sc); g.globalAlpha = .2 + .8 * k;
  // 外枠と電飾
  let gr = g.createRadialGradient(0, -30, 60, 0, 0, 116);
  gr.addColorStop(0, '#f6d68a'); gr.addColorStop(.6, '#c9902f'); gr.addColorStop(1, '#6b440d');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 114, 0, TAU); g.fill();
  const ph = Math.floor(st.t * 9), fl = st.flash > 0;
  for (let i = 0; i < 28; i++){
    const a = i / 28 * TAU, lit = fl ? (Math.floor(st.t * 12) % 2 === 0) : ((i + ph) % 4 === 0);
    g.fillStyle = lit ? '#fff6c8' : '#7a4d12';
    if (lit){ g.shadowColor = '#ffd54a'; g.shadowBlur = 8; }
    g.beginPath(); g.arc(Math.cos(a) * 107.5, Math.sin(a) * 107.5, 2.6, 0, TAU); g.fill(); g.shadowBlur = 0;
  }
  g.fillStyle = '#2a1a06'; g.beginPath(); g.arc(0, 0, 102, 0, TAU); g.fill();
  // 床
  gr = g.createRadialGradient(0, 0, 10, 0, 0, 100);
  gr.addColorStop(0, '#9fabc6'); gr.addColorStop(.28, '#c3cde0'); gr.addColorStop(.5, '#a9b6d0');
  gr.addColorStop(.62, '#cbd5e7'); gr.addColorStop(.8, '#e7edf7'); gr.addColorStop(1, '#8f9cb8');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 100, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(44,52,96,.30)'; g.lineWidth = 22; g.beginPath(); g.arc(0, 0, RT, 0, TAU); g.stroke();
  // 回転する層
  g.save(); g.rotate(sim.th);
  const NW = 36, dA = TAU / NW;
  g.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 0; i < NW; i += 2){ g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 100, i * dA, (i + 1) * dA); g.closePath(); g.fill(); }
  for (let i = 0; i < PIN_N; i++){
    const a = i * TAU / PIN_N + .2, px = Math.cos(a) * PIN_R, py = Math.sin(a) * PIN_R;
    const pg = g.createRadialGradient(px - 1, py - 1, .3, px, py, PIN_RAD + .6);
    pg.addColorStop(0, '#fff3c4'); pg.addColorStop(1, '#a8741c');
    g.fillStyle = pg; g.beginPath(); g.arc(px, py, PIN_RAD, 0, TAU); g.fill();
  }
  for (let i = 0; i < 6; i++){
    const a = i * TAU / 6, hx = RT * Math.cos(a), hy = RT * Math.sin(a), rh = cfg.rh, win = st.winSet[i];
    const wg = g.createRadialGradient(hx, hy, 1, hx, hy, rh);
    wg.addColorStop(0, '#05030c'); wg.addColorStop(.7, win ? '#3a2a05' : '#12081a'); wg.addColorStop(1, win ? '#7a5a10' : '#2a1030');
    g.fillStyle = wg; g.beginPath(); g.arc(hx, hy, rh, 0, TAU); g.fill();
    if (win){
      g.strokeStyle = '#ffd54a'; g.lineWidth = 2.4; g.shadowColor = '#ffd54a'; g.shadowBlur = 8 + 5 * Math.sin(st.t * 6);
      g.beginPath(); g.arc(hx, hy, rh, 0, TAU); g.stroke(); g.shadowBlur = 0;
    } else {
      g.strokeStyle = '#e8435d'; g.lineWidth = 1.8; g.setLineDash([3.2, 2.6]);
      g.beginPath(); g.arc(hx, hy, rh, 0, TAU); g.stroke(); g.setLineDash([]);
    }
    if ((st.mode === 'drop' || st.mode === 'next') && i === st.cap){
      const t = st.dropT, al = Math.max(0, 1 - t / 1.2);
      g.globalAlpha = (.2 + .8 * k) * al; g.strokeStyle = st.win ? '#ffd54a' : '#e8435d'; g.lineWidth = 2;
      g.beginPath(); g.arc(hx, hy, rh * (1 + t * 1.4), 0, TAU); g.stroke(); g.globalAlpha = .2 + .8 * k;
    }
  }
  g.restore();
  // 中央ハブ
  const hg = g.createRadialGradient(-6, -8, 2, 0, 0, HUB);
  hg.addColorStop(0, '#fbe6a6'); hg.addColorStop(.7, '#c9902f'); hg.addColorStop(1, '#7a4d12');
  g.fillStyle = hg; g.beginPath(); g.arc(0, 0, HUB, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(42,20,72,.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, HUB - 4, 0, TAU); g.stroke();
  g.fillStyle = '#2a1448'; g.font = '15px "Dela Gothic One", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(cfg.win.length + '/6', 0, 1);
  // 発射口
  g.fillStyle = '#e5a93c'; g.fillRect(-3.5, 98, 7, 8);
  // ボール
  if (st.mode === 'ready') ball(0, R - 7 + Math.sin(st.t * 5) * .6, BR);
  else if (st.mode === 'roll'){
    for (let i = 0; i < trail.length; i++){
      const f = i / trail.length; g.fillStyle = 'rgba(255,255,255,' + (f * .28).toFixed(3) + ')';
      g.beginPath(); g.arc(trail[i].x, trail[i].y, BR * (.35 + .5 * f), 0, TAU); g.fill();
    }
    ball(sim.x, sim.y, BR);
  } else if (st.mode === 'drop') ball(sim.x, sim.y, BR * (1 - .75 * Math.min(1, st.dropT / .6)));
  g.restore();
  for (const p of conf){
    g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.min(1, p.l);
    g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6); g.restore();
  }
}

// ---------- 入力・ポーズ ----------
function setPause(p){
  if (st.mode === 'title' || st.mode === 'over') return;
  paused = p; $('pause').hidden = !p; document.body.classList.toggle('paused', p); ff = false;
  $('bestP').textContent = 'ハイスコア ' + st.best.toLocaleString('ja-JP');
  if (AC){ if (p) AC.suspend(); else AC.resume(); }
}
function press(){
  if (paused) return;
  if (st.mode === 'ready' && st.anim >= 1) launch();
  else if (st.mode === 'roll') ff = true;
}
['field', 'foot'].forEach(id => $(id).addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); press(); }));
['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, () => { ff = false; }));
$('pbtn').addEventListener('click', () => setPause(!paused));
$('resumeBtn').addEventListener('click', () => setPause(false));
$('startBtn').addEventListener('click', () => { initAudio(); se('ui'); startGame(); });
$('retryBtn').addEventListener('click', () => { initAudio(); startGame(); });
$('restartBtn').addEventListener('click', () => { startGame(); });
function syncToggles(){
  $('tBgm').setAttribute('aria-pressed', SET.bgm); $('tSe').setAttribute('aria-pressed', SET.se);
}
$('tBgm').addEventListener('click', () => { SET.bgm = !SET.bgm; saveSet(); syncToggles(); if (SET.bgm) startBgm(); else stopBgm(); });
$('tSe').addEventListener('click', () => { SET.se = !SET.se; saveSet(); syncToggles(); if (sfxG) sfxG.gain.value = SET.se ? 1 : 0; });
syncToggles();
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape'){ setPause(!paused); }
  else if (e.code === 'Space' && !document.activeElement.matches('button')){ e.preventDefault(); initAudio(); press(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') ff = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
window.addEventListener('blur', () => setPause(true));

// ---------- 起動 ----------
function resize(){
  const r = $('field').getBoundingClientRect(); W = r.width; H = r.height;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.min(W, H) / 232; CX = W / 2; CY = H / 2;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe($('field'));
window.addEventListener('resize', resize);
resize(); hud(); chipsUpdate();
enterStage(0); setMode('title');
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (!(dt > 0)) dt = 0; dt = Math.min(dt, .05);
  if (!paused) update(dt);
  draw();
}
requestAnimationFrame(frame);
})();
</script>
