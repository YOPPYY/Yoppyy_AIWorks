<style>
/* Layout: full-screen canvas sky over a floating island; HUD pinned to top corners, rotate button bottom-right, overlays for title/pause/result */
:root{
  --ink:#1c1838;
  --paper:#fff6ea;
  --p1:#ff6b5b;
  --p2:#2fc3c9;
  --gold:#ffcf4a;
  --veil:rgba(22,18,54,.74);
  --glass:rgba(255,255,255,.16);
  --display:'Dela Gothic One','Hiragino Sans','Noto Sans JP',sans-serif;

}
html,body{height:100%;margin:0;overflow:hidden;background:#241f55;color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;
  display:grid;grid-template-columns:48px 1fr 56px;align-items:start;gap:10px;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--glass);backdrop-filter:blur(6px);
  display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pill{font-family:var(--display);font-size:18px;letter-spacing:.06em;padding:6px 18px;border-radius:99px;
  background:var(--glass);backdrop-filter:blur(6px);border:2px solid transparent;transition:border-color .25s,transform .25s;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.p1{border-color:var(--p1);color:#ffd9d4}
.pill.p2{border-color:var(--p2);color:#d2fbfd}

.pill small{font-family:var(--body);font-weight:800;font-size:12px;margin-left:3px;opacity:.8}
.timer{width:min(200px,100%);height:12px;border-radius:99px;background:rgba(28,24,56,.45);padding:2px;box-sizing:border-box;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.timer i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px;transition:background-color .2s}
.timer i.low{background:var(--p1)}
.count{position:fixed;left:0;right:0;top:34%;z-index:4;text-align:center;pointer-events:none;
  font-family:var(--display);font-size:clamp(90px,30vw,150px);line-height:1;color:#fff;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 rgba(28,24,56,.45)}
.count.go{animation:cd .9s ease-out forwards}
@keyframes cd{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}70%{opacity:1}100%{transform:scale(.85);opacity:0}}
.next{width:56px;height:56px;border-radius:14px;background:var(--glass);backdrop-filter:blur(6px)}

.rot{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:78px;height:78px;border-radius:50%;
  border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:5;
  box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.rot:active{transform:translateY(3px) scale(.96);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.rot.off{opacity:.3}

.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
.overlay.dim{background:var(--veil);backdrop-filter:blur(3px)}
.logo{font-family:var(--display);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.logo .a{display:block;font-size:clamp(34px,11vw,58px);letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 20%,#ffe39a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(28,24,56,.55))}
.logo .b{display:inline-block;margin-top:8px;font-size:clamp(20px,6.4vw,32px);color:var(--ink);background:var(--gold);
  padding:4px 16px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(28,24,56,.4)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(300px,100%)}
.btn{font-family:var(--display);font-size:20px;letter-spacing:.05em;padding:15px 18px;border-radius:18px;border:0;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(28,24,56,.45);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(28,24,56,.45)}
.btn.c1{background:var(--p1);color:#fff}
.btn.c2{background:var(--p2);color:#fff}

  background:rgba(28,24,56,.4);padding:8px 14px;border-radius:12px}

.result .sub{font-weight:800;font-size:16px;opacity:.9;margin:0;font-variant-numeric:tabular-nums}

.result .big small{font-size:22px;margin-left:4px}
.newbest{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px}
.fadein{animation:fi .35s ease-out}
@keyframes fi{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fadein{animation:none}.pill{transition:none}}

<canvas id="stage"></canvas>

  <button class="iconbtn" id="pauseBtn" aria-label="ポーズ">

</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events } = Matter;

/* ================= Sound ================= */
const AU = {
  ctx: null, master: null, bgmGain: null, on: true, bgmOn: false, noiseBuf: null,
  step: 0, nextTime: 0, timerId: null, mute: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.9 : 0;
    this.master.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
    this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.0; this.bgmGain.connect(this.master);
    const len = this.ctx.sampleRate; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  },
  setOn(v) {
    this.on = v; try { localStorage.setItem('ttb_sound', v ? '1' : '0'); } catch (e) {}
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.03);
  },
  ok() { return this.ctx && this.on && !this.mute; },
  tone(f, dur, type = 'square', vol = 0.1, f2 = null, delay = 0, dest = null) {
    if (!this.ok() && !dest) return; if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, type, f1, f2, delay = 0, dest = null) {
    if (!this.ctx) return; if (!dest && !this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const fl = this.ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfx);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  // --- effects ---
  click() { if (this.ctx && this.on) this.tone(520, 0.05, 'square', 0.06, 700, 0, this.sfx); },
  rotate() { this.tone(620, 0.07, 'square', 0.07, 940); this.tone(1240, 0.04, 'triangle', 0.04, null, 0.03); },
  tick() { this.tone(1500, 0.018, 'triangle', 0.025); },
  drop() { this.noise(0.22, 0.16, 'bandpass', 2400, 350); this.tone(420, 0.16, 'sine', 0.05, 180); },
  land(v) {
    const vol = Math.min(0.55, 0.12 + v * 0.06);
    this.tone(120, 0.18, 'sine', vol, 48); this.noise(0.09, vol * 0.5, 'lowpass', 900, 200);
    this.tone(330 + Math.random() * 60, 0.06, 'triangle', vol * 0.25);
  },
  clack(v) { this.tone(260 + Math.random() * 240, 0.05, 'triangle', Math.min(0.12, 0.02 + v * 0.03)); },
  turn(p) { const b = p === 0 ? 587 : 494; this.tone(b, 0.08, 'triangle', 0.1); this.tone(b * 1.5, 0.12, 'triangle', 0.1, null, 0.08); },
  warn() { this.tone(1050, 0.09, 'square', 0.08); this.tone(2100, 0.06, 'sine', 0.05); },
  fall() { this.tone(700, 0.9, 'sawtooth', 0.07, 70); this.tone(706, 0.9, 'square', 0.04, 72); },
  splash() { this.noise(0.5, 0.22, 'lowpass', 3000, 300); this.tone(300, 0.12, 'sine', 0.08, 900, 0.02); },
  start() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.07, null, i * 0.07)); },
  win() {
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, i === 5 ? 0.5 : 0.14, 'square', 0.08, null, i * 0.11));
    [262, 330, 392, 523].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.1, null, i * 0.16));
  },
  lose() { [494, 440, 392, 330, 262].forEach((f, i) => this.tone(f, i === 4 ? 0.7 : 0.2, 'triangle', 0.1, i === 4 ? 196 : null, i * 0.18)); },
  // --- BGM (original tune, A minor) ---
  MEL: [76,0,72,74,76,74,72,69, 72,0,69,72,77,0,76,74, 72,0,67,72,76,79,76,72, 74,0,71,74,79,0,74,0,
        76,77,76,74,72,0,69,72, 77,0,76,77,79,77,76,74, 74,0,79,0,74,71,74,79, 76,0,71,68,71,0,76,0],
  BASS: [45,41,48,43,45,41,43,40],
  startBGM() {
    if (!this.ctx || this.bgmOn) return;
    this.bgmOn = true; this.step = 0; this.nextTime = this.ctx.currentTime + 0.1;
    this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.bgmGain.gain.setTargetAtTime(0.5, this.ctx.currentTime, 0.3);
    const spb = 60 / 138 / 2;
    const midi = n => 440 * Math.pow(2, (n - 69) / 12);
    const sched = () => {
      if (!this.bgmOn) return;
      while (this.nextTime < this.ctx.currentTime + 0.25) {
        const s = this.step % 64, bar = Math.floor(s / 8), t = this.nextTime - this.ctx.currentTime;
        const m = this.MEL[s];
        if (m) { this.tone(midi(m), spb * 0.9, 'square', 0.05, null, t, this.bgmGain); this.tone(midi(m + 12), spb * 0.5, 'triangle', 0.015, null, t, this.bgmGain); }
        const root = this.BASS[bar] + (s % 2 ? 12 : 0);
        this.tone(midi(root), spb * 0.85, 'triangle', 0.13, null, t, this.bgmGain);
        if (s % 2) this.noise(0.03, 0.035, 'highpass', 7000, null, t, this.bgmGain);
        if (s % 8 === 0 || s % 8 === 4) this.noise(0.08, 0.07, 'lowpass', 400, 80, t, this.bgmGain);
        this.nextTime += spb; this.step++;
      }
    };
    sched(); this.timerId = setInterval(sched, 60);
  },
  stopBGM() {
    if (!this.ctx || !this.bgmOn) return;
    this.bgmOn = false; clearInterval(this.timerId);
    this.bgmGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
  }
};
try { AU.on = localStorage.getItem('ttb_sound') !== '0'; } catch (e) {}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ================= Pieces ================= */
const S = 30, WORLD_W = 420, PLAT_W = 320, DEATH_Y = 130, SEA_Y = 360;
const SHAPES = {
  I: [[0,0],[1,0],[2,0],[3,0]], O: [[0,0],[1,0],[0,1],[1,1]], T: [[0,0],[1,0],[2,0],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]], L: [[2,0],[0,1],[1,1],[2,1]]
};
const COLORS = { I:'#3ed3e6', O:'#ffd23f', T:'#b56ef2', S:'#5ad672', Z:'#ff5c63', J:'#4f7dff', L:'#ff9c36' };
const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
};
const PAL = {}; for (const k in COLORS) PAL[k] = { base: COLORS[k], hi: shade(COLORS[k], 0.45), lo: shade(COLORS[k], -0.35) };
const REL = {};
for (const k in SHAPES) {
  const c = SHAPES[k]; const mx = c.reduce((a, p) => a + p[0] + 0.5, 0) / 4, my = c.reduce((a, p) => a + p[1] + 0.5, 0) / 4;
  REL[k] = c.map(([x, y]) => ({ x: (x + 0.5 - mx) * S, y: (y + 0.5 - my) * S }));
}
const rotP = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: p.x * c - p.y * s, y: p.x * s + p.y * c }; };
const cellsAt = (type, rot) => REL[type].map(p => { const q = rotP(p, rot * Math.PI / 2); return { x: Math.round(q.x * 100) / 100, y: Math.round(q.y * 100) / 100 }; });
const halfW = (type, rot) => Math.max(...cellsAt(type, rot).map(c => Math.abs(c.x))) + S / 2;

let bag = [];
const nextFromBag = () => { if (!bag.length) { bag = Object.keys(SHAPES); for (let i = bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; } } return bag.pop(); };

/* ================= Physics ================= */
let engine, platform, pieces = [];
function resetWorld() {
  engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 0.85;
  engine.positionIterations = 14; engine.velocityIterations = 10;
  platform = Bodies.rectangle(0, 20, PLAT_W, 40, { isStatic: true, friction: 1, frictionStatic: 10, label: 'plat' });
  Composite.add(engine.world, platform);
  pieces = [];
  Events.on(engine, 'collisionStart', onCollide);
}
function makePiece(type, x, y, rot, owner) {
  const opt = { friction: 1, frictionStatic: 6, frictionAir: 0.025, restitution: 0, density: 0.0016 };
  const parts = REL[type].map(p => Bodies.rectangle(x + p.x, y + p.y, S, S, opt));
  const b = Body.create(Object.assign({ parts }, opt));
  Body.setAngle(b, rot * Math.PI / 2);
  Body.setPosition(b, { x, y });
  b.ptype = type; b.owner = owner; b.landed = false; b.fell = false; b.splashed = false;
  Body.setInertia(b, b.inertia * 4);
  Composite.add(engine.world, b); pieces.push(b);
  return b;
}
let lastClack = 0;
function onCollide(e) {
  const now = performance.now();
  for (const pr of e.pairs) {
    const A = pr.bodyA.parent, B = pr.bodyB.parent;
    const rv = Math.hypot(A.velocity.x - B.velocity.x, A.velocity.y - B.velocity.y);
    for (const b of [A, B]) {
      if (b === current && !b.landed) {
        b.landed = true; AU.land(rv);
        if (isHuman()) buzz(12);
        const cp = pr.collision.supports && pr.collision.supports[0];
        if (cp) puff(cp.x, cp.y, Math.min(10, 3 + rv * 2));
        lastClack = now; return;
      }
    }
    if (rv > 1.2 && now - lastClack > 70) { AU.clack(rv); lastClack = now; }
  }
}

/* ================= Game state ================= */
const $ = id => document.getElementById(id);
const cv = $('stage'), ctx = cv.getContext('2d');
const nextCv = $('next'), nctx = nextCv.getContext('2d');
let W = 0, H = 0, DPR = 1, scale = 1, viewH = 800;
let mode = 'demo', state = 'idle', paused = false;
let cur = 0, lastDropper = 0, count = 0, towerTop = 0;
let hold = null, nextType = null, current = null, dropT = 0, calm = 0;
let camTop = -600, turnTime = 0, lastWarn = 0;
const TURN_LIMIT = 10;
let cpu = null, particles = [], overTimer = 0, loser = -1, bestHeight = 0;
let best = 0; try { best = +localStorage.getItem('ttb_best') || 0; } catch (e) {}

const isHuman = () => mode === 'solo' || mode === 'pvp' || (mode === 'cpu' && cur === 0);
const isCPU = () => mode === 'demo' || (mode === 'cpu' && cur === 1);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  scale = Math.min(W / WORLD_W, H / 660);
  viewH = H / scale;
}
window.addEventListener('resize', resize); resize();

function computeTowerTop() {
  let t = 0;
  for (const b of pieces) if (!b.fell) t = Math.min(t, b.bounds.min.y);
  return t;
}
function holdY() { return towerTop - 140; }

function newGame(m) {
  mode = m; resetWorld(); bag = [];
  hideCount();
  cur = 0; lastDropper = 0; count = 0; towerTop = 0; particles = []; loser = -1; bestHeight = 0;
  nextType = nextFromBag(); current = null; paused = false;
  AU.mute = (m === 'demo');
  $('hud').hidden = m === 'demo';
  $('rotBtn').hidden = m === 'demo';
  $('timer').hidden = !(m === 'cpu' || m === 'pvp');

}

function beginTurn(first) {

  nextType = nextFromBag();
  state = 'aim'; turnTime = 0; lastWarn = 0; current = null;
  drawNext(); updatePill();
  if (!first && (mode === 'cpu' || mode === 'pvp')) AU.turn(cur);
  cpu = isCPU() ? { t: 0, plan: planCPU(hold.type), cd: 0, wait: 0 } : null;
}

function clampHold() {

}

}

}
function hideCount() { const c = $('count'); c.hidden = true; c.classList.remove('go'); }

function showResult() {

function updatePill() {

/* ================= CPU ================= */
function surfaceAt(x0, x1) {
  let h = Infinity;
  if (x1 > -PLAT_W / 2 && x0 < PLAT_W / 2) h = 0;
  for (const b of pieces) {
    if (b.fell) continue;
    for (let i = 1; i < b.parts.length; i++) {
      const pb = b.parts[i].bounds;
      if (pb.max.x > x0 && pb.min.x < x1 && pb.min.y < h) h = pb.min.y;
    }
  }
  return h;
}
function planCPU(type) {
  const noise = mode === 'demo' ? 5 : 9;
  const rots = type === 'O' ? [0] : (type === 'I' || type === 'S' || type === 'Z') ? [0, 1] : [0, 1, 2, 3];
  let bestC = { x: 0, rot: 0, score: -1e9 };
  for (const r of rots) {
    const cells = cellsAt(type, r);
    const cols = {};
    for (const c of cells) {
      const k = Math.round(c.x);
      if (!cols[k]) cols[k] = { x: c.x, bottom: -1e9, top: 1e9 };
      cols[k].bottom = Math.max(cols[k].bottom, c.y + S / 2);
      cols[k].top = Math.min(cols[k].top, c.y - S / 2);
    }
    const cl = Object.values(cols); const hw = halfW(type, r);
    const topRel = Math.min(...cl.map(c => c.top));
    for (let x = -WORLD_W / 2 + hw; x <= WORLD_W / 2 - hw; x += 5) {
      let y = Infinity; const hs = cl.map(c => surfaceAt(x + c.x - S / 2 + 3, x + c.x + S / 2 - 3));
      cl.forEach((c, i) => { if (hs[i] < Infinity) y = Math.min(y, hs[i] - c.bottom); });
      if (y === Infinity) continue;
      const sup = []; let gap = 0, over = 0;
      cl.forEach((c, i) => {
        if (hs[i] === Infinity) { over++; return; }
        const g = hs[i] - (y + c.bottom);
        if (g < 4) sup.push(x + c.x); else gap += Math.min(g, 90);
      });
      if (!sup.length) continue;
      const sMin = Math.min(...sup) - S / 2 + 4, sMax = Math.max(...sup) + S / 2 - 4;
      const ok = x >= sMin && x <= sMax; const margin = Math.min(x - sMin, sMax - x);
      const top = y + topRel;
      const score = sup.length * 10 - gap * 0.25 - over * 30 + (ok ? Math.min(margin, 30) * 0.6 : -300)
        + top * 0.08 - Math.abs(x) * 0.08 + (Math.random() - 0.5) * noise * 2;
      if (score > bestC.score) bestC = { x, rot: r, score };
    }
  }
  bestC.x += (Math.random() - 0.5) * (mode === 'demo' ? 2 : 5);
  return bestC;
}
function updateCPU(dt) {
  if (!cpu || state !== 'aim') return;
  const sp = mode === 'demo' ? 1.6 : 1;
  cpu.t += dt * sp;
  if (cpu.t < 0.55) return;
  cpu.cd -= dt * sp;
  if (hold.rot !== cpu.plan.rot) { if (cpu.cd <= 0) { rotateHold(); cpu.cd = 0.2; } return; }
  const dx = cpu.plan.x - hold.x;
  if (Math.abs(dx) > 0.8) { hold.x += Math.sign(dx) * Math.min(Math.abs(dx), 240 * dt * sp); clampHold(); return; }
  cpu.wait += dt * sp;
  if (cpu.wait > 0.28) dropHold();
}

/* ================= Rendering ================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const stars = Array.from({ length: 120 }, () => ({ x: Math.random(), y: rnd(-9000, -700), r: rnd(0.6, 1.8), tw: rnd(0, 6) }));
const clouds = Array.from({ length: 14 }, (_, i) => ({ x: rnd(-300, 300), y: -120 - i * rnd(160, 260), s: rnd(0.7, 1.4) }));
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => `rgb(${lerp(c1[0], c2[0], t) | 0},${lerp(c1[1], c2[1], t) | 0},${lerp(c1[2], c2[2], t) | 0})`;
const toSX = x => W / 2 + x * scale, toSY = y => (y - camTop) * scale;

function puff(x, y, n) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: rnd(-60, 60), vy: rnd(-50, -10), life: rnd(0.35, 0.6), t: 0, r: rnd(3, 6), c: 'rgba(255,248,235,' });
}
function splash(x) {
  for (let i = 0; i < 18; i++) particles.push({ x: x + rnd(-15, 15), y: SEA_Y, vx: rnd(-80, 80), vy: rnd(-260, -120), life: rnd(0.5, 0.9), t: 0, r: rnd(2.5, 5), c: 'rgba(200,245,255,', g: 600 });
}

function drawCell(x, y, ang, pal, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = alpha;
  const h = S / 2, b = 5;
  ctx.fillStyle = pal.base; ctx.fillRect(-h, -h, S, S);
  ctx.fillStyle = pal.hi;
  ctx.beginPath(); ctx.moveTo(-h, -h); ctx.lineTo(h, -h); ctx.lineTo(h - b, -h + b); ctx.lineTo(-h + b, -h + b); ctx.lineTo(-h + b, h - b); ctx.lineTo(-h, h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal.lo;
  ctx.beginPath(); ctx.moveTo(h, h); ctx.lineTo(-h, h); ctx.lineTo(-h + b, h - b); ctx.lineTo(h - b, h - b); ctx.lineTo(h - b, -h + b); ctx.lineTo(h, -h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-h + b + 2, -h + b + 2, 5, 5);
  ctx.strokeStyle = 'rgba(28,24,56,.35)'; ctx.lineWidth = 1; ctx.strokeRect(-h + .5, -h + .5, S - 1, S - 1);
  ctx.restore();
}

function drawBackground(time) {
  const alt = Math.max(0, Math.min(1, -camTop / 3200));
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix([92, 108, 214], [16, 14, 52], alt));
  g.addColorStop(0.6, mix([196, 150, 210], [38, 36, 110], alt));
  g.addColorStop(1, mix([255, 190, 150], [70, 70, 160], alt));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars
  const sa = Math.max(0, Math.min(1, (-camTop - 600) / 1800));
  if (sa > 0) {
    for (const s of stars) {
      const sy = (s.y - camTop * 0.3) * scale;
      if (sy < -5 || sy > H + 5) continue;
      ctx.globalAlpha = sa * (0.55 + 0.45 * Math.sin(time * 2 + s.tw));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, sy, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // distant sun glow
  const sunY = (240 - camTop * 0.15) * scale * 0.35 + H * 0.55;
  if (sunY < H + 120) {
    const rg = ctx.createRadialGradient(W * 0.72, sunY, 0, W * 0.72, sunY, 140);
    rg.addColorStop(0, `rgba(255,225,170,${0.6 * (1 - alt)})`); rg.addColorStop(1, 'rgba(255,225,170,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  // clouds
  ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - alt * 0.7)})`;
  for (const c of clouds) {
    const sx = W / 2 + (c.x + time * 6 * c.s) % 700 * scale * 0.6, sy = (c.y - camTop * 0.6) * scale;
    if (sy < -80 || sy > H + 80) continue;
    const r = 22 * c.s * scale;
    ctx.beginPath();
    ctx.ellipse(sx, sy, r * 2.2, r * 0.8, 0, 0, 7);
    ctx.ellipse(sx - r, sy - r * 0.4, r, r * 0.8, 0, 0, 7);
    ctx.ellipse(sx + r * 0.6, sy - r * 0.6, r * 1.2, r, 0, 0, 7);
    ctx.fill();

}

function drawWorld(time) {
  // sea
  const seaY = toSY(SEA_Y);
  if (seaY < H) {
    const sg = ctx.createLinearGradient(0, seaY, 0, H);
    sg.addColorStop(0, '#3a8fb7'); sg.addColorStop(1, '#1d3f78');
    ctx.fillStyle = sg; ctx.fillRect(0, seaY, W, H - seaY);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const yy = seaY + (10 + i * 22) * scale; ctx.beginPath();
      for (let x = 0; x <= W; x += 10) ctx.lineTo(x, yy + Math.sin(x * 0.03 + time * 1.6 + i) * 3);
      ctx.stroke();
    }
  }
  // island rock
  const K = PLAT_W / 240; const pts = [[-120, 30], [120, 30], [104, 70], [80, 110], [46, 180], [14, 250], [-8, 210], [-40, 160], [-78, 110], [-104, 70]].map(([x, y]) => [x * K, y]);
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(toSX(x), toSY(y)) : ctx.moveTo(toSX(x), toSY(y))); ctx.closePath();
  const rg = ctx.createLinearGradient(0, toSY(20), 0, toSY(250));
  rg.addColorStop(0, '#9b6b4e'); rg.addColorStop(1, '#4b2f3b');
  ctx.fillStyle = rg; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.14)';
  ctx.beginPath(); [[20, 30], [120, 30], [104, 70], [80, 110], [46, 180], [14, 250]].forEach(([x, y], i) => i ? ctx.lineTo(toSX(x * K), toSY(y)) : ctx.moveTo(toSX(x * K), toSY(y))); ctx.closePath(); ctx.fill();
  // platform top (the physical slab)
  ctx.fillStyle = '#a8764f'; ctx.fillRect(toSX(-PLAT_W / 2), toSY(8), PLAT_W * scale, 32 * scale);
  ctx.fillStyle = '#6fcf6a'; ctx.fillRect(toSX(-PLAT_W / 2 - 2), toSY(-2), (PLAT_W + 4) * scale, 12 * scale);
  ctx.fillStyle = '#4fae55'; ctx.fillRect(toSX(-PLAT_W / 2 - 2), toSY(7), (PLAT_W + 4) * scale, 4 * scale);
  for (let x = -PLAT_W / 2 + 4; x < PLAT_W / 2; x += 14) { ctx.fillStyle = '#4fae55'; ctx.fillRect(toSX(x), toSY(10), 5 * scale, (5 + (x * 7 % 5)) * scale); }

  ctx.save(); ctx.translate(W / 2, -camTop * scale); ctx.scale(scale, scale);
  // pieces
  for (const b of pieces) {
    const pal = PAL[b.ptype];
    for (let i = 1; i < b.parts.length; i++) drawCell(b.parts[i].position.x, b.parts[i].position.y, b.angle, pal);
  }
  // hold piece + guides
  if (hold && state === 'aim') {
    const cells = cellsAt(hold.type, hold.rot);
    const col = (mode === 'solo' || cur === 0) ? '#ff6b5b' : '#2fc3c9';
    const colsB = {};
    for (const c of cells) { const k = Math.round(c.x); colsB[k] = Math.max(colsB[k] ?? -1e9, c.y); }
    for (const k in colsB) {
      const x0 = hold.x + (+k) - S / 2, y0 = hold.y + colsB[k] + S / 2;
      const g = ctx.createLinearGradient(0, y0, 0, y0 + 420);
      g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00');
      ctx.fillStyle = g; ctx.fillRect(x0, y0, S, 420);
    }
    const bob = Math.sin(time * 4) * 2;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 14;
    for (const c of cells) { ctx.fillStyle = col; ctx.fillRect(hold.x + c.x - S / 2 - 2, hold.y + c.y - S / 2 - 2 + bob, S + 4, S + 4); }
    ctx.restore();
    for (const c of cells) drawCell(hold.x + c.x, hold.y + c.y + bob, 0, PAL[hold.type]);

    ctx.fillStyle = p.c + (a * 0.85).toFixed(2) + ')';

    ctx.beginPath(); ctx.moveTo(W - 64, y); ctx.lineTo(W - 10, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '800 12px "M PLUS Rounded 1c",sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((-towerTop / S).toFixed(1) + 'm', W - 12, y - 6);

}

function drawNext() {
  const n = nctx, s = 112; n.clearRect(0, 0, s, s);
  if (!nextType) return;
  const cells = cellsAt(nextType, 0), k = 0.62;
  n.save(); n.translate(s / 2, s / 2); n.scale(k, k);
  const pal = PAL[nextType];

    n.fillStyle = pal.hi; n.fillRect(c.x - S / 2, c.y - S / 2, S, 5);
    n.fillStyle = pal.lo; n.fillRect(c.x - S / 2, c.y + S / 2 - 5, S, 5);

/* ================= Loop ================= */
const STEP = 1000 / 60; let acc = 0, lastT = performance.now(), clock = 0;
function physicsStep(dt) {
  Engine.update(engine, STEP);
  for (const b of pieces) {
    if (b.fell || b.isSleeping) continue;
    const v = b.velocity, sp = Math.hypot(v.x, v.y), MAXV = 7;
    if (sp > MAXV) Body.setVelocity(b, { x: v.x * MAXV / sp, y: v.y * MAXV / sp });
    const MAXA = b.landed || b !== current ? 0.035 : 0.05;
    if (Math.abs(b.angularVelocity) > MAXA) Body.setAngularVelocity(b, Math.sign(b.angularVelocity) * MAXA);
    if (Math.abs(v.x) > 3) Body.setVelocity(b, { x: Math.sign(v.x) * 3, y: b.velocity.y });
  }
  for (const b of pieces) {
    if (!b.fell && b.position.y > DEATH_Y) {
      b.fell = true;
      if (state === 'aim' || state === 'drop') gameOver();
    }
    if (!b.splashed && b.position.y > SEA_Y) { b.splashed = true; splash(b.position.x); AU.splash(); }
  }
  // remove deep pieces
  for (let i = pieces.length - 1; i >= 0; i--) {
    if (pieces[i].position.y > SEA_Y + 500) { Composite.remove(engine.world, pieces[i]); pieces.splice(i, 1); }
  }
  if (state === 'drop') {
    dropT += dt;
    let moving = false;
    for (const b of pieces) if (!b.fell && !b.isSleeping && (b.speed > 0.12 || Math.abs(b.angularSpeed) > 0.006)) { moving = true; break; }
    calm = moving ? 0 : calm + 1;
    if ((dropT > 0.45 && calm > 16) || dropT > 6.5) endDrop();
  }
}

function frame(now) {
  let dtMs = Math.min(100, now - lastT); lastT = now;
  const dt = dtMs / 1000;
  if (!paused && engine) {
    clock += dt;
    acc += dtMs;
    while (acc >= STEP) { physicsStep(STEP / 1000); acc -= STEP; }
    if (state === 'aim') {
      updateCPU(dt);
      if (mode === 'cpu' || mode === 'pvp') {
        turnTime += dt;
        const left = TURN_LIMIT - turnTime;
        $('timerBar').style.width = (Math.max(0, left / TURN_LIMIT) * 100) + '%';
        $('timerBar').classList.toggle('low', left < 3);
        if (isHuman() && left < 3 && left > 0 && Math.ceil(left) !== lastWarn) { lastWarn = Math.ceil(left); AU.warn(); showCount(lastWarn); }
        if (left <= 0) { drag = null; dropHold(); }
      }
    }
    if (state === 'over') {
      overTimer += dt;
      if (mode === 'demo' && overTimer > 1.8) newGame('demo');
      else if (mode !== 'demo' && overTimer > 1.4 && $('result').hidden && overTimer < 5) { overTimer = 99; showResult(); }
    }
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 120) * dt; p.vx *= 0.96; }
    particles = particles.filter(p => p.t < p.life);
    // camera
    const hy = hold ? hold.y : holdY();
    const target = Math.min(200 - viewH, hy - viewH * 0.24);
    camTop += (target - camTop) * Math.min(1, dt * 3);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(clock);
  if (engine) drawWorld(clock);
  requestAnimationFrame(frame);
}

function toTitle() { AU.click(); AU.stopBGM(); paused = false; $('pause').hidden = true; $('result').hidden = true; $('title').hidden = false; newGame('demo'); }
$('quitBtn').addEventListener('click', toTitle);
$('toTitleBtn').addEventListener('click', toTitle);
$('againBtn').addEventListener('click', () => { AU.click(); $('rotBtn').classList.remove('off'); newGame(lastMode); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && mode !== 'demo' && state !== 'over' && !paused) { paused = true; $('pause').hidden = false; AU.stopBGM(); }
  if (!document.hidden && mode !== 'demo') requestWake();
});
window.addEventListener('keydown', e => {
  if (paused || !isHuman() || mode === 'demo' || state !== 'aim') return;
  if (e.key === 'ArrowLeft') { hold.x -= S / 2; clampHold(); AU.tick(); }
  else if (e.key === 'ArrowRight') { hold.x += S / 2; clampHold(); AU.tick(); }
  else if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'x') rotateHold();
  else if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); dropHold(); }
});

newGame('demo');
requestAnimationFrame(frame);
})();
