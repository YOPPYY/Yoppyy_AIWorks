<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小銭の5秒勘定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1a1f23;
  --bg2:#232a2f;
  --ink:#eef1ee;
  --mute:#93a0a6;
  --tray:#1d5866;
  --tray-deep:#123d47;
  --brass:#d4ae3a;
  --key:#e9ecea;
  --key-ink:#1b2226;
  --key-shadow:#9aa3a5;
  --ok:#3fbf7f;
  --ng:#e5604a;
  --cyan:#5fc3d6;
  --disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  display:flex;justify-content:center;padding-inline:16px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
.app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud .left{display:flex;align-items:center;gap:10px;min-width:0}
.hud .q{font-family:var(--disp);font-size:18px;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud .q small{font-family:var(--body);font-size:12px;color:var(--mute);margin-left:2px}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #45535a;transition:background .2s,border-color .2s,transform .2s}
.dot.now{border-color:var(--brass)}
.dot.ok{background:var(--ok);border-color:var(--ok);transform:scale(1.15)}
.dot.ng{background:var(--ng);border-color:var(--ng)}
.hud .right{display:flex;gap:6px}
.chip{
  font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--bg2);
  border:1.5px solid #3a464c;border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap;
}
.chip.off{color:var(--mute)}
.chip.warn{background:var(--ng);border-color:var(--ng);color:#fff}
.chip:disabled{opacity:.35;cursor:default}

/* tray (カルトン) */
.tray{
  position:relative;flex:1 1 auto;min-height:170px;border-radius:22px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),
    radial-gradient(120% 90% at 50% 40%,var(--tray) 0%,var(--tray-deep) 100%);
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),inset 0 10px 24px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.06);
  --u:6px;
}
.tray::after{content:"";position:absolute;inset:14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.tray.flash-ok{animation:flashok .6s}
.tray.flash-ng{animation:shake .45s, flashng .6s}
@keyframes flashok{0%{box-shadow:inset 0 0 0 6px var(--ok),inset 0 0 60px rgba(63,191,127,.55)}100%{}}
@keyframes flashng{0%{box-shadow:inset 0 0 0 6px var(--ng),inset 0 0 60px rgba(229,96,74,.5)}100%{}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.coins{position:absolute;inset:0}
.coin{
  position:absolute;width:calc(var(--u) * var(--mm));height:auto;
  transform:translate(-50%,-50%) rotate(var(--rot));
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));
  animation:drop .34s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--dl);
}
@keyframes drop{
  0%{opacity:0;transform:translate(-50%,-160%) rotate(calc(var(--rot) - 90deg)) scale(1.4)}
  60%{opacity:1}
}
.coins.gone .coin{animation:vanish .28s ease-in forwards;animation-delay:calc(var(--dl) * .3)}
@keyframes vanish{to{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--rot) + 120deg)) scale(.2)}}
.coins.back .coin{animation:pop .3s ease-out both;animation-delay:calc(var(--dl) * .5)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.4)}}
.coins.dim .coin{opacity:.3;animation:none}
.coinval{
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--disp);font-size:13px;color:#fff;background:rgba(10,20,24,.78);
  padding:1px 6px;border-radius:6px;white-space:nowrap;animation:pop2 .3s ease-out both;animation-delay:var(--dl);
}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-10%)}}

.big-num{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-family:var(--disp);font-size:clamp(72px,26vw,132px);line-height:1;color:rgba(255,255,255,.14);
}
.big-num.ready{color:var(--brass);text-shadow:0 6px 0 rgba(0,0,0,.3)}
.big-num.urgent{color:rgba(229,96,74,.55)}
.big-num.beat{animation:beat .45s ease-out}
@keyframes beat{0%{transform:scale(1.6);opacity:0}40%{opacity:1}100%{transform:scale(1)}}

.banner{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);
  padding:6px 16px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;
  background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.banner.pop{animation:bpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{from{transform:translateX(-50%) scale(.3);opacity:0}}
.banner.ok{color:var(--ok);font-size:18px} .banner.ng{color:var(--ng)} .banner.look{color:var(--brass)} .banner.hot{color:var(--cyan)}

/* panel over the tray (title / end) */
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:18px;text-align:center;background:rgba(14,22,26,.74);backdrop-filter:blur(2px);
}
.panel h1{font-family:var(--disp);font-weight:400;font-size:clamp(28px,9vw,40px);margin:0;letter-spacing:.04em;text-wrap:balance}
.panel h1 span{color:var(--brass)}
.panel p{margin:0;font-size:13px;line-height:1.7;color:#c9d2d4;max-width:30ch}
.lv{display:flex;gap:6px}
.lv button{
  font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:transparent;
  border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;cursor:pointer;
}
.lv button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#2a2106}
.big{
  font-family:var(--disp);font-size:20px;color:#2a2106;background:var(--brass);border:0;border-radius:14px;
  padding:12px 34px;cursor:pointer;box-shadow:0 4px 0 #8f7420;
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8f7420}
.linkbtn{font:inherit;font-size:13px;color:#c9d2d4;background:none;border:0;text-decoration:underline;cursor:pointer}

.stars{display:flex;gap:4px;font-size:clamp(30px,10vw,42px);line-height:1}
.star{color:#3a464c}
.star.on{color:var(--brass);animation:starpop .4s cubic-bezier(.3,1.8,.5,1);text-shadow:0 0 14px rgba(212,174,58,.6)}
@keyframes starpop{from{transform:scale(2.2) rotate(-30deg);opacity:0}}
.rank{font-family:var(--disp);font-size:clamp(26px,8vw,34px);line-height:1.2;opacity:0}
.rank.show{animation:rankin .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes rankin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.endline{font-size:14px;color:#c9d2d4}
.endline b{font-family:var(--disp);font-weight:400;font-size:22px;color:var(--ink);margin:0 2px}
.newbest{color:var(--brass);font-weight:700;font-size:13px}

/* timer */
.timer{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar{height:100%;width:100%;transform-origin:left;background:var(--mute);border-radius:99px}
.bar.show{background:var(--brass)} .bar.input{background:var(--cyan)} .bar.hurry{background:var(--ng)}
.secs{font-family:var(--disp);font-size:16px;width:3.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}

/* answer display */
.answer{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#0f1417;border-radius:14px;padding:8px 14px;min-height:64px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
}
.phase{font-size:13px;font-weight:700;color:var(--mute);line-height:1.35;max-width:52%}
.phase.hot{color:var(--cyan)}
.readout{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.readout output{font-family:var(--disp);font-size:clamp(32px,10vw,42px);line-height:1;color:#b8f0c8;min-width:1ch;text-align:right}
.readout output.empty{color:#3c4a4f}
.readout output.tap{animation:tap .12s ease-out}
@keyframes tap{from{transform:scale(1.12)}}
.readout span{font-weight:700;color:var(--mute)}
.answer.ok output{color:var(--ok)} .answer.ng output{color:var(--ng)}
.answer.ng{animation:shake .4s}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{
  font-family:var(--disp);font-size:26px;color:var(--key-ink);background:var(--key);
  border:0;border-radius:12px;height:clamp(44px,6.6vh,58px);cursor:pointer;
  box-shadow:0 4px 0 var(--key-shadow);touch-action:manipulation;
}
.pad button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--key-shadow)}
.pad button.fn{font-family:var(--body);font-weight:700;font-size:18px;background:#c9d0d1}
.pad .enter{grid-column:1 / -1;font-size:20px;background:var(--brass);color:#2a2106;box-shadow:0 4px 0 #8f7420}
.pad .enter:active:not(:disabled){box-shadow:0 1px 0 #8f7420}
.pad button:disabled{opacity:.35;cursor:default}
.pad .enter.next{background:var(--cyan);box-shadow:0 4px 0 #2f7f8e;color:#08262c}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

@media (prefers-reduced-motion:reduce){
  .coin,.coins.gone .coin,.coins.back .coin,.big-num.beat,.banner.pop,.tray.flash-ng,.answer.ng,.star.on{animation:none}
  .coins.gone .coin{opacity:0}
}
@media (max-height:640px){.pad{gap:6px}.pad button{height:42px;font-size:22px}.answer{min-height:54px}}
</style>

<div class="app">
  <header class="hud">
    <div class="left">
      <div class="q" id="qno">練習<small>全5問</small></div>
      <div class="dots" id="dots" aria-label="正解の記録"></div>
    </div>
    <div class="right">
      <button type="button" class="chip" id="sound" aria-pressed="true">音 ON</button>
      <button type="button" class="chip" id="quit" disabled>タイトルへ</button>
    </div>
  </header>

  <div class="tray" id="tray">
    <div class="coins" id="coins"></div>
    <div class="big-num" id="bignum" hidden></div>
    <div class="banner" id="banner" hidden></div>

    <div class="panel" id="title">
      <h1>小銭の<span>5秒</span>勘定</h1>
      <p>カルトンに小銭が5秒だけ並びます。消えたら10秒以内に合計金額をテンキーで入力。全5問。</p>
      <div class="lv" role="group" aria-label="難易度">
        <button type="button" id="lv0" data-lv="0" aria-pressed="false">かんたん</button>
        <button type="button" id="lv1" data-lv="1" aria-pressed="true">ふつう</button>
        <button type="button" id="lv2" data-lv="2" aria-pressed="false">むずかしい</button>
      </div>
      <button type="button" class="big" id="start">スタート</button>
      <div class="newbest" id="titlebest"></div>
    </div>

    <div class="panel" id="end" hidden>
      <div class="endline" id="endlv">ふつう</div>
      <div class="stars" id="stars"></div>
      <div class="rank" id="rank">レジの神</div>
      <div class="endline">正解 <b id="endok">0</b> / 5</div>
      <div class="newbest" id="newbest" hidden>自己ベスト更新！</div>
      <button type="button" class="big" id="again">もう一度</button>
      <button type="button" class="linkbtn" id="back">難易度を変える</button>
    </div>
  </div>

  <div class="timer" aria-hidden="true">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="secs" id="secs">5.0</div>
  </div>

  <div class="answer" id="answer">
    <div class="phase" id="phase">難易度を選んでスタート</div>
    <div class="readout"><output id="disp" class="empty">0</output><span>円</span></div>
  </div>

  <div class="pad" id="pad">
    <button type="button" id="k1" data-k="1">1</button>
    <button type="button" id="k2" data-k="2">2</button>
    <button type="button" id="k3" data-k="3">3</button>
    <button type="button" id="k4" data-k="4">4</button>
    <button type="button" id="k5" data-k="5">5</button>
    <button type="button" id="k6" data-k="6">6</button>
    <button type="button" id="k7" data-k="7">7</button>
    <button type="button" id="k8" data-k="8">8</button>
    <button type="button" id="k9" data-k="9">9</button>
    <button type="button" id="kc" data-k="C" class="fn">C</button>
    <button type="button" id="k0" data-k="0">0</button>
    <button type="button" id="kb" data-k="B" class="fn" aria-label="1文字消す">⌫</button>
    <button type="button" id="kenter" data-k="E" class="enter">決定</button>
  </div>
</div>
<canvas id="fx"></canvas>

let ac=null,master=null,muted=false;
try{muted=localStorage.getItem('coin5q-mute')==='1'}catch(e){}
function audio(){
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    ac=new C();master=ac.createGain();master.gain.value=muted?0:.55;master.connect(ac.destination);
  }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function tone(freq,dur,{type='sine',vol=.3,at=0,slide=0,attack=.005}={}){
  const a=audio(); if(!a||muted) return;
  const t=a.currentTime+at;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,{at=0,vol=.25,from=4000,to=600,q=1}={}){
  const a=audio(); if(!a||muted) return;
  const t=a.currentTime+at,len=Math.ceil(a.sampleRate*dur);
  const buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=q;
  f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const SFX={
  coin(at,v){ // チャリン
    const base=v>=100?2600:v>=10?2100:1800;const f=base*(0.92+Math.random()*.16);
    tone(f,.18,{vol:.09,at});tone(f*1.51,.12,{vol:.05,at});noise(.04,{at,vol:.05,from:7000,to:5000,q:3});
  },
  key(){tone(1500,.03,{type:'square',vol:.04})},
  tick(){tone(880,.06,{type:'square',vol:.08})},
  ready(){tone(660,.14,{type:'triangle',vol:.28})},
  vanish(){noise(.3,{vol:.28,from:2500,to:300,q:.8});tone(900,.25,{type:'sine',vol:.08,slide:.4})},
  correct(){
    [1047,1319,1568,2093].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.22,at:i*.07}));
    later(()=>{noise(.08,{vol:.18,from:6000,to:3000,q:2});tone(3200,.5,{vol:.08});tone(4800,.4,{vol:.05})},300);
  },
  wrong(){tone(220,.22,{type:'square',vol:.14});tone(165,.35,{type:'square',vol:.14,at:.2})},
  timeup(){tone(300,.5,{type:'sawtooth',vol:.12,slide:.6})},
  star(i){tone(880*Math.pow(1.26,i),.25,{type:'triangle',vol:.2});tone(1760*Math.pow(1.26,i),.2,{vol:.07})},
  fanfare(good){
    const seq=good?[784,784,784,1047,1319,1568]:[523,494,440,392];
    const step=good?.11:.18;
    seq.forEach((f,i)=>tone(f,i===seq.length-1?.6:.14,{type:good?'square':'triangle',vol:.12,at:i*step}));
  }
};

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],fxRaf=0,dpr=1;
function sizeFx(){dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
function burst(x,y,n,kind){
  if(REDUCED) return;
  const cols=kind==='gold'?['#f3d36b','#d4ae3a','#fff4c2','#c9ccce']:['#5fc3d6','#d4ae3a','#3fbf7f','#e5604a','#f3f3f3'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,life:1,decay:.012+Math.random()*.012,
      c:cols[i%cols.length],r:3+Math.random()*5,spin:Math.random()*6,vs:(Math.random()-.5)*.4,
      shape:kind==='gold'?(i%3?'coin':'spark'):'rect'});
  }
  if(!fxRaf) fxRaf=requestAnimationFrame(drawFx);
}
function rain(n){
  if(REDUCED) return;
  for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
    life:1,decay:.004,c:['#5fc3d6','#d4ae3a','#3fbf7f','#e5604a','#f3f3f3'][i%5],r:4+Math.random()*4,spin:Math.random()*6,vs:(Math.random()-.5)*.3,shape:'rect'});
  if(!fxRaf) fxRaf=requestAnimationFrame(drawFx);
}
function drawFx(){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.spin+=p.vs;p.life-=p.decay;
    cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));cx.fillStyle=p.c;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.spin);
    if(p.shape==='coin'){cx.scale(1,Math.abs(Math.cos(p.spin*2))+.15);cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}
    else if(p.shape==='spark'){cx.beginPath();for(let k=0;k<8;k++){const rr=k%2?p.r*.35:p.r*1.3,an=k*Math.PI/4;cx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}cx.fill()}
    else cx.fillRect(-p.r/2,-p.r,p.r,p.r*2*Math.abs(Math.cos(p.spin)));
    cx.restore();
  }
  cx.globalAlpha=1;
  fxRaf=parts.length?requestAnimationFrame(drawFx):0;
  if(!parts.length) cx.clearRect(0,0,innerWidth,innerHeight);
}
function centerOf(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}

function makeSet(){
  const L=LEVELS[level];const n=rnd(L.min,L.max);const list=[];
  for(let i=0;i<n;i++){
    const k=KINDS[rnd(0,KINDS.length-1)];
    const src=k.v===500?(Math.random()<.5?IMG[500]:IMG['500n']):IMG[k.v];
    list.push({v:k.v,mm:k.mm,src,rot:rnd(0,359)});
  }
  return list;
}
// 重ならないようにランダム配置。入らなければ全体を少しずつ縮める
function layout(list){
  const r=tray.getBoundingClientRect();const W=r.width,H=r.height,pad=12,top=48,m=Math.min(W,H-top+pad);
  const n=list.length;let f=n<=5?0.30:n<=8?0.25:0.21;
  const order=[...list].sort((a,b)=>b.mm-a.mm);
  for(let attempt=0;attempt<40;attempt++,f*=0.93){
    const u=m*f/26.5;const placed=[];let ok=true;
    for(const c of order){
      const rr=c.mm*u/2;let done=false;
      for(let t=0;t<500&&!done;t++){
        const x=pad+rr+Math.random()*(W-2*pad-2*rr);
        const y=top+rr+Math.random()*(H-top-pad-2*rr);
        if(placed.every(p=>Math.hypot(p.x-x,p.y-y)>=p.r+rr+5)){placed.push({x,y,r:rr});c.fx=x/W;c.fy=y/H;done=true}
      }
      if(!done){ok=false;break}
    }
    if(ok){uFrac=u/m;applyUnit();return}
  }
}
function applyUnit(){const r=tray.getBoundingClientRect();tray.style.setProperty('--u',(uFrac*Math.min(r.width,r.height))+'px')}
const STAGGER=45;
function render(list,withSound){
  coinsEl.innerHTML='';coinsEl.className='coins';
  list.forEach((c,i)=>{
    const im=new Image();im.src=c.src;im.alt=c.v+'円';im.className='coin';im.draggable=false;
    im.style.left=(c.fx*100)+'%';im.style.top=(c.fy*100)+'%';
    im.style.setProperty('--mm',c.mm);im.style.setProperty('--rot',c.rot+'deg');im.style.setProperty('--dl',(i*STAGGER)+'ms');
    coinsEl.appendChild(im);
    if(withSound) SFX.coin(i*STAGGER/1000+.2,c.v);
  });
}

}
function hud(){
  $('qno').innerHTML=state==='title'?'練習<small>全5問</small>':state==='end'?'結果':`第${Math.max(1,round)}問<small>/${ROUNDS}</small>`;
  const d=$('dots');d.innerHTML='';
  if(state!=='title') for(let i=0;i<ROUNDS;i++){
    const s=document.createElement('span');s.className='dot'+(results[i]===true?' ok':results[i]===false?' ng':i===round-1?' now':'');d.appendChild(s);
  }
  const b=loadBest(level);$('titlebest').textContent=b?`${LEVELS[level].name}の自己ベスト ${b}/5`:'';
}
function showBanner(text,cls){banner.textContent=text;banner.className='banner pop '+cls;banner.hidden=false}
function big(text,cls){
  bignum.hidden=false;bignum.textContent=text;bignum.className='big-num '+(cls||'');
  void bignum.offsetWidth;bignum.classList.add('beat');
}
function flashTray(cls){tray.classList.remove('flash-ok','flash-ng');void tray.offsetWidth;tray.classList.add(cls)}

/* ===== 進行 ===== */
function startGame(){
  audio();clearLater();cancelAnimationFrame(raf);
  round=0;results=[];
  $('title').hidden=true;$('end').hidden=true;
  nextRound();
}
function nextRound(){
  round++;input='';setDisp();answerEl.className='answer';disp.nextElementSibling.textContent='円';
  coinsEl.innerHTML='';banner.hidden=true;
  phaseEl.textContent='よーい…';phaseEl.className='phase';
  bar.className='bar';bar.style.transform='scaleX(1)';secs.textContent='5.0';
  state='ready';hud();setKeys();
  [3,2,1].forEach((n,i)=>later(()=>{big(n,'ready');SFX.ready()},i*READY_MS));
  later(startShow,3*READY_MS);
}
function startShow(){
  bignum.hidden=true;
  current=makeSet();layout(current);render(current,true);
  showBanner('よく見て！','look');
  phaseEl.textContent='合計はいくら？';phaseEl.className='phase';
  state='show';deadline=performance.now()+SHOW_MS;lastSec=5;bar.className='bar show';
  setKeys();loop();
}
function toInput(){
  coinsEl.classList.add('gone');SFX.vanish();
  showBanner('いくら？ 入力して決定！','hot');
  big(10);
  phaseEl.textContent='テンキーで入力';phaseEl.className='phase hot';
  state='input';deadline=performance.now()+INPUT_MS;lastSec=10;bar.className='bar input';
  setKeys();
}
function submit(timeout){
  if(state!=='input')return;
  cancelAnimationFrame(raf);
  const total=current.reduce((s,c)=>s+c.v,0);
  const ok=input!==''&&+input===total;
  results[round-1]=ok;state='result';
  bignum.hidden=true;
  coinsEl.classList.remove('gone');coinsEl.classList.add('back');labelCoins();
  answerEl.className='answer '+(ok?'ok':'ng');
  if(ok){
    showBanner('正解！','ok');SFX.correct();flashTray('flash-ok');
    const [x,y]=centerOf(tray);burst(x,y,60,'gold');const [ax,ay]=centerOf(disp);burst(ax,ay,24,'gold');
  }else{
    showBanner(timeout&&input===''?`時間切れ　正解は ${yen(total)}円`:`ざんねん　正解は ${yen(total)}円`,'ng');
    timeout&&input===''?SFX.timeup():SFX.wrong();flashTray('flash-ng');
  }
  const cnt={};current.forEach(c=>cnt[c.v]=(cnt[c.v]||0)+1);
  phaseEl.textContent=[500,100,50,10,5,1].filter(v=>cnt[v]).map(v=>`${v}円×${cnt[v]}`).join(' ');
  phaseEl.className='phase';
  if(input===''){disp.textContent='—';disp.classList.remove('empty')}
  bar.style.transform='scaleX(0)';
  hud();setKeys();
}
function finish(){
  state='end';clearLater();
  const okN=results.filter(Boolean).length;
  const prev=loadBest(level);const nb=okN>prev;if(nb)saveBest(level,okN);
  $('endlv').textContent=LEVELS[level].name+'・全5問';
  $('endok').textContent=okN;$('newbest').hidden=true;
  const st=$('stars');st.innerHTML='';
  for(let i=0;i<ROUNDS;i++){const s=document.createElement('span');s.className='star';s.textContent='★';st.appendChild(s)}
  const rk=$('rank');rk.textContent=RANKS[okN];rk.className='rank';
  rk.style.color=okN===5?'var(--brass)':okN>=3?'var(--ok)':'var(--ink)';
  banner.hidden=true;bignum.hidden=true;coinsEl.classList.add('dim');
  bar.style.transform='scaleX(0)';secs.textContent='';
  $('end').hidden=false;
  phaseEl.textContent='おつかれさま！';phaseEl.className='phase';
  input='';disp.textContent=okN;disp.classList.remove('empty');answerEl.className='answer';
  disp.nextElementSibling.textContent='問正解';
  for(let i=0;i<okN;i++) later(()=>{st.children[i].classList.add('on');SFX.star(i)},350+i*280);
  later(()=>{
    rk.classList.add('show');SFX.fanfare(okN>=3);
    if(nb) $('newbest').hidden=false;
    if(okN>=4) rain(okN===5?160:80);
    if(okN===5){const [x,y]=centerOf(tray);burst(x,y,80,'gold')}
  },450+okN*280);
  hud();setKeys();
}
function toTitle(){
  clearLater();cancelAnimationFrame(raf);
  state='title';results=[];round=0;
  $('end').hidden=true;$('title').hidden=false;banner.hidden=true;bignum.hidden=true;
  secs.textContent='5.0';bar.style.transform='scaleX(1)';bar.className='bar';
  input='';setDisp();answerEl.className='answer';disp.nextElementSibling.textContent='円';
  phaseEl.textContent='難易度を選んでスタート';phaseEl.className='phase';
  current=makeSet();layout(current);render(current,false);coinsEl.classList.add('dim');
  hud();setKeys();
}

function loop(){
  cancelAnimationFrame(raf);
  const step=()=>{
    const total=state==='show'?SHOW_MS:INPUT_MS;
    const left=Math.max(0,deadline-performance.now());
    bar.style.transform=`scaleX(${left/total})`;
    secs.textContent=(left/1000).toFixed(1);
    const sec=Math.ceil(left/1000);
    if(sec<lastSec&&sec>0){
      lastSec=sec;
      if(sec<=3) SFX.tick();
      if(state==='input') big(sec,sec<=3?'urgent':'');
    }
    if(state==='input')bar.className='bar '+(left<3000?'hurry':'input');
    if(left<=0){
      if(state==='show'){toInput();raf=requestAnimationFrame(step);return}
      if(state==='input'){submit(true);return}
    }
    if(state==='show'||state==='input')raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}

function press(k){
  if(k==='E'){
    if(state==='input')submit(false);
    else if(state==='result'){round>=ROUNDS?finish():nextRound()}
    return;
  }
  if(state!=='input')return;
  if(k==='C')input='';
  else if(k==='B')input=input.slice(0,-1);
  else if(input.length<5){input=(input==='0'?'':input)+k}
  SFX.key();setDisp(true);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)press(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('B');
  else if(e.key==='Escape'||e.key==='Delete')press('C');
  else if(e.key==='Enter'){
    if(state==='title'||state==='end'){ if(document.activeElement?.tagName!=='BUTTON') startGame(); }
    else {e.preventDefault();press('E')}
  }
});
document.querySelectorAll('.lv button').forEach(b=>b.addEventListener('click',()=>{
  level=+b.dataset.lv;audio();SFX.key();
  document.querySelectorAll('.lv button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  hud();
}));
$('start').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('back').addEventListener('click',toTitle);
$('sound').addEventListener('click',()=>{setMute(!muted);if(!muted){audio();SFX.tick()}});
// タイトルへ：誤タップ防止のため2回押しで確定
let quitArm=0;
$('quit').addEventListener('click',()=>{
  const q=$('quit');
  if(q.classList.contains('warn')){clearTimeout(quitArm);toTitle();return}
  q.classList.add('warn');q.textContent='もう一度でタイトルへ';
  quitArm=setTimeout(()=>{q.classList.remove('warn');q.textContent='タイトルへ'},2000);
});
window.addEventListener('resize',()=>{applyUnit();sizeFx()});
sizeFx();setMute(muted);

// タイトル画面の見本
requestAnimationFrame(()=>{current=makeSet();layout(current);render(current,false);coinsEl.classList.add('dim');hud();setKeys()});
</script>

</body></html>
