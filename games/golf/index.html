<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed 3D canvas, thin glass chips at the corners, one big swing button bottom-right */
:root{
  --ground:#9fd3f0;
  --chip:rgba(9,32,20,.44);
  --chip-line:rgba(255,255,255,.16);
  --text:#f6fbf2;
  --muted:rgba(246,251,242,.7);
  --accent:#ffd447;
  --flag:#e5483a;
  --under:#ffd447;
  --over:#8fd0ff;
  --panel:rgba(250,252,246,.94);
  --panel-ink:#173322;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground)}
body{font-family:var(--font);color:var(--text);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .3s}
.hud.off{opacity:0}
.hud.off *{pointer-events:none!important}
.chip{background:var(--chip);border:1px solid var(--chip-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:6px 11px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;line-height:1}
.top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lt{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.hole b{font-size:22px;font-weight:800}
.hole .col{display:flex;flex-direction:column;gap:3px}
.hole small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.hole span{font-size:13px;font-weight:800}
.wind svg{width:22px;height:22px;transition:transform .4s}
.wind span{font-size:14px;font-weight:800}
.rt{display:flex;gap:8px;align-items:center;margin-right:48px}
.stroke b{font-size:22px;font-weight:800}
.stroke small{font-size:11px;color:var(--muted)}
.icon{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--chip);border:1px solid var(--chip-line);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.icon svg{width:21px;height:21px}
.icon.on{background:rgba(255,212,71,.9);color:#2a2306}
.mm{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);border-radius:14px;border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(0,0,0,.28);background:#3a6e30;pointer-events:none}
.bottom{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bottom .club{justify-self:start}
.bottom #viewBtn{justify-self:end;width:56px;height:56px}
.bottom #viewBtn svg{width:24px;height:24px}
.club{pointer-events:auto;width:66px;height:66px;border-radius:18px;background:var(--chip);border:1px solid var(--chip-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.club b{font-size:22px;font-weight:800;line-height:1}
.club span{font-size:11px;color:var(--muted)}
.club:active,.icon:active{transform:scale(.94)}
.sw{position:relative;display:grid;place-items:center}
#shot{pointer-events:auto;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe5,var(--accent) 55%,#e0a813);box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 -4px 0 rgba(0,0,0,.12);display:grid;place-items:center;color:#3a2c04;transition:transform .12s}

#shot.hold{transform:scale(.92)}
#shot[disabled]{filter:grayscale(.7) brightness(.8)}
#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;pointer-events:auto;z-index:5}
#pauseBtn.gone{display:none}
/* PC layout */
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .top{left:20px;right:20px;top:calc(env(safe-area-inset-top,0px) + 18px)}

  .wind span{font-size:16px}
  .rt{margin-right:56px}
  #pauseBtn{top:calc(env(safe-area-inset-top,0px) + 18px);right:20px;width:48px;height:48px}
  .mm{right:20px;top:calc(env(safe-area-inset-top,0px) + 80px);border-radius:16px}
  .bottom{left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;gap:28px}
  .club{width:78px;height:78px;border-radius:20px}
  .club b{font-size:26px}
  #shot{width:110px;height:110px}

}
#pg{position:fixed;left:0;top:0;width:150px;height:16px;border-radius:9px;background:rgba(9,32,20,.55);border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.25);overflow:hidden;pointer-events:none;will-change:transform;opacity:0;transition:opacity .2s}

#banner.show{opacity:1;transform:scale(1)}
#banner b{display:block;font-size:clamp(34px,11vw,54px);font-weight:800;text-shadow:0 3px 0 rgba(10,40,20,.55),0 0 18px rgba(0,0,0,.25);letter-spacing:.03em;text-wrap:balance}
#banner span{display:inline-block;margin-top:10px;font-size:16px;font-weight:800;background:var(--chip);padding:6px 14px;border-radius:20px}
#banner.gold b{color:var(--under)}
#banner.blue b{color:var(--over)}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);text-align:center;font-size:14px;font-weight:800;pointer-events:none;transition:opacity .5s;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-inline:16px;text-align:center}
#title h1{margin:0;font-size:clamp(44px,14vw,76px);font-weight:800;line-height:1.05;text-shadow:0 4px 0 #2d6b3a,0 10px 30px rgba(0,0,0,.25);letter-spacing:.02em}
#title p{margin:0;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.btn{pointer-events:auto;background:var(--accent);color:#3a2c04;font-weight:800;font-size:20px;padding:14px 46px;border-radius:40px;box-shadow:0 6px 0 #c48f0b,0 10px 24px rgba(0,0,0,.25)}

.card h2{margin:0;font-size:22px}
.tot{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tot small{font-size:20px;margin-left:6px}
.sc{overflow-x:auto;max-width:100%}
.sc table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.sc th,.sc td{padding:5px 0;width:32px;text-align:center}
.sc th{font-weight:500;color:#5b7363;font-size:11px}
.sc tr+tr td{border-top:1px solid #dbe6dc}
.sc .m{display:inline-grid;place-items:center;width:24px;height:24px;font-weight:800}
.sc .u{border:2px solid #d48a00;border-radius:50%;color:#b06f00}

.sc .o{border:2px solid #3a87c2;color:#2a6c9e}

.best{font-size:13px;color:#5b7363}
.courses{display:flex;flex-direction:column;gap:12px;width:min(100%,340px)}
.course{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 rgba(23,51,34,.35),0 10px 24px rgba(0,0,0,.2)}
.course:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(23,51,34,.35)}
.course .no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.course b{display:block;font-size:17px}
.course small{display:block;font-size:12px;color:#5b7363;margin-top:3px;font-variant-numeric:tabular-nums}
.course .bs{font-size:12px;color:#5b7363;text-align:right;font-variant-numeric:tabular-nums}
.course .bs strong{display:block;font-size:20px;color:var(--panel-ink)}
#pause{background:rgba(12,34,22,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10}
#pause .card{gap:12px;width:min(100%,300px)}
#pause .btn{width:100%;padding-inline:0}
.btn.sub{background:#e6eee5;color:var(--panel-ink);box-shadow:0 6px 0 #b9c9ba,0 10px 24px rgba(0,0,0,.15)}
.btn.sub:active{box-shadow:0 2px 0 #b9c9ba}
.pc{font-size:13px;color:#5b7363;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#banner{transition:opacity .2s}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);

/* ================= SOUND ================= */
const Snd=(()=>{
  let ctx=null,master,nb,ap,muted=false,ambG=null,chO=null,chG=null,birdT=null,wind=0;
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=muted?0:.85; master.connect(ctx.destination);
    nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // applause buffer
    const L=ctx.sampleRate*2.6; ap=ctx.createBuffer(1,L,ctx.sampleRate); const a=ap.getChannelData(0);
    for(let k=0;k<520;k++){const st=Math.floor(Math.random()*(L-2000)); const len=Math.floor(ctx.sampleRate*(.008+Math.random()*.01)); const amp=.25+Math.random()*.4; for(let i=0;i<len;i++)a[st+i]+=(Math.random()*2-1)*amp*Math.exp(-i/len*4)}
    ambient(); birds();
  }
  function noise(dur,o={}){
    if(!ctx)return; const {type='lowpass',f=1000,f2=null,q=1,vol=.4,attack=.005,t0=0,buf=nb}=o; const t=ctx.currentTime+t0;
    const s=ctx.createBufferSource(); s.buffer=buf;
    const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(master); s.start(t,buf===nb?Math.random()*1.2:0); s.stop(t+dur+.05);
  }
  function tone(f,dur,o={}){
    if(!ctx)return; const {type='sine',vol=.25,f2=null,t0=0,attack=.004}=o; const t=ctx.currentTime+t0;
    const os=ctx.createOscillator(); os.type=type; os.frequency.setValueAtTime(f,t); if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    os.connect(g);g.connect(master); os.start(t); os.stop(t+dur+.05);
  }
  function ambient(){
    const s=ctx.createBufferSource(); s.buffer=nb; s.loop=true;
    const fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=380;
    ambG=ctx.createGain(); ambG.gain.value=.04;
    const lfo=ctx.createOscillator(); lfo.frequency.value=.13; const lg=ctx.createGain(); lg.gain.value=.025; lfo.connect(lg); lg.connect(ambG.gain);
    s.connect(fl);fl.connect(ambG);ambG.connect(master); s.start(); lfo.start(); setWind(wind);
  }
  function birds(){
    const go=()=>{ birdT=setTimeout(go,3500+Math.random()*6000); if(!ctx||ctx.state!=='running')return;
      const n=2+Math.floor(Math.random()*3), b=2400+Math.random()*900;
      for(let k=0;k<n;k++)tone(b+Math.random()*200,.07,{f2:b*1.35,vol:.035,t0:k*.13});
    }; go();
  }
  function setWind(w){wind=w; if(ambG)ambG.gain.setTargetAtTime(.03+w*.018,ctx.currentTime,.5)}
  return{
    init, setWind,
    toggle(){muted=!muted; if(master)master.gain.setTargetAtTime(muted?0:.85,ctx.currentTime,.03); return muted},
    ui(){tone(880,.05,{type:'triangle',vol:.12})},
    whoosh(p){noise(.3,{type:'bandpass',f:450,f2:2600,q:1.4,vol:.18+.3*p,attack:.16})},
    hit(putt,p){
      if(putt){tone(1150,.06,{type:'triangle',vol:.12+.18*p});tone(430,.09,{vol:.14})}
      else{noise(.05,{type:'bandpass',f:3600,q:.8,vol:.35+.4*p});tone(1900,.07,{f2:700,vol:.22});tone(150,.13,{f2:55,vol:.25+.3*p})}
    },
    land(s,k){
      if(s===4){noise(.38,{type:'bandpass',f:2300,q:.6,vol:.35,attack:.01});noise(.15,{f:300,vol:.25})}
      else if(s===3){noise(.07,{f:700,vol:.22*k+.04});tone(170,.07,{vol:.16*k+.03})}
      else{noise(.12,{f:340,vol:.32*k+.05});tone(95,.11,{f2:50,vol:.28*k+.04})}
    },
    splash(){noise(.75,{f:3800,f2:240,vol:.55,attack:.01});for(let i=0;i<6;i++){const f=300+Math.random()*500;tone(f,.07,{f2:f*1.9,vol:.09,t0:.18+i*.08})}},
    cup(){tone(620,.05,{type:'triangle',vol:.35});tone(430,.06,{type:'triangle',vol:.3,t0:.09});tone(330,.09,{type:'triangle',vol:.3,t0:.18});noise(.18,{type:'bandpass',f:1600,vol:.12,t0:.05})},
    lip(){tone(950,.05,{type:'triangle',vol:.2});tone(700,.05,{type:'triangle',vol:.12,t0:.05})},
    tree(){tone(260,.09,{f2:170,type:'triangle',vol:.28});noise(.4,{type:'highpass',f:2600,vol:.18,attack:.03})},
    ob(){tone(240,.4,{type:'sawtooth',f2:110,vol:.1});tone(180,.4,{type:'square',f2:90,vol:.05,t0:.05})},
    fanfare(rel,ace){
      let notes,type='triangle';
      if(ace)notes=[523,659,784,1047,784,1047,1319,1568];
      else if(rel<=-2)notes=[523,659,784,1047,1319];
      else if(rel===-1)notes=[587,740,880,1175];
      else if(rel===0)notes=[523,659,784];
      else{notes=[392,349,294];type='square'}
      notes.forEach((f,i)=>{tone(f,.22,{type,vol:type==='square'?.05:.18,t0:i*.11});tone(f/2,.22,{type:'sine',vol:.08,t0:i*.11})});
      if(rel<=-1||ace)noise(2.4,{type:'bandpass',f:2400,q:.5,vol:.5,attack:.25,t0:.25,buf:ap});
    },
    chargeStart(){if(!ctx)return;chO=ctx.createOscillator();chO.type='triangle';chG=ctx.createGain();chG.gain.value=.05;chO.connect(chG);chG.connect(master);chO.frequency.value=260;chO.start()},
    charge(p){if(chO)chO.frequency.setTargetAtTime(260+p*620,ctx.currentTime,.02)},
    chargeStop(){if(chO){chG.gain.setTargetAtTime(0,ctx.currentTime,.02);chO.stop(ctx.currentTime+.1);chO=null}}
  };
})();

/* ================= COURSE ================= */
const ROUGH=0,FAIR=1,FRINGE=2,GREEN=3,SAND=4,WATER=5,OB=6,TEE=7;
const SURF=[{rest:.2,hk:.45,fr:8},{rest:.3,hk:.45,fr:5},{rest:.3,hk:.45,fr:5.5},{rest:.2,hk:.5,fr:1.3},{rest:.05,hk:.15,fr:25},null,null,{rest:.3,hk:.45,fr:5}];
const HOLES=[
 {par:4,fw:[[0,-25],[0,-140],[8,-230],[12,-290]],w:24,pin:[12,-305],gR:13,bunk:[[-14,-175,7,5],[26,-292,6,8],[-2,-324,7,4]],water:[],slope:[.35,.15]},
 {par:3,fw:[[0,-118],[2,-135]],w:14,pin:[2,-158],gR:12,bunk:[[-16,-160,5,6],[18,-150,5,5],[4,-177,8,4]],water:[[0,-85,32,22]],slope:[-.3,.35]},

/* ---- physics ---- */

      emit(ball,14,{color:t.au>=0?[0xe0892e,0xd8b23a]:[0x3a8a42,0x5aa64a],speed:3,spread:1,up:1,size:.14,life:1.4,grav:3})}
  }
}
function groundContact(){
  const s=surfaceAt(H,ball.x,ball.z);

  const P=SURF[s],spin=1-CLUBS[shotClub].ang/110,imp=-vel.y,k=P.hk*spin;
  if(imp>1.5){vel.y=imp*P.rest;vel.x*=k;vel.z*=k;Snd.land(s,Math.min(1,imp/15));
    if(s===SAND)emit(ball,26,{color:[0xe9d7a2,0xd8c48a],speed:3,spread:1,up:4,size:.17,life:.9,grav:9.8});
    else if(imp>6)emit(ball,6,{color:[0x5aa64a,0x7cc06a],speed:2,spread:1,up:2.5,size:.09,life:.5,grav:9.8})}

function rollStep(dt){

  if(s===GREEN){vel.x+=H.slope[0]*dt;vel.z+=H.slope[1]*dt}
  ball.y=R;if(Math.hypot(vel.x,vel.z)<.05){vel.set(0,0,0);stopped()}
}
function physStep(dt){
  if(!rolling){vel.y-=G*dt;vel.x+=wind.x*dt;vel.z+=wind.z*dt}

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),dPos=new THREE.Vector3(),dLook=new THREE.Vector3(),travel=new THREE.Vector3(0,0,-1);

function aimTargets(){
  const dx=Math.sin(aimA),dz=-Math.cos(aimA),c=CLUBS[clubIdx];
  if(overView){const px=H.pin[0],pz=H.pin[1],mx=(ball.x+px)/2,mz=(ball.z+pz)/2,d=Math.max(30,distPin());dPos.set(mx-dx*d*.35,d*.8+20,mz-dz*d*.35);dLook.set(mx,0,mz);return}

function updCam(dt,t){

});
addEventListener('keyup',e=>{if(e.code==='Space')releaseCharge()});
function startCourse(ci){course=COURSES[ci];Snd.init();Snd.ui();$('title').hidden=true;$('end').hidden=true;scores=[];$('pauseBtn').classList.remove('gone');startHole(course.s)}
function renderCourses(){
  $('courses').innerHTML=COURSES.map((c,i)=>{let b=null;try{b=localStorage.getItem('soyokaze-best-'+i)}catch(e){}
    const rel=b?b-c.par:null;
    return `<button class="course" data-i="${i}"><span class="no" style="background:${c.col}">${i+1}</span><span><b>${c.name}</b><small>3ホール ・ PAR ${c.par} ・ ${c.len}y</small></span><span class="bs">${b?`ベスト<strong>${b}</strong>`:''}</span></button>`}).join('');
  $('courses').querySelectorAll('.course').forEach(el=>el.addEventListener('click',()=>startCourse(+el.dataset.i)));
}
function setHint(){$('hint').innerHTML=isPC()?'ドラッグ / ←→ で方向<br>スペース長押しでパワー、離してショット':'← ドラッグで方向 →<br>ボタン長押しでパワー、離してショット'}
setHint();renderCourses();
$('againBtn').addEventListener('click',()=>startCourse(COURSES.indexOf(course)));
addEventListener('keydown',e=>{if(e.code==='Escape'&&state!=='title'&&state!=='end')setPause(!paused)});

/* ---- loop ---- */
buildHole(0);ball.set(0,R,0);
let last=performance.now(),acc=0,tt=0,trailT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(paused){last=now;ren.render(scene,cam);return}
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;stateT+=dt;
  if(state==='charge'){chargeT+=dt;const x=(chargeT/.8)%2;power=x<1?x:2-x;Snd.charge(power);setGauge(power)}
  if(state==='swing'){timer-=dt;if(timer<=0)launch()}
  if(state==='fly'){acc+=dt;const h=1/240;while(acc>=h&&state==='fly'){physStep(h);acc-=h}
    trailT+=dt;if(trailT>.035&&!rolling){trailT=0;trailPts.push(ball.clone());if(trailPts.length>TRN)trailPts.shift()}
    if(Math.random()<.2)$('hDist').textContent=Math.round(distPin())+'y'}
  else acc=0;
  if(state==='settle'){timer-=dt;if(timer<=0){if(strokes>=H.par+5)giveUp();else prepareShot()}}
  if(state==='penalty'){timer-=dt;if(timer<=0){ball.copy(lastPos);ballMesh.visible=true;if(strokes>=H.par+5)giveUp();else{prepareShot();lie=surfaceAt(H,ball.x,ball.z);if(strokes===1&&lie===FAIR&&Math.abs(ball.x)<5&&Math.abs(ball.z)<4)lie=TEE;updHud()}}}
  if(state==='holed'){timer-=dt;if(holedReal&&ball.y>-.5){ball.x+=(H.pin[0]-ball.x)*.3;ball.z+=(H.pin[1]-ball.z)*.3;ball.y=Math.max(-.5,ball.y-dt*3)}if(timer<=0)nextHole()}
  if(state==='aim'&&gaugeV)setGauge(0);
  if(state!=='fly'&&state!=='settle')trailPts.length&&state!=='penalty'&&(trailPts.length=0);

  ballMesh.position.copy(ball);ballMesh.rotation.x-=Math.hypot(vel.x,vel.z)*dt/R*.5;
  updPreview(state==='charge'?power:1);
  // trail
  for(let i=0;i<TRN;i++){const p=trailPts[i];if(p){dummy.position.copy(p);dummy.scale.setScalar(.4+i/TRN*.9)}else dummy.scale.setScalar(0);dummy.updateMatrix();trail.setMatrixAt(i,dummy.matrix)}trail.instanceMatrix.needsUpdate=true;
  // flag
  if(flagGeo){const a=flagGeo.attributes.position;for(let i=0;i<a.count;i++){const x=flagBaseX[i*3];a.array[i*3+2]=Math.sin(x*3-tt*(4+windSpd*1.5))*.13*x;a.array[i*3]=x*(1-(.05-windSpd*.01))}a.needsUpdate=true;flagGeo.computeVertexNormals();
    flagMesh.rotation.y=windSpd?Math.atan2(-wind.z,wind.x):-.6;}
  clouds.rotation.y+=dt*.004;
  updParts(dt);updCam(dt,tt);updWindArrow();updPG();if(state!=='title')mmDraw();
  sky.position.copy(cam.position);
  const sc=state==='title'?Math.max(H.b.x1-H.b.x0,H.b.z1-H.b.z0)*.6:30;
  if(sun.shadow.camera.right!==sc){Object.assign(sun.shadow.camera,{left:-sc,right:sc,top:sc,bottom:-sc,far:sc*4+200});sun.shadow.camera.updateProjectionMatrix()}
  const fx=state==='title'?(H.b.x0+H.b.x1)/2:Math.round(ball.x*2)/2,fz=state==='title'?(H.b.z0+H.b.z1)/2:Math.round(ball.z*2)/2,sd=sc*2+60;
  sun.target.position.set(fx,0,fz);sun.position.set(fx+sunDir.x*sd,sunDir.y*sd,fz+sunDir.z*sd);
  ren.render(scene,cam);
}
requestAnimationFrame(frame);
})();
</script>
