<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ミチつなぎ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* レイアウト: ヘッダー(ステージ/手数) + 盤面キャンバス + フッター(音/やり直し)。ネイビーの夜に琥珀色の光が流れる */
:root{
  --bg:#0d1220;
  --panel:#151c30;
  --line:#2a3555;
  --fg:#e9edf7;
  --dim:#7d8aab;
  --amber:#ffb840;
  --amber-soft:#3a2d17;
  --mint:#5fd6c2;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-inline:16px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:640px;margin-inline:auto;position:relative}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
header{padding-top:10px}
footer{padding-bottom:12px;justify-content:center;gap:20px}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.pill{
  display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;
  background:var(--panel);border:1px solid var(--line);font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.pill svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stageBtn:active{background:var(--line)}
.round{
  width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;
}
.round:active{background:var(--line)}
.round svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.round.off svg{stroke:var(--dim)}
#stage{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#win{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:36px;z-index:3;
  background:rgba(21,28,48,.94);border:1px solid var(--line);
  box-shadow:0 8px 32px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes rise{from{opacity:0;transform:translate(-50%,-30%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.clear-time{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:92px;text-align:center}
.clear-time.best{color:var(--amber);text-shadow:0 0 12px rgba(255,184,64,.55)}
#timeNum{min-width:3.6em;text-align:right}
.go{
  width:56px;height:56px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  box-shadow:0 0 18px rgba(255,184,64,.45);
}
.go svg{width:26px;height:26px;fill:#2a1c05}
.go:active{transform:scale(.94)}
#picker{
  position:absolute;inset:0;background:rgba(7,10,20,.88);display:flex;align-items:center;justify-content:center;
  z-index:5;padding:16px;
}
#grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:420px;
  max-height:100%;overflow-y:auto;padding:4px;
}
.cell{
  aspect-ratio:1;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:20px;font-weight:700;min-width:0;
}
.cell small{font-size:10px;color:var(--amber);height:12px;line-height:12px;font-variant-numeric:tabular-nums}
.cell.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.cell:disabled{opacity:.32;cursor:default}
.cell:not(:disabled):active{background:var(--line)}
#pause{position:absolute;inset:0;background:rgba(13,18,32,.96);display:grid;place-items:center;z-index:4;border-radius:20px}
#pause .go{width:88px;height:88px}
#pause .go svg{width:40px;height:40px}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#win{animation:none}}
</style>

<div id="app">
  <header>
    <button id="stageBtn" class="pill" aria-label="ステージ選択">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      <span id="stageNum">1</span>
    </button>
    <div class="pill" aria-label="タイム">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5l2.8 1.7"/><path d="M9.5 2.5h5"/></svg>
      <span id="timeNum">00:00</span>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="pause" hidden>
      <button id="resumeBtn" class="go" aria-label="再開"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    </div>
    <div id="win" hidden>
      <div class="clear-time" id="clearTime">00:00.0</div>
      <button id="nextBtn" class="go" aria-label="次のステージ"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    </div>
  </main>
  <footer>
    <button id="sndBtn" class="round" aria-label="サウンド切り替え"></button>
    <button id="pauseBtn" class="round" aria-label="ポーズ">
      <svg viewBox="0 0 24 24"><path d="M8.5 5v14"/><path d="M15.5 5v14"/></svg>
    </button>
    <button id="rstBtn" class="round" aria-label="やり直し">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
    </button>
  </footer>
  <div id="picker" hidden><div id="grid"></div></div>
</div>

<script>
(() => {
'use strict';
const DIRS=[{b:1,dx:0,dy:-1},{b:2,dx:1,dy:0},{b:4,dx:0,dy:1},{b:8,dx:-1,dy:0}];
const rotM=(m,r)=>{for(let i=0;i<(r&3);i++)m=((m<<1)&15)|(m>>3);return m;};
const opp=b=>((b<<2)&15)|(b>>2);
const STAGES=60;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- 保存 ---------- */
const KEY='michitsunagi-v1';
let save={max:1,best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.max){save=s;if(!save.best)save.best={};}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false;
try{muted=localStorage.getItem(KEY+'-mute')==='1';}catch(e){}

/* ---------- 色 ---------- */
const UNLIT=[88,104,140], LIT=[255,184,64];
const TBG=[24,31,48], TBG_LIT=[46,38,26];
const mix=(a,b,t)=>`rgb(${(a[0]+(b[0]-a[0])*t)|0},${(a[1]+(b[1]-a[1])*t)|0},${(a[2]+(b[2]-a[2])*t)|0})`;

/* ---------- 音 ---------- */
let ac=null,master=null,sfx=null,bgm=null,bgmTimer=null,nextT=0,step=0;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();
  master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);
  sfx=ac.createGain();sfx.gain.value=0.75;sfx.connect(master);
  bgm=ac.createGain();bgm.gain.value=0.32;bgm.connect(master);
  nextT=ac.currentTime+0.2;step=0;
  bgmTimer=setInterval(()=>{
    if(!ac||ac.state!=='running'||muted)return;
    if(nextT<ac.currentTime)nextT=ac.currentTime+0.05;
    while(nextT<ac.currentTime+0.45){playStep(nextT,step);nextT+=0.42;step++;}
  },120);
}
function toneAt(f,t,dur,type,vol,out,slide){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.03);
}
function tone(f,dur,o={}){
  if(!ac||muted)return;
  toneAt(f,ac.currentTime+(o.when||0),dur,o.type||'sine',o.vol||0.2,sfx,o.slide);
}
const PENT=[0,2,4,7,9,12,14,16,19,21,24];
const hz=(base,semi)=>base*Math.pow(2,semi/12);
function sndRotate(){tone(260,0.07,{type:'triangle',vol:0.3,slide:0.55});tone(1100,0.025,{type:'square',vol:0.035});}
function sndConnect(n){
  const f=hz(392,PENT[Math.min(Math.max(n-2,0),PENT.length-1)]);
  tone(f,0.55,{vol:0.24});tone(f*2,0.4,{vol:0.07,when:0.03});tone(f*1.5,0.5,{vol:0.05,when:0.09});
}
function sndCut(){tone(190,0.2,{type:'sawtooth',vol:0.05,slide:0.5});}
function sndClear(){
  const seq=[0,4,7,12,16,19,24];
  seq.forEach((s,i)=>{tone(hz(523.25,s),0.7,{vol:0.2,when:i*0.085});tone(hz(523.25,s)*2,0.5,{vol:0.05,when:i*0.085+0.02});});
  tone(hz(523.25,0),1.4,{type:'triangle',vol:0.12,when:0.6});
  tone(hz(523.25,7),1.4,{type:'triangle',vol:0.1,when:0.6});
  tone(hz(523.25,12),1.4,{type:'triangle',vol:0.1,when:0.6});
}
function sndPop(){tone(660,0.1,{vol:0.12,slide:1.5});}
const ROOTS=[110,87.31,130.81,98];
const CHORDS=[[0,3,7],[0,4,7],[0,4,7],[0,4,7]];
const PAT=[0,1,2,1,2,1,0,1];
function playStep(t,s){
  const bar=Math.floor(s/8)%4,root=ROOTS[bar],ch=CHORDS[bar],k=s%8;
  if(k===0)toneAt(root,t,1.7,'sine',0.2,bgm);
  if(k===4)toneAt(root*1.5,t,0.9,'sine',0.08,bgm);
  toneAt(hz(root*2,ch[PAT[k]]),t,0.55,'triangle',0.1,bgm);
  if(Math.random()<0.28)toneAt(hz(root*4,ch[Math.floor(Math.random()*3)]),t+0.21,0.45,'sine',0.045,bgm);
}
document.addEventListener('visibilitychange',()=>{
  if(!ac)return;
  if(document.hidden)ac.suspend();else ac.resume();
});

/* ---------- ステージ生成 ---------- */
function sizeFor(n){
  const tier=Math.floor((n-1)/3);
  const cols=Math.min(3+tier,7);
  const rows=cols<4?cols:Math.min(cols+1,8);
  return{cols,rows};
}
function generate(n){
  const {cols,rows}=sizeFor(n),N=cols*rows;
  const rng=mulberry32((n*2654435761)>>>0^0x9e3779b9);
  const base=new Array(N).fill(0),vis=new Array(N).fill(false);
  const src=Math.floor(rng()*N);
  const active=[src];vis[src]=true;
  while(active.length){
    const idx=rng()<0.5?active.length-1:Math.floor(rng()*active.length);
    const c=active[idx],x=c%cols,y=(c/cols)|0,opts=[];
    for(const d of DIRS){
      const nx=x+d.dx,ny=y+d.dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows)continue;
      const ni=ny*cols+nx;if(!vis[ni])opts.push([d,ni]);
    }
    if(!opts.length){active.splice(idx,1);continue;}
    const [d,ni]=opts[Math.floor(rng()*opts.length)];
    base[c]|=d.b;base[ni]|=opp(d.b);vis[ni]=true;active.push(ni);
  }
  // 輪っかになる道を足す
  const extra=Math.min(Math.floor((n-1)/4),Math.floor(N/5));
  if(extra>0){
    const cand=[];
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const c=y*cols+x;
      if(x+1<cols&&!(base[c]&2))cand.push([c,c+1,2]);
      if(y+1<rows&&!(base[c]&4))cand.push([c,c+cols,4]);
    }
    for(let i=cand.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]];}
    for(let i=0;i<extra&&i<cand.length;i++){const [a,b,bit]=cand[i];base[a]|=bit;base[b]|=opp(bit);}
  }
  const ks=new Array(N);
  let tries=0;
  do{
    for(let i=0;i<N;i++)ks[i]=Math.floor(rng()*4);
    tries++;
  }while(tries<20&&ks.every((k,i)=>rotM(base[i],k)===base[i]));
  return{cols,rows,N,src,base,ks};
}

/* ---------- 状態 ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let stage=1,L=null,tiles=[],moves=0,solved=false,litCount=0,elapsed=0,running=false,paused=false,lastShown='';
let W=0,H=0,dpr=1,cs=40,ox=0,oy=0,particles=[],winTimer=null,now=0;

function fmt(sec,tenth){
  const m=Math.floor(sec/60),r=sec-m*60,w=Math.floor(r);
  let o=String(Math.min(m,99)).padStart(2,'0')+':'+String(w).padStart(2,'0');
  if(tenth)o+='.'+Math.floor((r-w)*10);
  return o;
}
function showTime(){
  const v=fmt(elapsed,false);
  if(v!==lastShown){lastShown=v;$('timeNum').textContent=v;}
}
function maskOf(t){return rotM(t.base,t.k&3);}

function evalBoard(){
  const {cols,rows,N,src}=L;
  const dist=new Array(N).fill(-1);
  let matched=true;
  const masks=tiles.map(maskOf);
  for(let c=0;c<N;c++){
    const x=c%cols,y=(c/cols)|0;
    for(const d of DIRS){
      if(!(masks[c]&d.b))continue;
      const nx=x+d.dx,ny=y+d.dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows||!(masks[ny*cols+nx]&opp(d.b)))matched=false;
    }
  }
  const q=[src];dist[src]=0;let count=1;
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi],x=c%cols,y=(c/cols)|0;
    for(const d of DIRS){
      if(!(masks[c]&d.b))continue;
      const nx=x+d.dx,ny=y+d.dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows)continue;
      const ni=ny*cols+nx;
      if(dist[ni]>=0||!(masks[ni]&opp(d.b)))continue;
      dist[ni]=dist[c]+1;count++;q.push(ni);
    }
  }
  return{dist,count,solved:matched&&count===N};
}
function applyLit(ev,instant){
  tiles.forEach((t,i)=>{
    if(ev.dist[i]>=0){
      if(!t.litT){t.litT=true;t.litAt=now+(instant?0:ev.dist[i]*55);}
    }else t.litT=false;
  });
  litCount=ev.count;
}

function layout(){
  if(!L||!W)return;
  const pad=6;
  cs=Math.floor(Math.min((W-pad*2)/L.cols,(H-pad*2)/L.rows,112));
  ox=Math.round((W-cs*L.cols)/2);oy=Math.round((H-cs*L.rows)/2);
}
function fit(){
  const r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  layout();
}

function loadStage(n){
  stage=Math.max(1,Math.min(STAGES,n));
  L=generate(stage);
  moves=0;solved=false;particles=[];
  clearTimeout(winTimer);
  $('win').hidden=true;
  const t0=performance.now();
  tiles=L.base.map((b,i)=>{
    const x=i%L.cols,y=(i/L.cols)|0;
    return{base:b,k:L.ks[i],ang:L.ks[i]*Math.PI/2,target:L.ks[i]*Math.PI/2,lit:0,litT:false,litAt:0,appear:t0+(x+y)*45+60};
  });
  elapsed=0;running=true;paused=false;$('pause').hidden=true;lastShown='';
  now=t0;
  applyLit(evalBoard(),true);
  tiles[L.src].lit=1;
  $('stageNum').textContent=stage;
  showTime();
  layout();
  sndPop();
}

function tap(i){
  if(solved||paused||!L)return;
  const t=tiles[i];
  t.k++;t.target+=Math.PI/2;moves++;
  const prev=litCount;
  const ev=evalBoard();
  applyLit(ev,false);
  if(ev.solved){
    sndRotate();
    win();
  }else if(ev.count>prev){sndRotate();sndConnect(ev.count);}
  else if(ev.count<prev){sndRotate();sndCut();}
  else sndRotate();
  try{navigator.vibrate&&navigator.vibrate(ev.count>prev?14:7);}catch(e){}
}

function win(){
  solved=true;
  setTimeout(sndClear,260);
  running=false;showTime();
  const prevBest=save.best[stage];
  const isBest=prevBest===undefined||elapsed<prevBest;
  if(isBest)save.best[stage]=elapsed;
  if(stage+1>save.max)save.max=Math.min(STAGES,stage+1);
  store();
  // 紙吹雪
  const cx=ox+cs*L.cols/2,cy=oy+cs*L.rows/2,cols=['#ffb840','#5fd6c2','#ff7a9c','#fff1c9','#8ab4ff'];
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2,sp=120+Math.random()*340;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:1.2+Math.random()*0.9,age:0,
      s:3+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*12});
  }
  winTimer=setTimeout(()=>{
    const ct=$('clearTime');ct.textContent=fmt(elapsed,false);ct.classList.toggle('best',isBest);
    $('win').hidden=false;
  },950);
}

/* ---------- 描画 ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
const easeBack=t=>{const c=1.70158+1;return 1+c*Math.pow(t-1,3)+(c-1)*Math.pow(t-1,2);};

function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!L)return;
  const lw=cs*0.2,gap=Math.max(2,cs*0.045);
  // 盤面の土台
  ctx.fillStyle='rgb(16,21,36)';
  rr(ox-4,oy-4,cs*L.cols+8,cs*L.rows+8,cs*0.2);ctx.fill();
  const hintOn=stage===1&&moves===0;
  let hinted=false;
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i],x=i%L.cols,y=(i/L.cols)|0;
    // アニメ更新
    t.ang+=(t.target-t.ang)*(1-Math.exp(-dt*20));
    if(Math.abs(t.target-t.ang)<0.002)t.ang=t.target;
    if(t.litT&&now>=t.litAt)t.lit=Math.min(1,t.lit+dt*7);
    else if(!t.litT)t.lit=Math.max(0,t.lit-dt*9);
    const ap=Math.min(1,Math.max(0,(now-t.appear)/340));
    if(ap<=0)continue;
    const sc=easeBack(ap);
    const la=t.lit;
    const cx=ox+x*cs+cs/2,cy=oy+y*cs+cs/2;
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(sc,sc);
    // タイル
    ctx.fillStyle=mix(TBG,TBG_LIT,la);
    rr(-cs/2+gap,-cs/2+gap,cs-gap*2,cs-gap*2,cs*0.16);ctx.fill();
    // 道
    ctx.rotate(t.ang);
    const col=mix(UNLIT,LIT,la);
    const bits=DIRS.filter(d=>t.base&d.b);
    const path=()=>{ctx.beginPath();for(const d of bits){ctx.moveTo(0,0);ctx.lineTo(d.dx*cs/2,d.dy*cs/2);}};
    if(la>0.02){
      ctx.globalAlpha=0.2*la;ctx.strokeStyle=mix(UNLIT,LIT,1);ctx.lineWidth=lw*2.3;ctx.lineCap='butt';path();ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,lw*1.15,0,7);ctx.fillStyle=mix(UNLIT,LIT,1);ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='butt';path();ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,lw/2,0,7);ctx.fill();
    // 行き止まりのランプ
    if(bits.length===1){
      ctx.beginPath();ctx.arc(0,0,lw*0.95,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,lw*0.42,0,7);
      ctx.fillStyle=`rgba(255,246,214,${0.25+0.7*la})`;ctx.fill();
    }
    ctx.rotate(-t.ang);
    // 光源
    if(i===L.src){
      const p=0.5+0.5*Math.sin(now/260);
      ctx.beginPath();ctx.arc(0,0,cs*0.3+p*cs*0.03,0,7);
      ctx.strokeStyle=`rgba(255,184,64,${0.45+0.4*p})`;ctx.lineWidth=Math.max(2,cs*0.045);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,lw*0.95,0,7);ctx.fillStyle='#fff1c9';ctx.fill();
      ctx.beginPath();ctx.arc(0,0,lw*1.9,0,7);ctx.fillStyle='rgba(255,184,64,0.16)';ctx.fill();
    }
    // 最初のヒント
    if(hintOn&&!hinted&&maskOf(t)!==t.base&&ap>=1){
      hinted=true;
      const p=0.5+0.5*Math.sin(now/230);
      ctx.strokeStyle=`rgba(95,214,194,${0.35+0.55*p})`;ctx.lineWidth=3;
      rr(-cs/2+gap,-cs/2+gap,cs-gap*2,cs-gap*2,cs*0.16);ctx.stroke();
    }
    ctx.restore();
  }
  // 紙吹雪
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue;}
    p.vy+=620*dt;p.vx*=0.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=Math.min(1,(p.life-p.age)*2);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
    ctx.restore();
  }
}
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;now=t;
  if(running&&!solved&&!paused&&$('picker').hidden){elapsed+=dt;showTime();}
  draw(dt);
  requestAnimationFrame(frame);
}

/* ---------- 入力・UI ---------- */
cv.addEventListener('pointerdown',e=>{
  initAudio();
  if(!L)return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left-ox,y=e.clientY-r.top-oy;
  if(x<0||y<0)return;
  const cx=Math.floor(x/cs),cy=Math.floor(y/cs);
  if(cx>=L.cols||cy>=L.rows)return;
  e.preventDefault();
  tap(cy*L.cols+cx);
});
const SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></svg>';
function paintSnd(){const b=$('sndBtn');b.innerHTML=muted?SND_OFF:SND_ON;b.classList.toggle('off',muted);}
$('sndBtn').addEventListener('click',()=>{
  initAudio();
  muted=!muted;
  try{localStorage.setItem(KEY+'-mute',muted?'1':'0');}catch(e){}
  if(master)master.gain.setTargetAtTime(muted?0:0.9,ac.currentTime,0.05);
  if(!muted&&ac){nextT=ac.currentTime+0.1;sndPop();}
  paintSnd();
});
function setPause(v){
  if(solved)return;
  paused=v;$('pause').hidden=!v;
  if(!v)sndPop();
}
$('pauseBtn').addEventListener('click',()=>{initAudio();setPause(true);});
$('resumeBtn').addEventListener('click',()=>{initAudio();setPause(false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!solved&&L)setPause(true);});
$('rstBtn').addEventListener('click',()=>{initAudio();loadStage(stage);});
$('nextBtn').addEventListener('click',()=>{initAudio();loadStage(stage>=STAGES?1:stage+1);});
function openPicker(){
  initAudio();
  const g=$('grid');g.innerHTML='';
  for(let n=1;n<=STAGES;n++){
    const b=document.createElement('button');
    b.className='cell'+(n===stage?' cur':'');
    const bt=save.best[n];
    b.innerHTML=`<span>${n}</span><small>${bt===undefined?'':fmt(bt,false)}</small>`;
    b.setAttribute('aria-label','ステージ'+n);
    if(n>save.max)b.disabled=true;
    b.addEventListener('click',()=>{$('picker').hidden=true;loadStage(n);});
    g.appendChild(b);
  }
  $('picker').hidden=false;
}
$('stageBtn').addEventListener('click',openPicker);
$('picker').addEventListener('click',e=>{if(e.target===$('picker'))$('picker').hidden=true;});
document.addEventListener('contextmenu',e=>e.preventDefault());

paintSnd();
new ResizeObserver(fit).observe(cv);
fit();
loadStage(Math.min(save.max,STAGES));
requestAnimationFrame(frame);
})();
</script>
