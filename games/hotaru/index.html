<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ホタル迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen arcade cabinet — slim HUD strip above a centered maze canvas, night-forest palette */
:root{
  --bg:#060913;
  --panel:#0d1224;
  --ink:#eef1ff;
  --dim:#7f88b3;
  --glow:#d8ff5e;
  --warm:#ffe6a8;
  --font:'DotGothic16','Hiragino Sans','Noto Sans JP',monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
#hud{display:flex;align-items:center;gap:14px;padding-block:10px 8px;font-variant-numeric:tabular-nums}
#score{font-size:22px;letter-spacing:.04em;min-width:0}
#stageNo{font-size:13px;color:var(--dim);letter-spacing:.12em}
#lives{display:flex;gap:6px;margin-left:auto}
.life{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fbffd6,var(--glow) 55%,#6f9400);box-shadow:0 0 7px var(--glow)}
#mute{width:36px;height:36px;border:0;border-radius:10px;background:var(--panel);color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
#mute:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#mute svg{width:20px;height:20px}
#mute .x{display:none}
#mute.off .x{display:block}
#mute.off .w{display:none}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding-block:0 14px}
canvas{display:block;max-width:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.ttl{font-size:46px;color:var(--glow);letter-spacing:.08em;text-shadow:0 0 18px color-mix(in srgb,var(--glow) 60%,transparent)}
.ttl.go{font-size:36px;color:var(--ink);text-shadow:0 0 14px #ff4d6d}
.big{font-size:30px;font-variant-numeric:tabular-nums}
.sub{font-size:16px;color:var(--warm)}
.hint{font-size:13px;color:var(--dim);letter-spacing:.08em}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
</style>

<div id="app">
  <div id="hud">
    <div id="score">0</div>
    <div id="stageNo">ST.1</div>
    <div id="lives"></div>
    <button id="mute" aria-label="サウンド切替">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ov"></div>
  </div>
</div>

<script>
(()=>{
const W=21,H=25;
const g=new Uint8Array(W*H);      // 0 path,1 wall,2 door,3 house
const dots=new Uint8Array(W*H);   // 1 seed, 2 lantern
let dist=new Float32Array(W*H);
let tunnels=[];
const rnd=n=>Math.floor(Math.random()*n);
const wrapX=x=>((x%W)+W)%W;
const T=(x,y)=>(y<0||y>=H)?1:g[y*W+wrapX(x)];
const setT=(x,y,v)=>{g[y*W+x]=v};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const inHouseBox=(x,y)=>x>=8&&x<=12&&y>=10&&y<=14;
const blockedNode=(x,y)=>(x===9||x===11)&&(y===11||y===13);
const isNode=(x,y)=>x%2===1&&y%2===1&&x>=1&&x<=W-2&&y>=1&&y<=H-2&&!blockedNode(x,y);
const D4=[[0,-1],[-1,0],[0,1],[1,0]];
const deg=(x,y)=>D4.filter(([dx,dy])=>T(x+dx,y+dy)===0).length;

/* ---------- maze generation ---------- */
function genMaze(){
  g.fill(1);
  const vis=new Set(), key=(x,y)=>x+','+y;
  const st=[[1,1]]; vis.add(key(1,1)); setT(1,1,0);
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=shuffle([[2,0],[-2,0],[0,2],[0,-2]])
      .map(([dx,dy])=>[x+dx,y+dy,dx,dy])
      .filter(([nx,ny])=>nx>=1&&nx<=9&&ny>=1&&ny<=H-2&&!blockedNode(nx,ny)&&!vis.has(key(nx,ny)));
    if(!nb.length){st.pop();continue}
    const [nx,ny,dx,dy]=nb[0];
    setT(x+dx/2,y+dy/2,0); setT(nx,ny,0); vis.add(key(nx,ny)); st.push([nx,ny]);
  }
  for(let y=0;y<H;y++)for(let x=0;x<10;x++) setT(W-1-x,y,g[y*W+x]);
  const cands=[]; for(let y=1;y<H-1;y+=2) if((y<9||y>15)&&y!==17) cands.push(y);
  shuffle(cands).slice(0,2+rnd(2)).forEach(y=>setT(10,y,0));
  setT(10,17,0);
  for(let y=9;y<=15;y++)for(let x=7;x<=13;x++){
    const ring=x===7||x===13||y===9||y===15;
    const wall=!ring&&(x===8||x===12||y===10||y===14);
    setT(x,y,ring?0:wall?1:3);
  }
  setT(10,10,2);
  tunnels=[]; const tc=[]; for(let y=3;y<=H-4;y+=2) tc.push(y);
  shuffle(tc); tunnels.push(tc[0]);
  if(Math.random()<0.6){const y2=tc.find(y=>Math.abs(y-tc[0])>=6); if(y2) tunnels.push(y2);}
  tunnels.forEach(y=>{setT(0,y,0);setT(W-1,y,0)});
  // extra loops
  for(let i=0;i<4;i++){
    const x=1+2*rnd(5),y=1+2*rnd(12),[dx,dy]=[[1,0],[0,1]][rnd(2)],wx=x+dx,wy=y+dy;
    if(isNode(x,y)&&isNode(x+2*dx,y+2*dy)&&T(wx,wy)===1&&!inHouseBox(wx,wy)){setT(wx,wy,0);setT(W-1-wx,wy,0)}
  }
  // remove dead ends
  for(let pass=0;pass<3;pass++){
    for(let y=1;y<H-1;y+=2)for(let x=1;x<=9;x+=2){
      if(!isNode(x,y)||deg(x,y)>1) continue;
      const opts=D4.filter(([dx,dy])=>T(x+dx,y+dy)===1&&isNode(x+2*dx,y+2*dy)&&!inHouseBox(x+dx,y+dy));
      if(!opts.length) continue;
      const dv=o=>deg(x+2*o[0],y+2*o[1]);
      const m=Math.min(...opts.map(dv));
      const best=opts.filter(o=>dv(o)===m);
      const [dx,dy]=best[rnd(best.length)];
      setT(x+dx,y+dy,0); setT(W-1-(x+dx),y+dy,0);
    }
  }
  dots.fill(0); dotsLeft=0;
  for(let y=0;y<H;y++)for(let x=1;x<W-1;x++){
    if(T(x,y)!==0) continue;
    if(x>=7&&x<=13&&y>=9&&y<=15) continue;
    if(x===10&&y===17) continue;
    dots[y*W+x]=1; dotsLeft++;
  }
  [[1,3],[W-2,3],[1,H-4],[W-2,H-4]].forEach(([x,y])=>{dots[y*W+x]=2});
  dotsTotal=dotsLeft;
  // distance map to the house exit (for eyes)
  dist=new Float32Array(W*H).fill(1e9);
  const q=[[10,9]]; dist[9*W+10]=0;
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of D4){
      const nx=wrapX(x+dx),ny=y+dy;
      if(T(nx,ny)!==0||dist[ny*W+nx]<1e9) continue;
      dist[ny*W+nx]=dist[y*W+x]+1; q.push([nx,ny]);
    }
  }
}

/* ---------- audio ---------- */
let ac=null,master,sOsc,sGain,lfo,lfoG,muted=false,sirenKey='';
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC(); master=ac.createGain(); master.gain.value=muted?0:0.55; master.connect(ac.destination);
  sOsc=ac.createOscillator(); sOsc.type='triangle'; sOsc.frequency.value=180;
  lfo=ac.createOscillator(); lfo.frequency.value=4; lfoG=ac.createGain(); lfoG.gain.value=25;
  lfo.connect(lfoG); lfoG.connect(sOsc.frequency);
  sGain=ac.createGain(); sGain.gain.value=0; sOsc.connect(sGain); sGain.connect(master);
  sOsc.start(); lfo.start();
}
function tone(f,dur,type='square',vol=.1,when=0,to){
  if(!ac) return;
  const t=ac.currentTime+when,o=ac.createOscillator(),gn=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  gn.gain.setValueAtTime(.0001,t); gn.gain.exponentialRampToValueAtTime(vol,t+.01); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t+dur+.03);
}
let dotFlip=0,lastDot=0;
const sfx={
  dot(){ if(!ac)return; const n=ac.currentTime; if(n-lastDot<.035)return; lastDot=n; dotFlip^=1; tone(dotFlip?640:520,.07,'triangle',.13,0,dotFlip?900:700); },
  power(){ [392,523,659,784].forEach((f,i)=>tone(f,.14,'square',.07,i*.05)); },
  eat(){ tone(160,.4,'sawtooth',.1,0,1500); tone(800,.18,'square',.05,.22,1900); },
  death(){ tone(880,1.4,'sawtooth',.11,0,55); tone(660,1.3,'square',.04,.08,40); [0,.15,.3].forEach(d=>tone(200-d*200,.1,'square',.05,1.3+d,80)); },
  bonus(){ tone(1047,.14,'sine',.2); tone(1568,.35,'sine',.18,.1); tone(2093,.3,'sine',.08,.2); },
  extra(){ [0,.12,.24].forEach(d=>tone(1319,.1,'square',.07,d)); },
  start(){
    const mel=[523,659,784,1047,988,784,659,784,880,1047,1319,1175,1047];
    mel.forEach((f,i)=>tone(f,i===mel.length-1?.45:.15,'square',.07,i*.14));
    [131,196,165,196].forEach((f,i)=>tone(f,.5,'triangle',.16,i*.46));
  },
  ready(){ tone(659,.12,'square',.06); tone(988,.22,'square',.06,.13); },
  clear(){ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.12,'triangle',.14,i*.07)); [1047,1319,1568].forEach(f=>tone(f,.7,'sine',.07,.5)); },
  over(){ [392,330,262,196].forEach((f,i)=>tone(f,.28,'square',.07,i*.24)); tone(98,.9,'triangle',.18,.96); }
};
function updateSiren(){
  if(!ac) return;
  let v=0,f=180,r=4,d=25;
  if(state==='play'&&freeze<=0){
    if(ghosts.some(x=>x.state==='eyes'||x.state==='enter')){v=.028;f=620;r=16;d=260}
    else if(frightT>0){v=.032;f=130;r=10;d=45}
    else{const p=1-dotsLeft/dotsTotal; v=.02; f=Math.round(170+p*130); r=+(3.5+p*3).toFixed(1); d=Math.round(25+p*25)}
  }
  const k=[v,f,r,d].join();
  if(k===sirenKey) return; sirenKey=k;
  const t=ac.currentTime;
  sGain.gain.setTargetAtTime(v,t,.05); sOsc.frequency.setTargetAtTime(f,t,.05);
  lfo.frequency.setTargetAtTime(r,t,.05); lfoG.gain.setTargetAtTime(d,t,.05);
}

/* ---------- game state ---------- */
const GDEF=[
  {c:'#ff4d6d',corner:[W-2,-3]},
  {c:'#e07bff',corner:[1,-3]},
  {c:'#35e0c8',corner:[W-1,H+2]},
  {c:'#ffa53d',corner:[0,H+2]}
];
const SCHED=[7,20,7,20,5,20,5,1e9];
let state='title',stT=0,time=0,score=0,lives=2,stage=1,best=0,extraGiven=false;
let dotsLeft=0,dotsTotal=1,dotsEaten=0,player,ghosts=[],frightT=0,combo=0,freeze=0;
let modeIdx=0,modeT=0,releaseClock=0,bonus=null,popups=[],overReadyAt=0;
try{best=+localStorage.getItem('hotaru-meikyu-best')||0}catch(e){}

const pSpeed=()=>Math.min(8.4,7.2+.12*(stage-1))*(frightT>0?1.06:1);
const gSpeed=()=>Math.min(7.8,6.3+.22*(stage-1));

function resetActors(){
  player={tx:10,ty:17,dx:-1,dy:0,t:0,moving:false,want:[-1,0]};
  const rs=Math.max(.4,1-.12*(stage-1));
  ghosts=GDEF.map((d,i)=>({id:i,c:d.c,corner:d.corner,fright:false,hide:0,bob:i,
    state:i===0?'active':'house',tx:10,ty:9,dx:-1,dy:0,t:0,moving:i===0,
    fx:[10,10,9,11][i],fy:i===0?9:12,releaseAt:[0,1,4.5,8][i]*rs}));
  frightT=0;freeze=0;releaseClock=0;modeIdx=0;modeT=0;combo=0;
}
function startStage(first){
  genMaze(); resetActors(); dotsEaten=0; bonus=null; popups=[];
  buildMaze(); updateHUD();
  state='ready'; stT=first?2.3:1.8;
  first?sfx.start():sfx.ready();
}
function newGame(){
  score=0;lives=2;stage=1;extraGiven=false;
  ov.hidden=true; startStage(true);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
}
function addScore(n){
  score+=n;
  if(!extraGiven&&score>=10000){extraGiven=true;lives++;sfx.extra()}
  updateHUD();
}

/* ---------- movement ---------- */
const pos=e=>(e.state==='house'||e.state==='leaving'||e.state==='enter')?[e.fx,e.fy]:[e.tx+e.dx*e.t,e.ty+e.dy*e.t];
function reverseE(e){ if(!e.moving)return; e.tx=wrapX(e.tx+e.dx); e.dx=-e.dx; e.dy=-e.dy; e.t=1-e.t; }
function moveEntity(e,amt,decide,arrive){
  let guard=0;
  while(amt>1e-9&&guard++<24){
    if(!e.moving){decide(e); if(!e.moving) return;}
    const need=1-e.t;
    if(amt<need){e.t+=amt;return}
    amt-=need; e.tx=wrapX(e.tx+e.dx); e.ty+=e.dy; e.t=0;
    if(arrive&&arrive(e)===false) return;
    decide(e);
  }
}
function playerDecide(p){
  const [wx,wy]=p.want;
  if((wx||wy)&&T(p.tx+wx,p.ty+wy)===0){p.dx=wx;p.dy=wy;p.moving=true;return}
  if((p.dx||p.dy)&&T(p.tx+p.dx,p.ty+p.dy)===0){p.moving=true;return}
  p.moving=false;p.t=0;
}
function playerArrive(p){
  const i=p.ty*W+p.tx,d=dots[i];
  if(d){
    dots[i]=0;dotsLeft--;dotsEaten++;
    if(d===1){addScore(10);sfx.dot()} else {addScore(50);powerUp()}
    if(dotsEaten===60||dotsEaten===150) bonus={t:9};
    if(dotsLeft===0){state='clear';stT=2.2;sfx.clear();return false}
  }
}
function setWant(d){
  if(!player) return;
  player.want=d;
  if(state==='play'&&player.moving&&d[0]===-player.dx&&d[1]===-player.dy) reverseE(player);
}
function powerUp(){
  sfx.power(); combo=0;
  frightT=Math.max(1.5,7-.7*(stage-1));
  ghosts.forEach(x=>{
    if(x.state==='active'){x.fright=true;reverseE(x)}
    else if(x.state==='house'||x.state==='leaving') x.fright=true;
  });
}
function target(x){
  const px=player.tx,py=player.ty,pdx=player.dx,pdy=player.dy;
  if(modeIdx%2===0) return x.corner;
  switch(x.id){
    case 0: return [px,py];
    case 1: return [px+4*pdx,py+4*pdy];
    case 2:{const b=ghosts[0],vx=px+2*pdx,vy=py+2*pdy;return [2*vx-b.tx,2*vy-b.ty]}
    default: return ((x.tx-px)**2+(x.ty-py)**2>64)?[px,py]:x.corner;
  }
}
function ghostDecide(x){
  const ok=([dx,dy])=>T(x.tx+dx,x.ty+dy)===0;
  if(x.state==='eyes'){
    let b=1e9,ch=null;
    for(const d of D4){if(!ok(d))continue;const v=dist[(x.ty+d[1])*W+wrapX(x.tx+d[0])];if(v<b){b=v;ch=d}}
    if(!ch){x.moving=false;return}
    x.dx=ch[0];x.dy=ch[1];x.moving=true;return;
  }
  let opts=D4.filter(d=>ok(d)&&!(d[0]===-x.dx&&d[1]===-x.dy));
  if(!opts.length) opts=D4.filter(ok);
  if(!opts.length){x.moving=false;return}
  let ch;
  if(x.fright) ch=opts[rnd(opts.length)];
  else{
    const [tx,ty]=target(x);let b=1e9;
    for(const d of opts){const v=(x.tx+d[0]-tx)**2+(x.ty+d[1]-ty)**2;if(v<b){b=v;ch=d}}
  }
  x.dx=ch[0];x.dy=ch[1];x.moving=true;
}
function ghostArrive(x){
  if(x.state==='eyes'&&x.tx===10&&x.ty===9){x.state='enter';x.fx=10;x.fy=9;x.moving=false;return false}
}
function updateGhost(x,dt){
  if(x.hide>0) x.hide-=dt;
  if(x.state==='house'){
    x.bob+=dt*5; x.fy=12+Math.sin(x.bob)*.3;
    if(releaseClock>=x.releaseAt) x.state='leaving';
    return;
  }
  if(x.state==='leaving'){
    const s=3.2*dt;
    if(Math.abs(x.fx-10)>1e-3) x.fx+=Math.sign(10-x.fx)*Math.min(s,Math.abs(10-x.fx));
    else{
      x.fy-=s;
      if(x.fy<=9){x.fy=9;x.state='active';x.tx=10;x.ty=9;x.t=0;x.dx=Math.random()<.5?-1:1;x.dy=0;x.moving=true}
    }
    return;
  }
  if(x.state==='enter'){
    x.fy=Math.min(12,x.fy+9*dt);
    if(x.fy>=12){x.state='leaving';x.fright=false}
    return;
  }
  let sp=x.state==='eyes'?15:(x.fright?gSpeed()*.55:gSpeed());
  if(x.state==='active'&&tunnels.includes(x.ty)&&(x.tx<=3||x.tx>=W-4)) sp*=.5;
  moveEntity(x,sp*dt,ghostDecide,ghostArrive);
}
function eatGhost(x){
  combo++; const pts=200*2**Math.min(combo-1,3);
  addScore(pts);
  const [gx,gy]=pos(x); popups.push({x:gx,y:gy,s:''+pts,t:1});
  freeze=.55; x.hide=.55; sfx.eat();
  if(x.state==='active'){x.state='eyes';x.fright=false}
  else {x.state='enter';x.fright=false}
}
function collide(){
  const [px,py]=pos(player);
  for(const x of ghosts){
    if(x.state!=='active'&&x.state!=='leaving') continue;
    const [gx,gy]=pos(x); let dx=Math.abs(px-gx); dx=Math.min(dx,W-dx);
    if(dx*dx+(gy-py)**2<.42){
      if(x.fright) eatGhost(x);
      else{state='dying';stT=1.9;sfx.death();return}
    }
  }
  if(bonus&&Math.abs(px-10)+Math.abs(py-17)<.5){
    const v=[300,500,700,1000,1500,2000,3000,5000][Math.min(stage-1,7)];
    addScore(v); popups.push({x:10,y:17,s:''+v,t:1.2}); bonus=null; sfx.bonus();
  }
}
function updatePlay(dt){
  if(freeze>0){freeze-=dt;ghosts.forEach(x=>{if(x.hide>0)x.hide-=dt});return}
  releaseClock+=dt;
  if(frightT>0){frightT-=dt;if(frightT<=0)ghosts.forEach(x=>x.fright=false)}
  else{
    modeT+=dt;
    if(modeT>=SCHED[modeIdx]){modeT=0;modeIdx=Math.min(modeIdx+1,SCHED.length-1);ghosts.forEach(x=>{if(x.state==='active')reverseE(x)})}
  }
  moveEntity(player,pSpeed()*dt,playerDecide,playerArrive);
  if(state!=='play') return;
  ghosts.forEach(x=>updateGhost(x,dt));
  collide();
  if(bonus){bonus.t-=dt;if(bonus.t<=0)bonus=null}
}
function afterDeath(){
  if(lives<=0){gameOver();return}
  lives--; resetActors(); bonus=null; updateHUD();
  state='ready'; stT=1.6; sfx.ready();
}
function gameOver(){
  state='over'; overReadyAt=time+1;
  if(score>best){best=score;try{localStorage.setItem('hotaru-meikyu-best',best)}catch(e){}}
  sfx.over();
  ov.innerHTML=`<div class="ttl go">GAME OVER</div><div class="big">${score}</div><div class="hint">BEST ${best}</div><div class="sub blink">タップでもう一度</div>`;
  ov.hidden=false;
}

/* ---------- rendering ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const stageEl=document.getElementById('stage'),ov=document.getElementById('ov');
let cs=18,dpr=1,mz=null;
const HUES=[205,165,275,330,32,125,248,0];
function buildMaze(){
  mz=document.createElement('canvas'); mz.width=W*cs*dpr; mz.height=H*cs*dpr;
  const c=mz.getContext('2d'); c.scale(dpr,dpr);
  const hue=HUES[(stage-1)%HUES.length];
  const isW=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&g[y*W+x]===1;
  const segs=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!isW(x,y))continue; let n=0;
    if(isW(x+1,y)){segs.push([x,y,x+1,y]);n++}
    if(isW(x,y+1)){segs.push([x,y,x,y+1]);n++}
    if(!n&&!isW(x-1,y)&&!isW(x,y-1)) segs.push([x,y,x+.001,y]);
  }
  const stroke=(w,col,blur)=>{
    c.lineWidth=w;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';
    c.shadowBlur=blur;c.shadowColor=col;c.beginPath();
    for(const [a,b,d,e] of segs){c.moveTo((a+.5)*cs,(b+.5)*cs);c.lineTo((d+.5)*cs,(e+.5)*cs)}
    c.stroke();
  };
  stroke(cs*.56,`hsl(${hue} 85% 62%)`,cs*.55);
  stroke(cs*.3,`hsl(${hue} 45% 10%)`,0);
  c.shadowBlur=0; c.fillStyle='#ff9ec7';
  c.fillRect(10*cs+cs*.08,10.5*cs-cs*.08,cs*.84,cs*.16);
}
function resize(){
  const r=stageEl.getBoundingClientRect();
  cs=Math.max(8,Math.floor(Math.min(r.width/W,(r.height-14)/H)));
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=W*cs*dpr; cv.height=H*cs*dpr;
  cv.style.width=W*cs+'px'; cv.style.height=H*cs+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildMaze();
}
function glowAt(cx,cy,r,rgb,a){
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
}
function drawWrapped(x,fn){fn(x); if(x<1)fn(x+W); if(x>W-2)fn(x-W);}
function drawDots(){
  ctx.fillStyle='#ffe6a8';ctx.beginPath();
  const r=cs*.09;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(dots[y*W+x]===1){const cx=(x+.5)*cs,cy=(y+.5)*cs;ctx.moveTo(cx+r,cy);ctx.arc(cx,cy,r,0,Math.PI*2)}
  ctx.fill();
  const p=.78+.22*Math.sin(time*6);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(dots[y*W+x]===2){
    const cx=(x+.5)*cs,cy=(y+.5)*cs;
    glowAt(cx,cy,cs*.75,'216,255,94',.45*p);
    ctx.fillStyle='#e9ff9c';ctx.beginPath();ctx.arc(cx,cy,cs*.26*p,0,Math.PI*2);ctx.fill();
  }
}
function drawBonus(){
  if(!bonus)return;
  const cx=10.5*cs,cy=17.5*cs,r=cs*.36,a=time*2;
  glowAt(cx,cy,cs*.9,'143,240,255',.4);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(a)*.25);
  ctx.fillStyle='#8ff0ff';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.7,0);ctx.lineTo(0,r);ctx.lineTo(-r*.7,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8fdff';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.25,0);ctx.lineTo(0,r*.2);ctx.lineTo(-r*.35,-r*.1);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  const [x,y]=pos(player);
  let dx=player.dx,dy=player.dy;
  drawWrapped(x,px=>{
    const cx=(px+.5)*cs,cy=(y+.5)*cs;
    let r=cs*.36,ring=-1;
    if(state==='dying'){
      const k=1-stT/1.9;
      if(k>.25){const q=Math.min(1,(k-.25)/.6);r*=1-q;ring=q}
    }
    glowAt(cx,cy,cs*1.15,'216,255,94',.42+.08*Math.sin(time*8));
    if(ring>=0&&ring<1){
      ctx.strokeStyle=`rgba(216,255,94,${1-ring})`;ctx.lineWidth=2;
      for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,cs*(.3+ring*(1.2+i*.5)),0,Math.PI*2);ctx.stroke()}
    }
    if(r<=.5)return;
    const px2=-dy,py2=dx,flap=.5+.5*Math.sin(time*32),ang=Math.atan2(py2,px2);
    ctx.fillStyle='rgba(215,235,255,.38)';
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(cx-dx*r*.45+px2*s*r*.62,cy-dy*r*.45+py2*s*r*.62,r*(.2+.2*flap),r*.55,ang,0,Math.PI*2);
      ctx.fill();
    }
    const gr=ctx.createRadialGradient(cx-r*.3,cy-r*.35,r*.1,cx,cy,r);
    gr.addColorStop(0,'#fbffe0');gr.addColorStop(.55,'#d8ff5e');gr.addColorStop(1,'#86ad10');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1d2a05';
    for(const s of [-1,1]){ctx.beginPath();ctx.arc(cx+dx*r*.38+px2*s*r*.3,cy+dy*r*.38+py2*s*r*.3,r*.13,0,Math.PI*2);ctx.fill()}
  });
}
function hexRgb(h){const n=parseInt(h.slice(1),16);return `${n>>16&255},${n>>8&255},${n&255}`}
function drawGhost(x){
  if(x.hide>0)return;
  const [gx,gy]=pos(x);
  let dx=x.dx,dy=x.dy;
  if(x.state==='house'||x.state==='leaving'){dx=0;dy=-1}
  if(x.state==='enter'){dx=0;dy=1}
  const eyesOnly=x.state==='eyes'||x.state==='enter';
  const fr=x.fright&&!eyesOnly;
  const flash=fr&&frightT<2&&Math.floor(time*5)%2===0;
  drawWrapped(gx,px=>{
    const cx=(px+.5)*cs,cy=(gy+.5)*cs,r=cs*.36;
    if(!eyesOnly){
      const col=fr?(flash?'#f2f4ff':'#3f56ff'):x.c;
      glowAt(cx,cy,cs*1.05,hexRgb(col),.35);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.atan2(dy,dx));
      const w=Math.sin(time*14+x.id*1.7)*r*.28;
      ctx.fillStyle=col;ctx.beginPath();
      ctx.arc(0,0,r,-Math.PI/2,Math.PI/2);
      ctx.quadraticCurveTo(-r*.75,r*.95,-r*1.6,w);
      ctx.quadraticCurveTo(-r*.75,-r*.95,0,-r);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(r*.2,-r*.35,r*.3,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    if(fr){
      ctx.fillStyle=flash?'#ff4d6d':'#ffe0ee';
      for(const s of [-1,1]){ctx.beginPath();ctx.arc(cx+s*r*.3,cy-r*.15,r*.12,0,Math.PI*2);ctx.fill()}
      ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=Math.max(1,cs*.06);ctx.beginPath();
      for(let i=0;i<=4;i++){const xx=cx-r*.45+i*r*.225,yy=cy+r*.3+(i%2?-r*.1:r*.06);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}
      ctx.stroke();
    }else{
      for(const s of [-1,1]){
        const ex=cx+s*r*.32,ey=cy-r*.12;
        ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,r*.24,r*.3,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#1a2060';ctx.beginPath();ctx.arc(ex+dx*r*.12,ey+dy*r*.15,r*.13,0,Math.PI*2);ctx.fill();
      }
    }
  });
}
function draw(){
  const w=W*cs,h=H*cs;
  ctx.fillStyle='#060913';ctx.fillRect(0,0,w,h);
  if(state==='clear'&&Math.floor(stT*6)%2===0){ctx.save();ctx.filter='grayscale(1) brightness(2.4)';ctx.drawImage(mz,0,0,w,h);ctx.restore()}
  else ctx.drawImage(mz,0,0,w,h);
  drawDots(); drawBonus();
  const hideGhosts=state==='clear'||(state==='dying'&&stT<1.5);
  if(!hideGhosts) ghosts.forEach(drawGhost);
  drawPlayer();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${Math.round(cs*.62)}px DotGothic16, monospace`;
  for(const p of popups){ctx.fillStyle=`rgba(143,240,255,${Math.min(1,p.t*1.5)})`;ctx.fillText(p.s,(p.x+.5)*cs,(p.y+.5-(1-p.t)*.6)*cs)}
  if(state==='ready'){
    ctx.font=`${Math.round(cs*.95)}px DotGothic16, monospace`;
    ctx.shadowBlur=cs*.6;ctx.shadowColor='#d8ff5e';ctx.fillStyle='#d8ff5e';
    ctx.fillText('READY',10.5*cs,16.5*cs);ctx.shadowBlur=0;
  }
}

/* ---------- HUD ---------- */
const scoreEl=document.getElementById('score'),stageNoEl=document.getElementById('stageNo'),livesEl=document.getElementById('lives');
function updateHUD(){
  scoreEl.textContent=score;
  stageNoEl.textContent='ST.'+stage;
  livesEl.innerHTML='<span class="life"></span>'.repeat(Math.max(0,Math.min(lives,6)));
}
function showTitle(){
  ov.innerHTML=`<div class="ttl">ホタル迷宮</div><div class="hint">スワイプで移動</div><div class="sub blink">タップでスタート</div>${best?`<div class="hint">BEST ${best}</div>`:''}`;
  ov.hidden=false;
}

/* ---------- loop ---------- */
let last=performance.now();
function update(dt){
  time+=dt;
  popups.forEach(p=>p.t-=dt); popups=popups.filter(p=>p.t>0);
  if(state==='ready'){stT-=dt;if(stT<=0)state='play'}
  else if(state==='play') updatePlay(dt);
  else if(state==='dying'){stT-=dt;if(stT<=0)afterDeath()}
  else if(state==='clear'){stT-=dt;if(stT<=0){stage++;startStage(false)}}
  updateSiren();
}
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(frame);
}

/* ---------- input ---------- */
let sx=0,sy=0,down=false;
window.addEventListener('pointerdown',e=>{
  sx=e.clientX;sy=e.clientY;down=true;initAudio();
  if(state==='title'||(state==='over'&&time>=overReadyAt)) newGame();
});
window.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)>18){
    setWant(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);
    sx=e.clientX;sy=e.clientY;
  }
});
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>down=false));
window.addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();setWant(m)}
  if((e.key===' '||e.key==='Enter')&&(state==='title'||(state==='over'&&time>=overReadyAt))){initAudio();newGame()}
});
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('pointerdown',e=>e.stopPropagation());
muteBtn.addEventListener('click',()=>{
  initAudio(); muted=!muted; muteBtn.classList.toggle('off',muted);
  if(master) master.gain.setTargetAtTime(muted?0:.55,ac.currentTime,.02);
});
document.addEventListener('visibilitychange',()=>{
  if(!ac)return; document.hidden?ac.suspend():ac.resume();
  last=performance.now();
});
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

/* ---------- boot ---------- */
genMaze(); resetActors(); updateHUD(); resize(); showTitle();
if(document.fonts&&document.fonts.load) document.fonts.load('20px DotGothic16').catch(()=>{});
requestAnimationFrame(frame);
})();
</script>

</body></html>
