<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>クライマックス9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --room:#120e0b;
  --panel:#1d1713;
  --line:#3b2f26;
  --ink:#f0e7d7;
  --mute:#a8998b;
  --brass:#d6ad62;
  --brass-ink:#241a0e;
  --cpu:#cf5a3f;
  --foul:#ff7a5c;
  --good:#9fd38a;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--room)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--room);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;min-height:38px;flex-wrap:nowrap}
.score{display:flex;align-items:center;gap:8px;flex:none}
.tag{font:700 12px/1 "Oswald",sans-serif;letter-spacing:.12em;padding:6px 9px;border-radius:4px;border:1px solid var(--line);color:var(--mute);transition:background .2s,color .2s,border-color .2s}
.tag.on.you{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.tag.on.cpu{background:var(--cpu);color:#fff3ec;border-color:var(--cpu)}
.num{font:700 22px/1 "Oswald",sans-serif;font-variant-numeric:tabular-nums;min-width:.7em;text-align:center}
.dash{color:var(--mute)}
.msg{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:12px;border-left:1px solid var(--line)}
.msg.foul{color:var(--foul)}
.msg.good{color:var(--good)}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.bi{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 "Oswald",sans-serif;color:#111;position:relative}
.bi::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#f6f1e6}
.bi span{position:relative}
.bi.b8{background:#111}
.bi.b9{background:linear-gradient(#f6f1e6 0 22%,#f2b705 22% 78%,#f6f1e6 78%)}
.hbtn,select.hbtn{height:30px;padding:0 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:12px;cursor:pointer}
.hbtn:focus-visible,select:focus-visible,.fine:focus-visible,.start-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hbtn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}

/* stage */
.stage{display:grid;grid-template-columns:78px 1fr 66px;gap:10px;min-height:0}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:0;padding-block:6px}
.lbl{font:500 10px/1.2 "Oswald",sans-serif;letter-spacing:.18em;color:var(--mute);text-align:center}
.spin{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fffdf6 0 12%,#efe8d8 40%,#b9ad97 100%);position:relative;cursor:pointer;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.spin::before{content:"";position:absolute;left:50%;top:10%;bottom:10%;border-left:1px dashed rgba(0,0,0,.25)}
.spin::after{content:"";position:absolute;top:50%;left:10%;right:10%;border-top:1px dashed rgba(0,0,0,.18)}
.spin i{position:absolute;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#c8342a;box-shadow:0 0 0 2px rgba(255,255,255,.7);top:50%;transition:top .1s}
.spinv{font-size:11px;color:var(--ink);min-height:1.2em}
.fines{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin-top:auto}
.fine{height:40px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:18px;cursor:pointer;touch-action:none}
.fine:active{background:#2a221c}
.table-wrap{position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.power{flex:1;width:34px;min-height:120px;border-radius:17px;background:linear-gradient(#0c0907,#1a1410);border:1px solid var(--line);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.power .fill{position:absolute;left:0;right:0;top:0;height:0%;background:linear-gradient(#e8c983,#d6ad62 55%,#cf5a3f)}
.power .ticks{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 calc(10% - 1px),rgba(255,255,255,.08) calc(10% - 1px) 10%)}
.pval{font:700 14px/1 "Oswald",sans-serif;font-variant-numeric:tabular-nums}
.hint{font-size:10px;color:var(--mute);text-align:center;line-height:1.35}

/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,7,5,.55);z-index:5;padding:16px}
.card{background:rgba(29,23,19,.96);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.logo{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:34px;line-height:1.1;letter-spacing:.02em;text-wrap:balance}
.logo b{color:#f2b705;font-weight:400}
.sub{color:var(--mute);font-size:12px;margin:10px 0 0;line-height:1.7;text-align:left}
.sub em{font-style:normal;color:var(--ink);font-weight:700}
.start-btn{margin-top:16px;height:44px;padding:0 28px;border-radius:22px;border:0;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:15px;cursor:pointer}
.big{font-family:"Dela Gothic One",sans-serif;font-size:44px;line-height:1}
.big.win{color:var(--brass)}
.big.lose{color:var(--cpu)}
.rot{display:none}
@media (orientation:portrait) and (max-width:760px){
  .rot{display:grid}
}
@media (max-height:400px){
  .hud{min-height:32px}
  .num{font-size:19px}
  .msg{font-size:13px}
  .spin{width:56px;height:56px}
  .fine{height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="score">
      <span class="tag you on" id="tagYou">YOU</span>
      <span class="num" id="scYou">0</span><span class="dash">–</span><span class="num" id="scCpu">0</span>
      <span class="tag cpu" id="tagCpu">CPU</span>
    </div>
    <div class="msg" id="msg">あなたの番です</div>
    <div class="tools">
      <span class="chip">狙い <span class="bi b8" id="tgt"><span>8</span></span></span>
      <select class="hbtn" id="diff" aria-label="CPUの強さ">
        <option value="easy">CPU 弱</option>
        <option value="normal" selected>CPU 中</option>
        <option value="hard">CPU 強</option>
      </select>
      <button class="hbtn" id="snd" aria-pressed="true">音 ON</button>
      <button class="hbtn" id="newBtn">新配置</button>
    </div>
  </header>
  <main class="stage">
    <aside class="side">
      <div class="lbl">SPIN</div>
      <div class="spin" id="spin" role="slider" aria-label="押し・引き" tabindex="0"><i id="spinDot"></i></div>
      <div class="spinv" id="spinV">センター</div>
      <div class="lbl" style="margin-top:auto">AIM</div>
      <div class="fines">
        <button class="fine" id="rotL" aria-label="左に微調整">↺</button>
        <button class="fine" id="rotR" aria-label="右に微調整">↻</button>
      </div>
    </aside>
    <div class="table-wrap" id="wrap"><canvas id="cv"></canvas></div>
    <aside class="side">
      <div class="lbl">POWER</div>
      <div class="power" id="power"><div class="fill" id="pfill"></div><div class="ticks"></div></div>
      <div class="pval" id="pval">0</div>
      <div class="hint">下へ引いて<br>離すと打つ</div>
    </aside>
  </main>
</div>

<div class="ov" id="startOv">
  <div class="card">
    <div class="logo">クライマックス<b>9</b></div>
    <p class="sub">残りは <em>8番・9番・手玉</em> だけ。配置は毎回ランダム。<br>
    必ず <em>台上の小さい番号</em> に先に当てること。<em>9番を入れたら勝ち</em>(8番経由のコンビもOK)。<br>
    ファウル(空振り・先球違い・手玉イン・ノークッション)は相手のフリーボール。<br>
    台をタッチして狙い、右のゲージを下へ引いて離すとショット。</p>
    <button class="start-btn" id="startBtn">ブレイク開始(あなたが先攻)</button>
  </div>
</div>
<div class="ov" id="overOv" hidden>
  <div class="card">
    <div class="big" id="overTitle">YOU WIN</div>
    <p class="sub" id="overSub" style="text-align:center"></p>
    <button class="start-btn" id="againBtn">次のゲーム</button>
  </div>
</div>
<div class="ov rot" id="rotOv">
  <div class="card">
    <div class="logo" style="font-size:24px">横画面で遊んでください</div>
    <p class="sub" style="text-align:center">端末を横向きにすると台が大きく表示されます。</p>
    <button class="start-btn" id="rotBtn">このまま遊ぶ</button>
  </div>
</div>

<script>
(()=>{
"use strict";
// ---------- constants ----------
const W=1000,H=500,R=11,G=30,S=21,FR=230,VMAX=1500,STEP=1/240,TAU=Math.PI*2,DEG=Math.PI/180;
const MARGIN=56, TW=W+MARGIN*2, TH=H+MARGIN*2;
const SEGS=[
  [G,0,500-S,0],[500+S,0,W-G,0],[G,H,500-S,H],[500+S,H,W-G,H],[0,G,0,H-G],[W,G,W,H-G],
  [G,0,G-12,-16],[0,G,-16,G-12],[W-G,0,W-G+12,-16],[W,G,W+16,G-12],
  [G,H,G-12,H+16],[0,H-G,-16,H-G+12],[W-G,H,W-G+12,H+16],[W,H-G,W+16,H-G+12],
  [500-S,0,500-S+5,-18],[500+S,0,500+S-5,-18],[500-S,H,500-S+5,H+18],[500+S,H,500+S-5,H+18]
];
const POCKETS=[{x:0,y:0,s:0},{x:500,y:-6,s:1},{x:W,y:0,s:0},{x:0,y:H,s:0},{x:500,y:H+6,s:1},{x:W,y:H,s:0}];
const HOLES=[{x:-9,y:-9,r:21},{x:500,y:-14,r:19},{x:W+9,y:-9,r:21},{x:-9,y:H+9,r:21},{x:500,y:H+14,r:19},{x:W+9,y:H+9,r:21}];
const DIFF={easy:{a:1.5,p:.09},normal:{a:.6,p:.045},hard:{a:.2,p:.02}};
const CAP=R*.35;

// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- physics ----------
const newEv=()=>({first:null,railAfter:false,potted:[],cuePotted:false});
function potBall(b,ev,fx){b.on=false;const px=b.x,py=b.y;b.vx=b.vy=0;if(b.n===0)ev.cuePotted=true;else ev.potted.push(b.n);fx&&fx.pocket(b,px,py)}
function step(bs,dt,ev,fx){
  for(const b of bs){if(!b.on)continue;if(b.vx||b.vy){b.x+=b.vx*dt;b.y+=b.vy*dt}}
  // ball-ball
  for(let i=0;i<bs.length;i++){const a=bs[i];if(!a.on)continue;
    for(let j=i+1;j<bs.length;j++){const b=bs[j];if(!b.on)continue;
      let dx=b.x-a.x,dy=b.y-a.y;const d2=dx*dx+dy*dy;if(d2>=4*R*R)continue;
      const d=Math.sqrt(d2)||1e-4;const nx=dx/d,ny=dy/d;const ov=(2*R-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel<=0)continue;
      const cue=a.n===0?a:b.n===0?b:null;const cvx=cue?cue.vx:0,cvy=cue?cue.vy:0;
      const jm=rel*(1+.95)/2;a.vx-=jm*nx;a.vy-=jm*ny;b.vx+=jm*nx;b.vy+=jm*ny;
      if(cue&&ev.first===null){ev.first=(cue===a?b:a).n;if(cue.spin){cue.vx+=cvx*cue.spin*.55;cue.vy+=cvy*cue.spin*.55;cue.spin=0}}
      fx&&fx.clack(rel);
    }}
  // cushions & pockets
  for(const b of bs){if(!b.on)continue;
    if(b.x<2*R+20||b.x>W-2*R-20||b.y<2*R+20||b.y>H-2*R-20){
      for(const s of SEGS){
        const x1=s[0],y1=s[1],dx=s[2]-x1,dy=s[3]-y1,L2=dx*dx+dy*dy;
        let t=((b.x-x1)*dx+(b.y-y1)*dy)/L2;t=t<0?0:t>1?1:t;
        const qx=x1+t*dx,qy=y1+t*dy;let nx=b.x-qx,ny=b.y-qy;const d2=nx*nx+ny*ny;
        if(d2>=R*R)continue;const d=Math.sqrt(d2);if(d<1e-6)continue;nx/=d;ny/=d;
        b.x=qx+nx*R;b.y=qy+ny*R;
        const vn=b.vx*nx+b.vy*ny;
        if(vn<0){const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty,nvn=-vn*.76,nvt=vt*.96;b.vx=nx*nvn+tx*nvt;b.vy=ny*nvn+ty*nvt;if(ev.first!==null)ev.railAfter=true;fx&&fx.rail(-vn)}
      }
      if(b.x<-CAP||b.x>W+CAP||b.y<-CAP||b.y>H+CAP){potBall(b,ev,fx);continue}
    }
    // friction
    if(b.vx||b.vy){const sp=Math.hypot(b.vx,b.vy);const dec=(FR+sp*.25)*dt;
      if(sp<=dec||sp<3){b.vx=b.vy=0}else{const k=(sp-dec)/sp;b.vx*=k;b.vy*=k}}
  }
}
const moving=bs=>bs.some(b=>b.on&&(b.vx||b.vy));
function settle(bs,ev,fx){for(const b of bs)if(b.on&&(b.x<0||b.x>W||b.y<0||b.y>H))potBall(b,ev,fx)}
const clone=bs=>bs.map(b=>({...b}));
const cueOf=bs=>bs.find(b=>b.n===0);
const ballOf=(bs,n)=>bs.find(b=>b.n===n);
function targetOf(bs){const e=ballOf(bs,8);return e&&e.on?8:9}
function shootBalls(bs,ang,pow,spin){const c=cueOf(bs);c.vx=Math.cos(ang)*pow*VMAX;c.vy=Math.sin(ang)*pow*VMAX;c.spin=spin}
function simulate(bs0,ang,pow,spin){const bs=clone(bs0),ev=newEv();shootBalls(bs,ang,pow,spin);
  for(let i=0;i<240*20&&moving(bs);i++)step(bs,STEP,ev,null);settle(bs,ev,null);return{bs,ev}}
function judge(target,ev){
  let reason=null;
  if(ev.cuePotted)reason="手玉がポケットに落ちました";
  else if(ev.first===null)reason="どの球にも当たっていません";
  else if(ev.first!==target)reason=`先に${target}番に当てていません`;
  else if(!ev.potted.length&&!ev.railAfter)reason="クッションに入った球がありません";
  const foul=!!reason;
  return{foul,reason,win:!foul&&ev.potted.includes(9),pot:!foul&&ev.potted.length>0};
}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/L2;t=t<0?0:t>1?1:t;return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function validPos(bs,x,y){if(x<R||x>W-R||y<R||y>H-R)return false;for(const b of bs)if(b.on&&b.n!==0&&Math.hypot(b.x-x,b.y-y)<2*R+.5)return false;return true}
// geometric shot quality 0..1
function posScore(bs,tn,cx,cy){
  const c=cueOf(bs);if(cx===undefined){if(!c.on)return .9;cx=c.x;cy=c.y}
  const T=ballOf(bs,tn);if(!T||!T.on)return 0;let best=0;
  for(const P of POCKETS){
    let ux=P.x-T.x,uy=P.y-T.y;const dP=Math.hypot(ux,uy);ux/=dP;uy/=dP;
    if(P.s&&Math.abs(uy)<.4)continue;
    const gx=T.x-ux*2*R,gy=T.y-uy*2*R;
    if(gx<R-2||gx>W-R+2||gy<R-2||gy>H-R+2)continue;
    let ax=gx-cx,ay=gy-cy;const dA=Math.hypot(ax,ay);if(dA<1)continue;
    const cs=(ax*ux+ay*uy)/dA;if(cs<.22)continue;
    let blocked=false;
    for(const b of bs){if(!b.on||b.n===0||b.n===tn)continue;
      if(segDist(b.x,b.y,cx,cy,gx,gy)<2*R||segDist(b.x,b.y,T.x,T.y,P.x,P.y)<2*R){blocked=true;break}}
    if(blocked)continue;
    const s=Math.pow(cs,1.5)*(1-Math.min(.8,(dA+dP)/2200));if(s>best)best=s;
  }
  return best;
}

// ---------- CPU ----------
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function evalShot(base,c,target){
  const{bs,ev}=simulate(base,c.ang,c.pow,c.spin);const j=judge(target,ev);
  if(j.foul)return -500;if(j.win)return 1000;
  if(j.pot)return 400+400*posScore(bs,targetOf(bs));
  return -60-350*posScore(bs,target);
}
function genCands(base,target,sweep){
  const c=cueOf(base),T=ballOf(base,target),out=[];
  for(const P of POCKETS){
    let ux=P.x-T.x,uy=P.y-T.y;const d=Math.hypot(ux,uy);ux/=d;uy/=d;
    const gx=T.x-ux*2*R,gy=T.y-uy*2*R,ang=Math.atan2(gy-c.y,gx-c.x);
    for(const pow of[.2,.32,.46,.62,.82,1])for(const spin of[-.7,0,.6])out.push({ang,pow,spin});
  }
  const N=ballOf(base,9);
  if(target===8&&N.on){
    for(const P of POCKETS){
      let ux=P.x-N.x,uy=P.y-N.y;const d=Math.hypot(ux,uy);ux/=d;uy/=d;
      const g9x=N.x-ux*2*R,g9y=N.y-uy*2*R;let vx=g9x-T.x,vy=g9y-T.y;const dv=Math.hypot(vx,vy);vx/=dv;vy/=dv;
      const g8x=T.x-vx*2*R,g8y=T.y-vy*2*R,ang=Math.atan2(g8y-c.y,g8x-c.x);
      for(const pow of[.4,.65,.9])out.push({ang,pow,spin:0});
    }
  }
  if(sweep)for(let k=0;k<72;k++){const ang=k*TAU/72+.013;for(const pow of[.3,.62])out.push({ang,pow,spin:0})}
  return out;
}
function bihPositions(bs,target){
  const T=ballOf(bs,target),list=[];
  for(const P of POCKETS){
    let ux=P.x-T.x,uy=P.y-T.y;const d=Math.hypot(ux,uy);ux/=d;uy/=d;
    const gx=T.x-ux*2*R,gy=T.y-uy*2*R;
    for(const dist of[70,140,230])for(const off of[-18,0,18]){
      const a=Math.atan2(-uy,-ux)+off*DEG,x=gx+Math.cos(a)*dist,y=gy+Math.sin(a)*dist;
      if(!validPos(bs,x,y))continue;list.push({x,y,s:posScore(bs,target,x,y)});
    }
  }
  list.sort((a,b)=>b.s-a.s);return list.slice(0,4);
}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function cpuThink(){
  const bs=st.balls,target=targetOf(bs),cue=cueOf(bs),dz=DIFF[st.diff];
  let positions=[null];
  if(st.bih){positions=bihPositions(bs,target);if(cue.on&&validPos(bs,cue.x,cue.y))positions.push({x:cue.x,y:cue.y});if(!positions.length)positions=[{x:cue.x,y:cue.y}]}
  const all=[];let n=0;
  for(const pos of positions){
    const base=clone(bs);if(pos){const c=cueOf(base);c.x=pos.x;c.y=pos.y;c.on=true;c.vx=c.vy=0}

cv.addEventListener("pointermove",e=>{
  if(!drag)return;const p=toTable(e);
  if(drag.mode==="cue"){const c=cueOf(st.balls);let x=Math.max(R,Math.min(W-R,p.x+drag.dx)),y=Math.max(R,Math.min(H-R,p.y+drag.dy));if(validPos(st.balls,x,y)){c.x=x;c.y=y}}
  else aimTo(p);
});
const endDrag=()=>{if(drag&&drag.mode==="cue")aimAtTarget();drag=null};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
function aimTo(p){const c=cueOf(st.balls);if(Math.hypot(p.x-c.x,p.y-c.y)>R*.6)st.aim=Math.atan2(p.y-c.y,p.x-c.x)}

// power gauge
const pw=$("power");let pdrag=null;
pw.addEventListener("pointerdown",e=>{ensureAudio();if(st.phase!=="aim"||st.turn!=="you")return;pw.setPointerCapture(e.pointerId);pdrag={y0:e.clientY};st.power=0;showPower(0)});
pw.addEventListener("pointermove",e=>{if(!pdrag)return;const h=pw.getBoundingClientRect().height;const p=Math.max(0,Math.min(1,(e.clientY-pdrag.y0)/(h*.92)));
  if(Math.floor(p*10)!==Math.floor(st.power*10))SFX.tick();st.power=p;showPower(p)});
const pEnd=e=>{if(!pdrag)return;pdrag=null;const p=st.power;if(st.phase==="aim"&&st.turn==="you"&&p>.02){st.power=0;showPower(0);fire(st.aim,p,st.spin)}else{st.power=0;showPower(0)}};
pw.addEventListener("pointerup",pEnd);pw.addEventListener("pointercancel",()=>{pdrag=null;st.power=0;showPower(0)});

// spin
const sp=$("spin");let sdrag=false;
const setSpin=e=>{const r=sp.getBoundingClientRect();let v=-(e.clientY-(r.top+r.height/2))/(r.height*.38);v=Math.max(-1,Math.min(1,v));if(Math.abs(v)<.1)v=0;st.spin=v;showSpin()};
sp.addEventListener("pointerdown",e=>{ensureAudio();if(st.phase!=="aim"||st.turn!=="you")return;sdrag=true;sp.setPointerCapture(e.pointerId);setSpin(e)});
sp.addEventListener("pointermove",e=>{if(sdrag)setSpin(e)});
sp.addEventListener("pointerup",()=>sdrag=false);sp.addEventListener("pointercancel",()=>sdrag=false);
sp.addEventListener("keydown",e=>{if(st.phase!=="aim"||st.turn!=="you")return;if(e.key==="ArrowUp"){st.spin=Math.min(1,st.spin+.1);showSpin();e.preventDefault()}if(e.key==="ArrowDown"){st.spin=Math.max(-1,st.spin-.1);showSpin();e.preventDefault()}});

// fine aim
function holdBtn(el,dir){let timer=null,t0=0;
  const go=()=>{if(st.phase==="aim"&&st.turn==="you"){const held=performance.now()-t0;st.aim+=dir*(held>900?.35:held>400?.12:.04)*DEG}};
  el.addEventListener("pointerdown",e=>{ensureAudio();e.preventDefault();t0=performance.now();go();clearInterval(timer);timer=setInterval(go,30)});
  const stop=()=>{clearInterval(timer);timer=null};el.addEventListener("pointerup",stop);el.addEventListener("pointerleave",stop);el.addEventListener("pointercancel",stop);
}
holdBtn($("rotL"),-1);holdBtn($("rotR"),1);
window.addEventListener("keydown",e=>{if(st.phase!=="aim"||st.turn!=="you")return;
  if(e.key==="ArrowLeft"){st.aim-=(e.shiftKey?1.5:.1)*DEG;e.preventDefault()}if(e.key==="ArrowRight"){st.aim+=(e.shiftKey?1.5:.1)*DEG;e.preventDefault()}});

// HUD buttons
$("snd").addEventListener("click",()=>{ensureAudio();st.sound=!st.sound;store.set("c9_sound",st.sound?"1":"0");hud()});
$("diff").addEventListener("change",e=>{st.diff=e.target.value;store.set("c9_diff",st.diff)});
$("newBtn").addEventListener("click",()=>{ensureAudio();newGame()});
$("againBtn").addEventListener("click",()=>{ensureAudio();newGame()});
$("startBtn").addEventListener("click",()=>{ensureAudio();$("startOv").hidden=true;SFX.cue(.5);st.phase="aim"});
$("rotBtn").addEventListener("click",()=>{$("rotOv").style.display="none"});
document.addEventListener("pointerdown",ensureAudio,{once:true});

// boot
new ResizeObserver(resize).observe(wrap);resize();
newGame();st.phase="start";
requestAnimationFrame(frame);
})();
</script>

</body></html>
