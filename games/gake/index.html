<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>崖っぷちドライブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: one-screen app — top-down cliff road on top, car dashboard with a slide-to-steer wheel below. Single dark look by choice. */
:root{
  --abyss:#10162a;
  --rock:#a27d52;
  --signal:#e8472b;
  --dash:#1b191e;
  --dash-2:#2a262d;
  --gauge:#f2b441;
  --ink:#f3ead8;
  --muted:#a89f93;
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:var(--abyss)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--abyss);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#pbar{flex:1;min-width:40px;height:8px;margin-right:0!important;border-radius:999px;background:rgba(16,22,42,.7);box-shadow:inset 0 0 0 1px rgba(243,234,216,.18);overflow:hidden}
#pbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gauge),var(--signal))}
#hud{position:absolute;left:12px;right:14px;top:10px;display:flex;align-items:center;gap:12px;pointer-events:none}
#btnPause{pointer-events:auto;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(243,234,216,.28);background:rgba(16,22,42,.7);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}
#btnPause i{display:block;width:4px;height:13px;border-radius:2px;background:var(--ink)}
#btnPause:focus-visible{outline:2px solid var(--gauge)}
#pause .menu{display:flex;flex-direction:column;gap:10px;width:min(100%,240px)}
#pause .btn2{width:100%;padding:11px 18px;font-size:15px}
#pause .btn{width:100%}
#stg{margin-right:4px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--gauge);text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
#time{flex:none;white-space:nowrap;overflow:hidden;font-family:var(--f-body);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.5)}

/* overlays */
.ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:24px;text-align:center;background:linear-gradient(180deg,rgba(16,22,42,.55),rgba(16,22,42,.85))}
.ov h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,9vw,44px);white-space:nowrap;line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance;color:var(--ink);text-shadow:0 4px 0 #5d4630,0 8px 18px rgba(0,0,0,.5)}
.ov h1 span{color:var(--signal)}
.ov h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,11vw,52px);margin:0;letter-spacing:.04em}
.ov p{margin:0;max-width:22em;line-height:1.7;font-size:15px;color:var(--ink)}
.ov .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ov .big{font-family:var(--f-body);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;letter-spacing:.12em;padding:3px 10px;border-radius:999px;background:var(--gauge);color:#1b191e;font-weight:700}
.btn{font-family:var(--f-display);font-size:22px;letter-spacing:.08em;color:#fff;background:var(--signal);border:0;border-radius:14px;padding:14px 40px;box-shadow:0 5px 0 #8f2615,0 10px 20px rgba(0,0,0,.35);cursor:pointer;margin-top:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8f2615}
.btn:focus-visible{outline:3px solid var(--gauge);outline-offset:3px}
#over h2{color:var(--signal)}
#title h1{margin-block:auto}
#title{justify-content:flex-end;gap:10px;padding-bottom:16px;background:linear-gradient(180deg,rgba(16,22,42,0) 0%,rgba(16,22,42,.25) 30%,rgba(16,22,42,.88) 62%)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(100%,360px)}
.pg{width:40px;height:40px;border-radius:50%;border:1px solid rgba(243,234,216,.3);background:rgba(27,25,30,.85);color:var(--ink);font-size:15px;cursor:pointer;flex:none}
.pg:disabled{opacity:.25;cursor:default}
.pg:focus-visible{outline:2px solid var(--gauge)}
#pgLabel{display:flex;flex-direction:column;align-items:center;line-height:1.2}
#pgLabel b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.08em}
#pgLabel small{font-size:11px;color:var(--muted);letter-spacing:.1em}
#title.ex #pgLabel b{color:var(--signal)}
#title.nm #pgLabel b{color:#ff9a4a}
.st.nm i{display:none}
#pager{width:min(100%,360px);overflow:hidden}
#pages{display:flex;transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.grid{flex:0 0 100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:3px}
.note{font-size:12px;color:var(--muted);min-height:2.2em;display:flex;align-items:center}
#title.ex .note{color:#fff;font-weight:700;background:var(--signal);border-radius:8px;padding:4px 12px}
#btnStart{margin-top:4px;white-space:nowrap;max-width:100%;font-size:clamp(16px,5.4vw,22px);letter-spacing:.04em;padding-inline:clamp(20px,7vw,40px)}
@media (prefers-reduced-motion:reduce){#pages{transition:none}}
.st{font-family:var(--f-body);color:var(--ink);background:rgba(27,25,30,.85);border:1.5px solid rgba(243,234,216,.22);border-radius:12px;padding:4px 2px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;min-width:0}
.st b{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,6.4vw,28px);line-height:1}
.st small{font-size:clamp(11px,3.3vw,14px);font-weight:700;letter-spacing:-.02em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.st i{display:block;height:3px;width:70%;border-radius:2px;background:linear-gradient(90deg,var(--gauge) var(--lv),rgba(243,234,216,.15) var(--lv))}
.st.clr{border-color:var(--gauge);background:rgba(242,180,65,.14)}
.st.clr small{color:var(--gauge)}
.st.ex i{background:linear-gradient(90deg,var(--signal) var(--lv),rgba(243,234,216,.15) var(--lv))}
.st.endless{grid-column:1/-1;grid-row:span 2;aspect-ratio:auto;flex-direction:row;justify-content:center;gap:14px;padding:18px 12px;border-color:var(--gauge)}
.st.endless b{font-size:40px}
.st.endless span{font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.st.endless small{font-size:12px;color:var(--gauge)}
#title.en #pgLabel b{color:var(--gauge)}
#title.en .note{color:var(--ink)}
#title.rd #pgLabel b{color:#7fd3e6}
.st.rnd{border-color:#7fd3e6;grid-row:span 1;flex-wrap:wrap;row-gap:4px}
.st.rnd small{color:#7fd3e6;flex-basis:100%;font-size:12px}
.rbtns{grid-column:1/-1;display:flex;gap:8px}
.rbtns .btn2{flex:1;padding:10px 8px;font-size:13px}
#rset{z-index:8;justify-content:flex-start;padding-block:12px;background:rgba(16,22,42,.97)}
.rpanel{width:min(100%,420px);max-height:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.rpanel h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.04em;color:#7fd3e6;text-align:center}
#rlist{overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px;padding-right:4px;overscroll-behavior:contain;touch-action:pan-y}
.rpre{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.rpre .btn2{flex:1;padding:7px 4px;font-size:12px}
.rrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;background:rgba(27,25,30,.75);border:1px solid rgba(243,234,216,.14);border-radius:10px;padding:7px 12px}
.rrow span{font-size:13px}
.rrow b{font-size:14px;color:#7fd3e6;font-variant-numeric:tabular-nums}
.rrow input[type=range]{grid-column:1/-1;width:100%;accent-color:#7fd3e6;margin:2px 0}
.rrow.chk input{width:20px;height:20px;accent-color:#7fd3e6}
.rrow.seed{grid-template-columns:1fr auto}
.rrow.seed span{grid-column:1/-1}
.rrow.seed input{font:inherit;font-size:15px;color:var(--ink);background:rgba(16,22,42,.8);border:1px solid rgba(243,234,216,.25);border-radius:8px;padding:6px 10px;min-width:0}
.rrow.seed .btn2{padding:7px 12px;font-size:12px}
.rmsg{margin:0;font-size:12px;color:#fff;background:var(--signal);border-radius:8px;padding:6px 10px}
.rfoot{display:flex;gap:8px;align-items:center}
.rfoot .btn2{padding:10px 12px;font-size:13px;flex:none}
.rfoot .btn{flex:1;font-size:16px;padding:12px 10px;margin:0;white-space:nowrap}
.st.sel{border-color:var(--ink);background:rgba(232,71,43,.35);box-shadow:0 0 0 2px var(--signal)}
.st:active{transform:translateY(2px)}
.st:focus-visible,.btn2:focus-visible{outline:2px solid var(--gauge);outline-offset:2px}
.btn2{font-family:var(--f-body);font-weight:700;font-size:14px;color:var(--ink);background:rgba(243,234,216,.08);border:1px solid rgba(243,234,216,.28);border-radius:999px;padding:9px 18px;cursor:pointer}
.escore{display:flex;align-items:baseline;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.escore small{font-size:12px;color:var(--muted);letter-spacing:.1em}
.escore b{font-family:var(--f-body);font-weight:700;font-size:44px;line-height:1.1;color:var(--ink)}
.escore span{font-size:18px;font-weight:700}
.ebest{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ebest b{color:var(--ink)}
.newrec{font-family:var(--f-display);font-size:26px;color:var(--gauge);letter-spacing:.06em;text-shadow:0 3px 0 #5d4630;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.newrec{animation:none}}
.hint{font-size:clamp(10px,3.2vw,13px);white-space:nowrap;line-height:1.6;max-width:100%;color:var(--ink);background:rgba(27,25,30,.8);border:1px solid rgba(242,180,65,.35);border-radius:10px;padding:8px 14px;margin-top:6px}
.hint b{color:var(--gauge)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#goal h2{color:var(--gauge)}

/* dashboard */
#panel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px 6px;padding:20px 14px calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box;position:relative;height:min(38vh,330px);flex:none;background:
  radial-gradient(120% 90% at 50% 0%,var(--dash-2),var(--dash) 70%);
  border-top:3px solid #0b0a0d;touch-action:none;cursor:grab;overflow:hidden;
}
#panel::before{content:"";position:absolute;left:10px;right:10px;top:8px;border-top:2px dashed rgba(242,180,65,.28)}
#panel:active{cursor:grabbing}
#wheelWrap{grid-column:1/-1;height:100%;aspect-ratio:1;max-width:min(78vw,280px);max-height:280px;justify-self:center;align-self:center;min-height:0}
#wheel{width:100%;height:100%;display:block;will-change:transform;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.w-rim{fill:none;stroke:#232126;stroke-width:22}
.w-grip{fill:none;stroke:#34303a;stroke-width:22;stroke-dasharray:3 7}
.w-hl{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
.w-mark{fill:none;stroke:var(--signal);stroke-width:22}
.w-spoke{fill:#3a3640}
.w-hub{fill:#2b282f;stroke:#4b4652;stroke-width:3}
.w-emb{fill:var(--gauge)}
#readR{justify-self:end;pointer-events:auto}
#snd{position:absolute;top:10px;right:12px;z-index:5;background:rgba(16,22,42,.7)!important;white-space:nowrap;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink);background:rgba(243,234,216,.08);border:1px solid rgba(243,234,216,.2);border-radius:999px;padding:7px 12px;cursor:pointer}
#snd[aria-pressed="false"]{color:var(--muted)}
#snd:focus-visible{outline:2px solid var(--gauge)}
#ptop{grid-column:1/-1;padding-top:2px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#hint{text-align:center;font-size:11px;letter-spacing:.12em;white-space:nowrap;color:var(--muted);pointer-events:none}
#track{position:relative;width:110px;height:4px;border-radius:2px;background:rgba(243,234,216,.12)}
#track i{position:absolute;top:-3px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gauge)}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
@media (max-width:390px){#hint{font-size:10px;letter-spacing:0}#snd{padding:6px 9px;font-size:10px}#track{width:90px}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="崖の道を真上から見たゲーム画面"></canvas>
    <button id="snd" aria-pressed="true">サウンド ON</button>
    <div id="hud" hidden><button id="btnPause" aria-label="ポーズ"><i></i><i></i></button><div id="stg">STAGE 1</div><div id="time">00:00.00</div><div id="pbar"><i id="pfill"></i></div></div>

    <div class="ov" id="title">
      <h1>崖っぷち<span>ドライブ</span></h1>
      <div class="pnav">
        <button class="pg" id="pgPrev" aria-label="NORMALモードへ">◀</button>
        <div id="pgLabel"><b>NORMAL</b><small>STAGE 1–10</small></div>
        <button class="pg" id="pgNext" aria-label="HARDモードへ">▶</button>
      </div>
      <div id="pager"><div id="pages"><div class="grid" id="grid0"></div><div class="grid" id="grid1"></div><div class="grid" id="grid2"></div><div class="grid" id="grid3"></div><div class="grid" id="grid4"></div></div></div>
            <button class="btn" id="btnStart">EASY 1 スタート</button>
    </div>
    <div class="ov" id="rset" hidden>
      <div class="rpanel">
        <h3>RANDOM コース設定</h3>
        <div id="rlist"></div>
        <p class="rmsg" id="rmsg" hidden></p>
        <div class="rfoot"><button class="btn2" id="rdef">初期値</button><button class="btn2" id="rclose">閉じる</button><button class="btn" id="rgen">この設定で生成</button></div>
      </div>
    </div>
    <div class="ov" id="pause" hidden>
      <div class="sub" id="pauseStage">STAGE</div>
      <h2>ポーズ</h2>
      <div class="menu">
        <button class="btn" id="btnResume">再開</button>
        <button class="btn2" id="sndP" aria-pressed="true">サウンド ON</button>
        <button class="btn2" id="btnRestartP">やり直し</button>
        <button class="btn2" id="btnTitleP">タイトルに戻る</button>
      </div>
    </div>
    <div class="ov" id="over" hidden>
      <div class="sub" id="ovStage">STAGE 1</div>
      <h2>転落…</h2>
      <div id="eScore" hidden>
        <div class="newrec" id="newRecE" hidden>新記録！</div>
        <div class="escore"><small>スコア</small><b id="eDist">0</b><span>m</span></div>
        <div class="ebest">自己ベスト <b id="eBest">0 m</b></div>
      </div>
      <p id="ovLine"><span id="ovLbl">到達</span> <b id="ovProg">0%</b> ・ <span id="ovTime">0.00</span>秒</p>
      <button class="btn" id="btnRetry1">もう一度</button>
      <button class="btn2" id="btnSel1">タイトルに戻る</button>
      <div class="sub" id="bestOver"></div>
      <p class="hint"><b>ヒント</b>：指を離すとハンドルが中央に戻ります</p>
    </div>
    <div class="ov" id="goal" hidden>
      <span class="tag" id="newRec" hidden>ベスト更新</span>
      <h2>ゴール！</h2>
      <div class="sub" id="goalStage">STAGE 1 クリア</div>
      <div class="big" id="goalTime">00:00.00</div>
      <button class="btn" id="btnNext">次のステージへ</button>
      <div class="row"><button class="btn2" id="btnRetry2">もう一度</button><button class="btn2" id="btnSel2">タイトルに戻る</button></div>
      <div class="sub" id="bestGoal"></div>
    </div>
  </div>

  <div id="panel" hidden aria-label="ハンドル操作エリア。左右にスライドしてハンドルを切る">
    <div id="ptop"><div id="hint">◀ スライドしてハンドル ▶</div><div id="track"><i id="knob"></i></div></div>
    <div id="wheelWrap">
      <svg id="wheel" viewBox="-100 -100 200 200" aria-hidden="true">
        <path class="w-spoke" d="M-78 -8 L-24 -14 L-24 14 L-78 12 Z"/>
        <path class="w-spoke" d="M78 -8 L24 -14 L24 14 L78 12 Z"/>
        <path class="w-spoke" d="M-14 22 L14 22 L10 80 L-10 80 Z"/>
        <circle class="w-rim" r="84"/>
        <circle class="w-grip" r="84"/>
        <circle class="w-hl" r="92"/>
        <path class="w-mark" d="M-9 -83.5 A84 84 0 0 1 9 -83.5"/>
        <circle class="w-hub" r="28"/>
        <path class="w-emb" d="M-12 6 L0 -12 L12 6 L6 6 L0 -3 L-6 6 Z"/>
      </svg>
    </div>
  </div>
</div>

const STAGE_SPEED=109;  // 60 km/h, constant in NORMAL/HARD

function nearest(x,y){
  let best=1e12,bi=S.idx;const a=Math.max(0,S.idx-25),b=Math.min(N-2,S.idx+60);
  for(let i=a;i<=b;i++){const p=PTS[i],q=PTS[i+1],dx=q.x-p.x,dy=q.y-p.y;
    let t=((x-p.x)*dx+(y-p.y)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
    const ex=p.x+dx*t-x,ey=p.y+dy*t-y,d=ex*ex+ey*ey;if(d<best){best=d;bi=i;}}
  return{i:bi,d:Math.sqrt(best)};
}
function startFall(){
  S.mode='fall';S.fallT=0;const c=S.car,p=PTS[S.idx];
  // outward push
  const nx=c.x-p.x,ny=c.y-p.y,nl=Math.hypot(nx,ny)||1;
  S.fv={x:Math.sin(c.h)*S.speed+nx/nl*40,y:-Math.cos(c.h)*S.speed+ny/nl*40};
  S.spin=(S.steer>=0?1:-1)*(2.2+Math.random()*2);S.shake=9;
  for(let i=0;i<16;i++){const a=Math.random()*6.28,v=20+Math.random()*60;
    S.debris.push({x:c.x+(Math.random()-.5)*16,y:c.y+(Math.random()-.5)*16,vx:Math.cos(a)*v+S.fv.x*.4,vy:Math.sin(a)*v+S.fv.y*.4,r:1.5+Math.random()*2.5,t:0});}
  bgmStop();SFX.fall();try{navigator.vibrate&&navigator.vibrate([60,40,120]);}catch(_){}
}
function update(dt){

  else if(inp.keys.L||inp.keys.R){const t=(inp.keys.R?1:0)-(inp.keys.L?1:0);S.steer+=(t-S.steer)*Math.min(1,dt*4);}
  else S.steer+=(0-S.steer)*Math.min(1,dt*5);
  wheel.style.transform='rotate('+(S.steer*240).toFixed(1)+'deg)';
  knob.style.transform='translateX('+(S.steer*55).toFixed(1)+'px)';

  const c=S.car;
  if(S.mode==='count'){
    S.count-=dt;const n=Math.ceil(S.count);
    if(n!==S.lastCount&&n>0){S.lastCount=n;SFX.count();}
    if(S.count<=0){S.mode='run';SFX.go();bgmStart();}
  }else if(S.mode==='run'){
    S.time+=dt;
    S.speed=ENDLESS?ESPD((S.idx-START_I)*4):STAGE===RANDOM_K?KMH(RO.speed+RO.accel*S.prog):STAGE_SPEED;
    if(S.air){   // airborne: no steering, straight line at take-off heading
      S.airT+=dt;S.warn=false;c.x+=Math.sin(c.h)*S.speed*dt;c.y-=Math.cos(c.h)*S.speed*dt;
      if(S.airT>=S.airDur){S.air=false;S.idx=S.airLand;const n=nearest(c.x,c.y);S.idx=n.i;
        if(n.d>HALF+FM||PTS[n.i].gap)startFall();else{SFX.land();S.shake=5;}}
    }else{
    c.h+=S.steer*TURN*TURN_K*dt;
    c.x+=Math.sin(c.h)*S.speed*dt;c.y-=Math.cos(c.h)*S.speed*dt;
    const n=nearest(c.x,c.y);S.idx=n.i;S.prog=Math.max(0,Math.min(1,(n.i-START_I)/(GOAL_I-START_I)));
    S.warn=n.d>HALF-CAR_HW;

    if(Math.abs(S.steer)>.72){const cs=Math.cos(c.h),sn=Math.sin(c.h);
      for(const s of[-1,1])S.skids.push({x:c.x+cs*s*8-sn*10,y:c.y+sn*s*8+Math.cos(c.h)*10});
      if(S.skids.length>700)S.skids.splice(0,S.skids.length-700);}

    else if(S.idx>=GOAL_I){S.mode='goal';bgmStop();SFX.goal();
      const key=STAGE+1;let rec=false;if(STAGE!==RANDOM_K&&(!bests[key]||S.time<bests[key])){bests[key]=+S.time.toFixed(2);rec=true;saveBests();}
      $('goalTime').textContent=fmt(S.time);$('newRec').hidden=!rec;showBest();
      const last=STAGE%10===9&&STAGE!==RANDOM_K;
      $('goalStage').textContent=last?MODES[Math.floor(STAGE/10)]+' 全10ステージ制覇！':stageName(STAGE)+' クリア';
      $('btnNext').hidden=last;if(!last)$('btnNext').textContent=STAGE===RANDOM_K?'別のコースへ':stageName(STAGE+1)+' へ';
      fireworks();setTimeout(()=>{if(S.mode==='goal')$('goal').hidden=false;},900);}
    }

    c.x+=S.fv.x*dt;c.y+=S.fv.y*dt;S.rot+=S.spin*dt*Math.min(1,S.fallT*2);
    if(S.fallT>1.9){S.mode='over';$('ovStage').textContent=stageName(STAGE);
      if(ENDLESS){const m=Math.floor(Math.max(0,S.idx-START_I)*.4);let rec=false;if(m>(bests.E||0)){bests.E=m;rec=true;saveBests();}
        $('eDist').textContent=m.toLocaleString();$('eBest').textContent=(bests.E||0).toLocaleString()+' m';$('newRecE').hidden=!rec;
        if(rec)[72,79,84,88].forEach((n,i)=>tone(mtof(n),.18,'square',.08,.25+i*.1));}
      else{$('ovProg').textContent=Math.floor(S.prog*100)+'%';}
      $('eScore').hidden=!ENDLESS;$('ovLine').hidden=ENDLESS;$('bestOver').hidden=ENDLESS;
      $('ovTime').textContent=S.time.toFixed(2);showBest();$('over').hidden=false;}
  }
  for(const d of S.debris){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.97;d.vy*=.97;}
  S.shake*=Math.exp(-dt*6);

  // camera: look ahead of the car
  const la=(S.mode==='fall'||S.mode==='over')?0:H*.2/ZOOM;
  let tx=c.x+Math.sin(c.h)*la, ty=c.y-Math.cos(c.h)*la;
  if(S.mode==='title'){S.pv=(S.pv||0)+dt*240;
    if(ENDLESS){egEnsure(Math.floor(S.pv/4));if(S.pv/4>1200)previewCam();}
    else if(S.pv/4>N+80)previewCam();
    const q=PTS[Math.max(PV0,Math.min(N-1,Math.floor(S.pv/4)))];tx=q.x;ty=q.y+pvOff();}

  S.cam.x+=(tx-S.cam.x)*f;S.cam.y+=(ty-S.cam.y)*f;

  if(ENDLESS&&S.mode!=='title')egEnsure(S.idx);
  {const w=Math.round(S.prog*500)/5;if(w!==S.pw){S.pw=w;$('pfill').style.width=w+'%';}}
  $('time').textContent=ENDLESS?Math.floor(Math.max(0,S.idx-START_I)*.4)+' m':fmt(S.time);
  audioFrame();
}

// ================= RENDER =================
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);}
function drawCar(steer,alpha){
  g.globalAlpha=alpha;
  g.fillStyle='rgba(0,0,0,.35)';rr(-8,-13,20,34,6);g.fill();
  g.fillStyle='#111';
  for(const s of[-1,1]){g.save();g.translate(s*9.5,-9);g.rotate(steer*.5);g.fillRect(-2,-4.5,4,9);g.restore();
    g.fillRect(s*9.5-2,5,4,9);}
  g.fillStyle='#e8472b';rr(-9,-16,18,32,6);g.fill();
  g.fillStyle='#ff7a55';rr(-3,-15,6,9,2);g.fill();
  g.fillStyle='#9fd3e6';g.beginPath();g.moveTo(-7,-2);g.lineTo(7,-2);g.lineTo(5.5,-7);g.lineTo(-5.5,-7);g.closePath();g.fill();
  g.fillStyle='#b8301b';rr(-7,-2,14,10,3);g.fill();
  g.fillStyle='#7fb3c6';rr(-6,9,12,3,1.5);g.fill();
  g.fillStyle='#fff6c2';g.fillRect(-7.5,-16.5,4,2);g.fillRect(3.5,-16.5,4,2);
  g.fillStyle='#6b0f08';g.fillRect(-7.5,14.5,4,2);g.fillRect(3.5,14.5,4,2);
  g.globalAlpha=1;
}
function drawFalling(){
  const c=S.car,t=S.fallT,e=Math.min(1,t/1.45),ease=e*e;
  for(const d of S.debris){const s=Math.max(0,1-d.t/1.2);if(s<=0)continue;
    g.fillStyle='rgba(162,125,82,'+(s)+')';g.beginPath();g.arc(d.x,d.y,d.r*s,0,7);g.fill();}
  const sc=1-.86*ease, al=t>1.25?Math.max(0,1-(t-1.25)/.5):1;
  g.save();g.translate(c.x,c.y);g.rotate(c.h+S.rot);g.scale(sc,sc);
  drawCar(S.steer,al);
  g.globalAlpha=al*Math.min(.75,ease*.9);g.fillStyle='#10162a';rr(-10,-17,20,34,6);g.fill();g.globalAlpha=1;
  g.restore();
}
function mod(a,b){return((a%b)+b)%b;}
// ---- fireworks (goal) ----
const FWC=['#f2b441','#e8472b','#ffd98a','#7fd3e6','#f3ead8','#ff8a5c'];
function fireworks(){for(let i=0;i<9;i++)FWq.push({t:clock+.15+i*.32+Math.random()*.15});}
function fwBurst(){const x=W*(.18+Math.random()*.64),y=H*(.12+Math.random()*.36),c=FWC[(Math.random()*FWC.length)|0],c2=FWC[(Math.random()*FWC.length)|0],n=46;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,v=90+Math.random()*120;FW.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:1.1+Math.random()*.5,c:i%3?c:c2});}
  FW.push({x,y,flash:1,t:0,life:.25});
  noise(.12,.35,'lowpass',1400,0,200);tone(70,.3,'sine',.4,0,null,40);
  for(let i=0;i<6;i++)noise(.03,.12,'highpass',5000,.15+Math.random()*.6);}
function fwUpdate(dt){while(FWq.length&&FWq[0].t<=clock){FWq.shift();fwBurst();}
  for(let i=FW.length-1;i>=0;i--){const p=FW[i];p.t+=dt;if(p.t>=p.life){FW.splice(i,1);continue;}
    if(!p.flash){p.vx*=Math.exp(-dt*1.8);p.vy=p.vy*Math.exp(-dt*1.8)+60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}}
function fwDraw(){if(!FW.length)return;g.save();g.globalCompositeOperation='lighter';
  for(const p of FW){const k=1-p.t/p.life;
    if(p.flash){const r=60*(1-k)+20;const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r);gr.addColorStop(0,'rgba(255,240,200,'+k+')');gr.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill();continue;}
    g.globalAlpha=Math.min(1,k*1.4);g.strokeStyle=p.c;g.lineWidth=2.4;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);g.stroke();}
  g.restore();}
let clock=0;
function render(){
  let rp=roadPath,dashOff=0;if(ENDLESS){const c=S.mode==='title'?Math.floor((S.pv||0)/4):S.idx;
    const i0=Math.max(0,c-300),i1=Math.min(PTS.length-1,c+480);dashOff=PTS[i0].s||0;rp=roadPathOf(i0,i1);}
  g.setTransform(DPR,0,0,DPR,0,0);
  const cx=S.cam.x,cy=S.cam.y;
  const shx=(Math.random()-.5)*S.shake,shy=(Math.random()-.5)*S.shake;
  // valley floor (parallax, far below)
  const par=.35,gs=ZOOM*.7;
  g.save();const tx=W/2-cx*par*ZOOM,ty=H/2-cy*par*ZOOM;g.translate(tx,ty);g.scale(gs,gs);
  g.fillStyle=groundPat;g.fillRect(-tx/gs,-ty/gs,W/gs,H/gs);g.restore();
  g.fillStyle='rgba(16,22,42,.55)';g.fillRect(0,0,W,H);
  // clouds (between floor and cliff top)
  for(const c of clouds){
    const sx=W/2+(mod(c.x+clock*c.v-cx*.7+700,1400)-700)*ZOOM;
    const sy=H/2+(mod(c.y-cy*.7+700,1400)-700)*ZOOM;
    const r=70*c.s*ZOOM;const gr=g.createRadialGradient(sx,sy,0,sx,sy,r);
    gr.addColorStop(0,'rgba(220,228,240,.20)');gr.addColorStop(1,'rgba(220,228,240,0)');
    g.fillStyle=gr;g.beginPath();g.ellipse(sx,sy,r*1.5,r,0,0,7);g.fill();}

  g.save();g.translate(W/2+shx,H/2+shy);g.scale(ZOOM,ZOOM);g.translate(-cx,-cy);
  g.lineJoin='round';g.lineCap='butt';
  const falling=S.mode==='fall'||S.mode==='over';
  if(falling&&S.fallT>.22)drawFalling();
  // cliff shadow + face + top
  g.save();g.translate(12,20);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=RIM+8;g.stroke(rp);g.restore();
  g.save();g.translate(0,9);g.strokeStyle='#5a4330';g.lineWidth=RIM;g.stroke(rp);g.restore();
  g.strokeStyle='#a27d52';g.lineWidth=RIM;g.stroke(rp);
  g.strokeStyle='#b89066';g.lineWidth=RIM-12;g.stroke(rp);
  for(const p of pebbles){if(Math.abs(p.x-cx)*ZOOM>W||Math.abs(p.y-cy)*ZOOM>H)continue;
    g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}
  g.fillStyle='#6f7d3c';
  for(const t of tufts){if(Math.abs(t.x-cx)*ZOOM>W||Math.abs(t.y-cy)*ZOOM>H)continue;
    g.beginPath();g.arc(t.x,t.y,t.r,0,7);g.arc(t.x+2,t.y-1.5,t.r*.7,0,7);g.fill();}
  // road
  g.strokeStyle='#efe6d2';g.lineWidth=ROAD;g.stroke(rp);
  g.strokeStyle='#34343b';g.lineWidth=ROAD-6;g.stroke(rp);
  if(!NARROW){g.save();g.setLineDash([14,16]);g.lineDashOffset=dashOff;g.strokeStyle='rgba(242,180,65,.8)';g.lineWidth=2.2;g.lineCap='butt';g.stroke(rp);g.restore();}
  // jump ramps: yellow/black band + arrows right before each gap
  {const ci=ENDLESS&&S.mode==='title'?Math.floor((S.pv||0)/4):S.idx,i0=Math.max(0,ci-300),i1=Math.min(PTS.length-2,ci+480),lo=ENDLESS?i0:0,hi=ENDLESS?i1:N-2;
   for(let i=lo;i<=hi;i++){if(PTS[i].gap||!PTS[i+1].gap)continue;const p=PTS[i];
     if(Math.abs(p.x-cx)*ZOOM>W+80||Math.abs(p.y-cy)*ZOOM>H+80)continue;
     g.save();g.translate(p.x,p.y);g.rotate(p.h);const w=ROAD-6;
     g.fillStyle='#f2b441';g.fillRect(-w/2,0,w,26);g.save();g.beginPath();g.rect(-w/2,0,w,26);g.clip();
     g.fillStyle='#1b191e';for(let x=-w/2-26;x<w/2;x+=12){g.beginPath();g.moveTo(x,26);g.lineTo(x+6,26);g.lineTo(x+32,0);g.lineTo(x+26,0);g.fill();}g.restore();
     g.fillStyle='rgba(242,180,65,.85)';for(const y of[46,70]){g.beginPath();g.moveTo(0,y-10);g.lineTo(9,y);g.lineTo(-9,y);g.closePath();g.fill();}
     g.restore();}}
  // start & goal
  {const p=PTS[START_I];g.save();g.translate(p.x,p.y);g.rotate(p.h);
   g.fillStyle='#efe6d2';g.fillRect(-HALF+3,-2,ROAD-6,4);
   g.font='700 11px "Zen Kaku Gothic New",sans-serif';g.textAlign='center';g.fillStyle='rgba(239,230,210,.8)';g.fillText('START',0,-8);g.restore();}
  if(!ENDLESS){const p=PTS[GOAL_I];g.save();g.translate(p.x,p.y);g.rotate(p.h);const sq=(ROAD-6)/8;
   for(let r=0;r<2;r++)for(let i=0;i<8;i++){g.fillStyle=(i+r)%2?'#1b191e':'#f3ead8';g.fillRect(-HALF+3+i*sq,-sq+r*sq,sq,sq);}
   for(const s of[-1,1]){g.fillStyle='#444';g.fillRect(s*(HALF+8)-1.5,-2,3,3);
     g.fillStyle='#e8472b';g.beginPath();g.moveTo(s*(HALF+8),-2);g.lineTo(s*(HALF+8)+10,-6+Math.sin(clock*6)*2);g.lineTo(s*(HALF+8),-11);g.fill();}
   g.restore();}
  // skids
  g.fillStyle='rgba(15,15,18,.28)';for(const s of S.skids)g.fillRect(s.x-1.5,s.y-1.5,3,3);
  // car
  if(!falling){const c=S.car;const hg=S.air?Math.sin(Math.PI*Math.min(1,S.airT/S.airDur)):0;
    if(hg>0){g.save();g.translate(c.x+16*hg,c.y+26*hg);g.rotate(c.h);g.fillStyle='rgba(0,0,0,'+(.35-.15*hg)+')';g.beginPath();g.ellipse(0,0,10,17,0,0,7);g.fill();g.restore();}
    g.save();g.translate(c.x,c.y);g.rotate(c.h);g.scale(1+.45*hg,1+.45*hg);drawCar(S.steer,1);g.restore();}
  else if(S.fallT<=.22){const c=S.car;const k=S.fallT/.22;g.save();g.translate(c.x,c.y);g.rotate(c.h+S.rot);g.scale(1-.2*k,1);drawCar(S.steer,1);g.restore();}
  g.restore();

  fwUpdate(1/60);fwDraw();
  // edge warning vignette
  if(S.mode==='run'&&S.warn){const a=.25+.2*Math.sin(clock*18);
    const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);
    gr.addColorStop(0,'rgba(232,71,43,0)');gr.addColorStop(1,'rgba(232,71,43,'+a+')');g.fillStyle=gr;g.fillRect(0,0,W,H);
    g.font='24px "Dela Gothic One",sans-serif';g.textAlign='center';g.fillStyle='rgba(255,240,220,.92)';g.fillText('あぶない！',W/2,70);}
  // countdown
  if(S.mode==='count'){const n=Math.ceil(S.count),f=S.count-Math.floor(S.count);
    g.save();g.translate(W/2,H*.42);g.scale(1+f*.4,1+f*.4);g.globalAlpha=Math.min(1,f*2+.2);
    g.font='88px "Dela Gothic One",sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillStyle='#5a4330';g.fillText(String(n),0,5);g.fillStyle='#f3ead8';g.fillText(String(n),0,0);g.restore();}
  if(S.mode==='run'&&S.time<.8){g.globalAlpha=1-S.time/.8;g.font='64px "Dela Gothic One",sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillStyle='#f2b441';g.fillText('GO!',W/2,H*.42);g.globalAlpha=1;g.textBaseline='alphabetic';}
  // minimap
  if(S.mode!=='title'&&!ENDLESS){const mw=64,mh=Math.min(150,H*.3),mx=W-mw-12,my=40;const ext=Math.max(-bx0,bx1)+20;const s=Math.min((mw-12)/(2*ext),(mh-12)/(by1-by0));
   const ox=mx+mw/2+bx0*s,oy=my+(mh-(by1-by0)*s)/2;
   g.fillStyle='rgba(16,22,42,.6)';rr(mx,my,mw,mh,10);g.fill();
   g.save();g.translate(ox-bx0*s,oy-by0*s);g.scale(s,s);g.strokeStyle='rgba(243,234,216,.55)';g.lineWidth=2.2/s;g.lineJoin='round';g.stroke(rp);
   const gp=PTS[GOAL_I];g.fillStyle='#f2b441';g.beginPath();g.arc(gp.x,gp.y,3.2/s,0,7);g.fill();
   g.fillStyle='#e8472b';g.beginPath();g.arc(S.car.x,S.car.y,3.6/s,0,7);g.fill();g.restore();}
}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;clock+=dt;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
